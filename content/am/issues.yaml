# Amharic overlay for issues. Only translatable text; ids match content/issues.yaml.
# Unreviewed Amharic draft.
- id: housing
  label: "ቤት እና ተመጣጣኝነት"
  description: >
    ዲሲ ከባድ የቤት እጥረቷን እንዴት መፍታት እንዳለባት — የኪራይ ማረጋጊያን (rent stabilization)፣
    የተከራዮች የመግዛት መብቶችን (TOPA/DOPA)፣ የማህበራዊ ቤት ሞዴሎችን እና የቤት ምርት መተማመኛ
    ፈንድ (Housing Production Trust Fund) ጨምሮ።

- id: tenants_rights
  label: "የተከራዮች መብቶች"
  description: >
    ለዲሲ ተከራዮች የሚሰጡ ጥበቃዎች፣ የተከራዮች የመግዛት ዕድል አዋጅ (TOPA)፣ የአስቸኳይ ጊዜ የኪራይ
    ድጋፍ እና ፀረ-መፈናቀል እርምጃዎችን ጨምሮ።

- id: transit
  label: "ትራንስፖርት፣ ብስክሌቶች እና መንገዶች"
  description: >
    በሕዝብ ትራንስፖርት፣ በተጠበቁ የብስክሌት መሠረተ ልማቶች እና በእግረኞች ደህንነት ላይ ኢንቨስትመንት።

- id: mpd_ice
  label: "MPD እና የፌደራል ኢሚግሬሽን ማስከበር"
  description: >
    የዲሲ ሜትሮፖሊታን ፖሊስ ዲፓርትመንት (MPD) በኢሚግሬሽን ማስከበር ሥራዎች ላይ ከICE ወይም ከሌሎች
    የፌደራል ወኪሎች ጋር መተባበር አለበት ወይ።

- id: education
  label: "ትምህርት እና የወጣቶች አገልግሎቶች"
  description: >
    ለዲሲ የመንግሥት ትምህርት ቤቶች (DCPS እና charter)፣ ለማህበረሰብ ትምህርት ቤቶች፣ ለቅድመ-ልጅነት
    ትምህርት እና ለወጣቶች ከትምህርት ሰዓት ውጭ ፕሮግራሞች የሚደረግ የገንዘብ ድጋፍ።

- id: community_safety
  label: "የማህበረሰብ ደህንነት እና የጥቃት መከላከል"
  description: >
    ጥቃትን ለመቀነስ የሕዝብ-ጤና እና ማህበረሰብ-ተኮር አካሄዶች — የጥቃት አቋራጮችን (violence
    interrupters)፣ የNEAR Act ን እና በስነ-ልቦና ጉዳት ላይ የተመሰረቱ አገልግሎቶችን ጨምሮ — ከባህላዊ
    የፖሊስ ስልቶች የተለዩ።

- id: policing
  label: "ፖሊስ እና የወንጀል ፍትህ"
  description: >
    ለሕዝብ ደህንነት ባህላዊ የሕግ ማስከበር አካሄዶች፦ የMPD የሰው ኃይል ደረጃዎች፣ የወንጀል ቅጣቶች፣
    ከፍርድ በፊት እስራት እና እንደ Secure DC Omnibus Act ያሉ ሕጎች።

- id: youth_curfew
  label: "የወጣቶች የሰዓት እላፊ (Curfew)"
  description: >
    ዲሲ የወጣቶችን ወንጀል ለመቀነስ መሣሪያ አድርጋ ለአካለ መጠን ላልደረሱ የሰዓት እላፊ ማስከበር አለባት ወይ፣
    እና ማንኛውም እንዲህ ያለ ፖሊሲ ምን አማራጭ ፕሮግራም ሊያጅበው ይገባል።

- id: dc_statehood
  label: "የዲሲ ግዛትነት (Statehood)"
  description: >
    ዲስትሪክቱ ሙሉ ግዛትነትን እና በኮንግረስ ድምፅ የመስጠት ውክልናን እንዴት መከታተል እንዳለበት፣ ለዲሲ
    ነዋሪዎች የፌደራል ግብር ነፃ ማድረግን የመሳሰሉ አማራጭ አካሄዶችን ጨምሮ።

- id: economic_development
  label: "የኢኮኖሚ ልማት"
  description: >
    ንግዶችን ለመሳብ፣ የአካባቢ ሠራተኞችን ለመደገፍ እና ጤናማ የዲስትሪክት በጀት ለማስቀጠል የሚያስችሉ
    ፖሊሲዎች — ለንግድ ሪል እስቴት ክፍት ቦታዎች እና ለከተማ መሃል ማገገም የሚሰጡ ምላሾችን ጨምሮ።

- id: federal_workers
  label: "የፌደራል ሠራተኞች ጥበቃ"
  description: >
    ዲሲ ለትራምፕ ዘመን የጅምላ የፌደራል የሰው ኃይል ቅነሳዎች እንዴት ምላሽ መስጠት እንዳለባት፣ በዲስትሪክቱ
    ውስጥ ለሚኖሩ ወይም ለሚሰሩ ከ160,000 በላይ የፌደራል ሠራተኞችን ለመጠበቅ ክስ መመስረት፣ የመጠለያ
    ፖሊሲዎች ወይም የሕዝብ ተሟጋችነት መጠቀምን ጨምሮ።

- id: environment
  label: "አካባቢ እና ንፁህ ኃይል"
  description: >
    የዲሲ ወደ ታዳሽ ኃይል የሚደረግ ሽግግር፣ የአየር ንብረት ጥንካሬ፣ የአካባቢ ፍትህ እና እንደ ዳታ ሴንተሮች
    ያሉ ሰፊ መሠረተ ልማቶች በዲስትሪክቱ የኤሌክትሪክ መረብ እና አካባቢ ላይ የሚያሳድሩት ተጽእኖ።

- id: parks_recreation
  label: "ፓርኮች እና መዝናኛ"
  description: >
    ለዲሲ የፓርኮች እና መዝናኛ ዲፓርትመንት የሚደረግ የገንዘብ ድጋፍ እና ፕሮግራም — የመዝናኛ ማዕከል
    ሰዓቶችን፣ የወጣቶች የሥራ ፕሮግራሞችን፣ የአረጋውያን አገልግሎቶችን እና የሕዝብ አረንጓዴ ቦታዎችን ጨምሮ።

- id: sanitation
  label: "ንፅህና እና አይጦች"
  description: >
    ዲሲ ለአይጥ ቁጥጥር፣ ለቆሻሻ መሠረተ ልማት እና ለሕዝብ ንፅህና ያላት አካሄድ — አይጥ የማይገባባቸው
    የቆሻሻ መያዣዎችን በመላ ከተማው ማሰማራትን እና በማጥፋት ሥራ ላይ የDPW ቅንጅትን ማሳደግን ጨምሮ።

- id: harm_reduction
  label: "የጉዳት ቅነሳ እና የአደንዛዥ ዕፅ ፖሊሲ"
  description: >
    ዲሲ በሕግ ማስከበር እና በባህላዊ ሕክምና ላይ ብቻ ከመተማመን ይልቅ ለኦፒዮይድ ቀውስ የጉዳት ቅነሳ (harm
    reduction) አካሄዶችን መከተል አለባት ወይ — ሰዎች በህክምና ክትትል ስር አደንዛዥ ዕፅ መጠቀም
    የሚችሉባቸውን ደህንነቱ የተጠበቀ የመርፌ ቦታዎችን (overdose prevention centers) ጨምሮ።

- id: childcare
  label: "የህፃናት እንክብካቤ እና ቅድመ-ልጅነት"
  description: >
    ዲሲ የህፃናት እንክብካቤን ለሁሉም የዲስትሪክት ነዋሪዎች ተመጣጣኝ ለማድረግ የተደጎመ የህፃናት እንክብካቤን
    ማስፋት አለባት ወይ — በPre-K ማሻሻያ እና ማስፋፊያ ፕሮግራም (PKEEP) ላይ የተገነቡ ሁሉን አቀፍ
    ፕሮግራሞችን ጨምሮ።

- id: home_rule
  label: "ራስን በራስ ማስተዳደር (Home Rule) እና የፌደራል ጣልቃ ገብነት"
  description: >
    ዲሲ የበጀት እና የሕግ አወጣጥ ራስ-ገዝነቷን ከኮንግረስ ጣልቃ ገብነት እንዴት መከላከል እንዳለባት፣ እና እንደ
    ሜትሮፖሊታን ፖሊስ ዲፓርትመንት ያሉ የአካባቢ ተቋማትን ለመቆጣጠር ወይም ብሔራዊ ዘብ (National
    Guard) እና የፌደራል ወኪሎችን በከተማው ለማሰማራት የሚደረጉ የፌደራል ሙከራዎችን መቋቋም።

- id: food_access
  label: "የምግብ ተደራሽነት እና የምግብ ዋስትና"
  description: >
    ዲሲ የምግብ በረሃዎችን (food deserts) እና የምግብ ዋስትና እጦትን እንዴት መፍታት እንዳለባት — ከAnacostia
    በስተምስራቅ ባሉ አገልግሎት ባልደረሳቸው ወረዳዎች የግሮሰሪ ተደራሽነትን፣ በመንግሥት ባለቤትነት ወይም
    በማበረታቻ የሚቀርቡ የግሮሰሪ አማራጮችን እና እንደ የትምህርት ቤት እና የበጋ ምግቦች ያሉ የስነ-ምግብ
    ፕሮግራሞችን ጨምሮ።

- id: labor
  label: "ሥራዎች፣ ደመወዝ እና የሠራተኞች መብቶች"
  description: >
    ለዲሲ ሠራተኞች የሚሰጡ ጥበቃዎች እና ዕድሎች — ዝቅተኛ ደመወዝን (minimum wage)፣ የሚከፈልበት
    የቤተሰብ እና የህክምና ዕረፍትን፣ የሠራተኛ መስፈርቶችን እና የሰው ኃይል ልማት እና የአካባቢ ቅጥር
    ፕሮግራሞችን ጨምሮ።

- id: homelessness
  label: "ቤት አልባነት እና የመኖሪያ ዋስትና እጦት"
  description: >
    ዲሲ ለቤት አልባነት እንዴት ምላሽ መስጠት እንዳለባት — ቋሚ የድጋፍ መኖሪያ ቤትን እና "Housing First"
    አገልግሎቶችን፣ የአስቸኳይ ጊዜ መጠለያን እና የካምፕ ማፍረስ ሚናን ጨምሮ።
