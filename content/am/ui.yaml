# --- About page ---
about.page_title: "ስለዚህ ድረ-ገጽ"
about.what_is_title: "ይህ ምንድን ነው?"
about.what_is_body: >
  ለዋሽንግተን ዲሲ ሰኔ 16፣ 2026 የዴሞክራቲክ ፓርቲ የመጀመሪያ ዙር ምርጫዎች የቀረበ ነፃ እና ክፍት ምንጭ (open source) የመራጮች መመሪያ ነው። በ5-ነጥብ የላይከርት (Likert) ሚዛን በመጠቀም በእውነት በሚያስቡባቸው ጉዳዮች ላይ ተመስርተው ዕጩዎችን እንዲያወዳድሩ ይረዳዎታል።
about.sourcing_title: "የዕጩዎች አቋሞች እንዴት ይገኛሉ?"
about.sourcing_p1: >
  እያንዳንዱ የዕጩ አቋም በቀጥታ ከዋና ምንጭ ጋር መያያዝ አለበት — የዕጩው የራሱ የምርጫ ቅስቀሳ ድረ-ገጽ፣ ይፋዊ የመጠይቅ ምላሽ ወይም የተረጋገጠ የዜና ጽሑፍ። ምንም አቋም ያለ ጥቅስ አይዘረዘርም። የትኞቹ አቋሞች "ትክክል" እንደሆኑ የራሳችንን አስተያየት አንሰጥም።
about.sourcing_p2: >
  የአንድ ዕጩ አቋም ያልታወቀ ሲሆን — አንድን ጉዳይ በይፋ ስላላነሱ — ከመገመት ወይም ከመደምደም ይልቅ "ያልታወቀ" ብለን እንመለከተዋለን።
about.advisories_title: "ስለ ድጋፎች ማሳሰቢያዎች"
about.advisories_p1: >
  ይህ ድረ-ገጽ ስለ ድጋፎች ማሳሰቢያዎችን (እንደ "Free DC፦ ዕጩ X ን አትደርድሩ" ያሉ) ከምንጩ ጋር ቀጥተኛ አገናኝ ባለው የሶስተኛ ወገን አስተያየት መልክ ያሳያል። እነዚህ የዚህ ድረ-ገጽ የራሱ ምክሮች አይደሉም — በስም የተጠቀሱ ድርጅቶች ያሉትን ነገር የሚገልጹ ተጨባጭ ዘገባዎች ናቸው።
about.methodology_title: "ዘዴ (Methodology)"
about.methodology_intro: >
  እያንዳንዱ መልስ የ5-ነጥብ ሚዛን ይጠቀማል፦ <em>በጣም አልስማማም</em>፣ <em>አልስማማም</em>፣ <em>ገለልተኛ</em>፣ <em>እስማማለሁ</em>፣ <em>በጣም እስማማለሁ</em>። ለሚመልሱት ለእያንዳንዱ ጥያቄ የእርስዎን አቋም ከዕጩው አቋም ጋር በማነፃፀር በዚያ ሚዛን ላይ ስንት እርምጃ እንደሚራራቁ እንመለከታለን።
about.two_things_title: "የሚያዩዋቸው ሁለት ነገሮች፣ እና ለምን ሊለያዩ እንደሚችሉ"
about.two_things_body: >
  እያንዳንዱ የተነፃፀረ ጥያቄ <strong>መለያ (label)</strong> ያሳያል — ዋናው <span class="agree-pill agree-yes">እስማማለሁ</span>፣ <span class="agree-pill agree-partial">በከፊል</span> ወይም <span class="agree-pill agree-no">አልስማማም</span> — እንዲሁም የዕጩውን አጠቃላይ <strong>የተዛማጅነት&nbsp;መቶኛ</strong> ይመግባል። እነዚህ የተለያዩ ነገሮችን ይለካሉ፣ ስለዚህ ሊለያዩ ይችላሉ፦
about.label_rule_lead: >
  <strong>መለያው ግምታዊ ዋና ሐሳብ ነው፦ በየትኛው ወገን ነዎት?</strong> ቀላልና ግልጽ ህጎችን ይጠቀማል፦
about.label_rule_agree: >
  <strong>እስማማለሁ</strong> — ተመሳሳይ አቋም።
about.label_rule_partial: >
  <strong>በከፊል</strong> — በአንድ እርምጃ የተራራቀ፦ በ<em>ተመሳሳይ ወገን</em> ነዎት እና የሚለያዩት በጥንካሬ ብቻ ነው (ለምሳሌ፣ <em>በጣም እስማማለሁ</em> ከ<em>እስማማለሁ</em> ጋር)።
about.label_rule_disagree: >
  <strong>አልስማማም</strong> — በሁለት ወይም ከዚያ በላይ እርምጃ የተራራቀ። በተቃራኒ ወገኖች መሆን፣ ወይም አንዱ ገለልተኛ ሲሆን ሌላው ቁርጠኛ መሆን፣ እንደ አለመስማማት ይቆጠራል — እንደ "በከፊል" መስማማት አይደለም።
about.percentage_rule: >
  <strong>መቶኛው ጥቃቅን ዝርዝሩ ነው፦ በትክክል ምን ያህል ይራራቃሉ?</strong> ከልዩነቱ ጋር ቀስ በቀስ ይመዘናል — ለተመሳሳይ መልስ 100% እስከ ለፍፁም ተቃራኒ 0% — እና የመጨረሻው የተዛማጅነት መቶኛ ዕጩው የታወቀ ይፋዊ አቋም ባለበት በመለሷቸው እያንዳንዱ ጥያቄ ላይ የእነዚያ እሴቶች አማካይ ነው። በደረጃ መያዙ ከእይታዎ <em>በትንሹ</em> የራቀ ዕጩ <em>ፍጹም</em> ከተቃረነው በላይ እንዲደረደር የሚያስችለው ይህ ነው።
about.label_pct_diff: >
  በዚህ ምክንያት፣ አሁንም ለመቶኛው ከፊል መጠን (ለምሳሌ 50%) ባበረከተ ጥያቄ ላይ <span class="agree-pill agree-no">አልስማማም</span> የሚል መለያ ሊያዩ ይችላሉ። ይህ ሆን ተብሎ የተደረገ ነው፦ በተቃራኒ ወገኖች ሆነው አሁንም ቢሆን ከፍተኛውን ያህል ላይራራቁ ይችላሉ።
about.worked_examples_title: "የተሰሩ ምሳሌዎች"
about.worked_examples_intro: >
  እያንዳንዱ ጉዳይ ከተመሳሳይ መልስ ጀምሮ እስከ ፍፁም ተቃራኒ ድረስ በትክክል እንዴት እንደሚታይ ይኸውና — ከታች ያሉት ካርዶች በውጤቶችዎ ገጽ ላይ እንዳለው ጥያቄ-በጥያቄ ዝርዝር ሆነው ይታያሉ፦
about.example_line_one: "{n} እርምጃ የተራራቀ · ለተዛማጅነቱ {pct} ያበረክታል"
about.example_line_many: "{n} እርምጃዎች የተራራቀ · ለተዛማጅነቱ {pct} ያበረክታል"
about.candidate_col: "ዕጩ"
about.skip_note: >
  የሚዘሏቸው ጥያቄዎች — እና ዕጩው የታወቀ ይፋዊ አቋም የሌለበት ጥያቄዎች — ሙሉ በሙሉ ይገለላሉ። መለያ አያገኙም እና ለመቶኛው በፍፁም አይቆጠሩም።
about.insufficient_note: >
  ከመለሷቸው ጥያቄዎች በማንኛቸውም ላይ የታወቀ አቋም የሌለው ዕጩ በ0% ከመመዘን ይልቅ "በቂ ያልሆነ መረጃ" ተብሎ ይታያል።
about.coverage_note: >
  መቶኛ በጥቂት ጥያቄዎች ላይ ብቻ ሲመሰረት አሳሳች ሊሆን ስለሚችል፣ እያንዳንዱ ውጤት <strong>ሽፋኑን</strong> ያሳያል — ለምሳሌ "ከ29 ጥያቄዎች ውስጥ በ5 ላይ የተመሰረተ"። አንድ ዕጩ አቋም ባለን አምስት ጥያቄዎች ላይ 100% ሊያስመዘግብ ይችላል ሌሎቹ 24 ጉዳዮች ላይ ያሉ እይታዎቹ ግን ሳይታወቁ ሊቀሩ ይችላሉ።
about.limited_note: >
  ይህ ከጠንካራ አጠቃላይ ተዛማጅነት ጋር እንዳይምታታ ለመከላከል፣ ከመለሷቸው ጥያቄዎች በጣም ጥቂቶቹ ላይ ብቻ ሰነድ ያለን ዕጩዎች በተናጠል <strong>"ውስን መረጃ ይገኛል"</strong> በሚል ስር ይመደባሉ እና ምንም ይሁን መቶኛቸው ከበቂ ሰነድ ካላቸው ዕጩዎች በታች ይደረደራሉ። የዕጩን የጎደሉ አቋሞች በፍፁም አንገምትም ወይም አንሞላም — ተጨማሪ በምንጭ የተደገፈ መረጃ እስኪገኝ ድረስ በቀላሉ በትንሽ ልበ ሙሉነት ይደረደራሉ።
about.opensource_title: "ክፍት ምንጭ (Open source)"
about.opensource_pre: "ይህ ድረ-ገጽ የተለቀቀው በ"
about.opensource_license: "AGPL-3.0 ፍቃድ"
about.opensource_post: >
  ሁሉም ምንጭ ኮድ እና የዕጩዎች መረጃ ለሕዝብ ይፋ ናቸው። አስተዋጽኦዎች፣ እርማቶች እና የችግር ሪፖርቶች በደስታ ይቀበላሉ።
about.disclaimer_title: "ማስተባበያ"
about.disclaimer_pre: >
  ይህ ድረ-ገጽ ራሱን የቻለ የዜግነት ፕሮጀክት ሲሆን ከማንኛውም ዕጩ፣ ዘመቻ፣ የፖለቲካ ፓርቲ ወይም የመንግሥት ኤጀንሲ ጋር ግንኙነት የለውም። አስተያየት፣ የማሻሻያ ሐሳብ ወይም ስጋት ካለዎት፣ እባክዎ በዚህ ኢሜይል ይፃፉልኝ
about.disclaimer_post: "ወይም በGitHub ላይ ጉዳይ (issue) ይክፈቱ።"

