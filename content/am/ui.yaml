index.title: "ምርጫ ይምረጡ"
index.hero_lead: "ሰኔ 16 የሚካሄደው የዲሲ የዴሞክራቲክ ፓርቲ የመጀመሪያ ዙር ምርጫ ዲስትሪክቱን ለዓመታት ይቀርፃል። ስለ ዕጩዎቹ ለማወቅ እና ከእሴቶችዎ ጋር በተሻለ የሚስማማውን ለማግኘት ከታች አንድ ምርጫ ይምረጡ።"
