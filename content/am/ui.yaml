index.how_1: "የሚመለከትዎትን የምርጫ ውድድር ይምረጡ።"
index.how_2: "ስለሚያስቡባቸው ጉዳዮች ጥያቄዎችን ይመልሱ።"
index.how_3: "የትኞቹ ዕጩዎች ከእሴቶችዎ ጋር በይበልጥ እንደሚስማሙ ለማየት ጥያቄዎቹን (quiz) ይውሰዱ።"
index.sources_note_strong: "ሁሉም የዕጩዎች አቋሞች በቀጥታ ከምንጮቻቸው ጋር ይያያዛሉ"
index.sources_note_rest: "— የምርጫ ቅስቀሳ ገጾች፣ ይፋዊ የዲሲ መንግሥት ድረ-ገጾች እና የተረጋገጠ የዜና ዘገባ። ምንም ምንጭ የሌለው ይዘት የለም። የእያንዳንዱ ዕጩ ሙሉ አቋሞች በመገለጫ ገጹ ላይ ተዘርዝረዋል።"
