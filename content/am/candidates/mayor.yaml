- id: janeese-lewis-george
  short_bio: >
    የWard 4 የምክር ቤት አባል እና ትውልደ ዋሽንግተናዊት፣ በዲሲ ምክር ቤት ስድስት ዓመታት ያገለገለች።
    የHoward University የሕግ ምሩቅ፤ የቀድሞ የዲሲ ረዳት ጠቅላይ ዐቃቤ ሕግ።
  long_bio: |
    Janeese Lewis George (ዕድሜ 38) ከ2021 ጀምሮ Ward 4 ን በዲሲ ምክር ቤት ወክላለች።
    ትውልደ ዋሽንግተናዊት ስትሆን፣ የመጀመሪያ ዲግሪዋን (B.A.) በፖለቲካል ሳይንስ ከSt. John's
    University እና የሕግ ዶክትሬቷን (J.D.) ከHoward University አግኝታለች። ወደ ምርጫ ሥልጣን
    ከመግባቷ በፊት እንደ ጠበቃ፣ በፊላደልፊያ ረዳት የዲስትሪክት ዐቃቤ ሕግ እና የዋሽንግተን ዲሲ ረዳት
    ጠቅላይ ዐቃቤ ሕግ ሆና ሰርታለች።

    የምርጫ ቅስቀሳ መድረኮቿ የሚከተሉትን ያካትታሉ፦ ሁሉን አቀፍ ተመጣጣኝ የህፃናት እንክብካቤ
    (እያንዳንዱ ቤተሰብ ከገቢው 7% ብቻ የሚገድብ)፤ Pepco ን ተጠያቂ የሚያደርግ እና የማህበረሰብ ሶላርን
    የሚያስፋፋ 10-ነጥብ የመገልገያ ተመጣጣኝነት እቅድ፤ Dignified Homes DC (በዲሲ ባለቤትነት
    የተያዘ የተለያየ ገቢ ያላቸው የሚኖሩበት ቤት በተረጋጋ ኪራይ)፤ የኪራይ ማረጋጊያን ማዘመን፤ ለአውቶቡስ
    የተወሰኑ መንገዶች እና የተጠበቁ የብስክሌት መንገዶች፤ ደህንነቱ የተጠበቀ የመርፌ ቦታዎች፤ ለተፈናቀሉ
    የፌደራል ሠራተኞች ፈጣን ምላሽ የሚሰጥ Federal Workforce Transition Center፤ እና ማስከበርን
    ከNEAR Act የሕዝብ ጤና አካሄድ ጋር የሚያመጣጥን ሁሉን አቀፍ የህዝብ ደህንነት እቅድ። የወጣቶችን
    የሰዓት እላፊ ትቃወማለች እና ለ2024 Secure DC ጥቅል ሕግ ድምፅ ሰጥታለች። የባውዘር አስተዳደር
    የፌደራል ጣልቃ ገብነትን ለመቋቋም በቂ ስላልሰራ በከፍተኛ ሁኔታ ተችታለች። በFree DC፣ በWorking
    Families Party እና በDC DSA ተደግፋለች።
  positions:
    - question_id: youth_curfew_support
      explanation: "Lewis George የወጣቶችን የሰዓት እላፊ በይፋ ተቃውማለች።"

    - question_id: youth_curfew_programming
      quote: "ወጣቶች መገናኘትና መዝናናት የሚችሉባቸውን ደህንነታቸው የተጠበቀ የከትምህርት በኋላ እና የሌሊት የሳምንቱ መጨረሻ ቦታዎች ላይ ኢንቨስት ማድረግ።"
      explanation: "ለወጣቶች በከትምህርት ውጭ ፕሮግራም፣ በሥራዎች እና በአእምሮ ጤና አገልግሎቶች ላይ ኢንቨስት ማድረግን ትደግፋለች።"

    - question_id: crime_public_health
      quote: "የጠመንጃ ጥቃትን በሕዝብ ጤና አካሄድ መፍታት እና የጥቃት መከላከያ ፕሮግራሞችን ማጠናከር።"
      explanation: "ጥቃትን እንደ የሕዝብ ጤና ችግር መመልከትን ትደግፋለች፤ የNEAR Act አካሄድን ትደግፋለች። በኤፕሪል 30፣ 2026 Fair Elections Program የከንቲባ ክርክር ላይ እንደ Office of Neighborhood Safety and Engagement እና Cure the Streets ያሉ የጥቃት-ማቋረጥ አጋሮችን ደግፋለች፣ እና ድርጅቶች ሠራተኛ ማቆየት እና ማቀድ እንዲችሉ 'አንድ ጊዜ ቡፌ ለማዘጋጀት ብቻ' ከሚያስችል አነስተኛ የአንዴ ድጋፍ ይልቅ በበርካታ-ዓመት (የሦስት-ዓመት) ድጋፍ መደገፍ አለባቸው ስትል ተከራክራለች።"

    - question_id: crime_secure_dc
      explanation: "ለ2024 Secure DC ጥቅል ሕግ ድምፅ ሰጥታለች።"

    - question_id: crime_more_police
      explanation: "የሰው ኃይል ደረጃዎችን ለመመለስ ተጨማሪ የMPD መኮንኖችን መቅጠርን ትደግፋለች። በ2019 ስለ ኢንቨስትመንት መቀነስ (divestment) ጽፋ ነበር ነገር ግን ከዚያን ጊዜ ጀምሮ በምክር ቤት ለስድስት ዓመታት የMPD በጀቶችን ለመደገፍ ድምፅ ሰጥታለች። የ2019 መግለጫዎቿ ብዙ ጊዜ በማጥቃት ማስታወቂያዎች ላይ በእሷ ላይ ይዋላሉ።"

    - question_id: mpd_ice_cooperation
      quote: "የፖሊስ መኮንኖቻችን ከ ICE ጋር እንዲተባበሩ፣ መረጃ እንዲለዋወጡ እና ሰዎችን አሳልፈው እንዲሰጡ የሚፈቅደውን የዲሲ ፖሊስ መመሪያ መሻር።"
      explanation: "የዲሲ የመጠለያ እሴቶችን ትደግፋለች እና የMPD ከICE እና ከፌደራል ኢሚግሬሽን ማስከበር ጋር መተባበርን ትቃወማለች።"

    - question_id: housing_topa_restore
      quote: "ቤተሰቧ አሁን የሚኖሩበትን ቤት እንዲገዙ የረዳውን የዲሲ ኃይለኛ የፀረ-መፈናቀል ሕግ የሆነውን የኪራይ ቤቶች ግዢ አዋጅ (TOPA) በማጠናከር የተከራዮችን የመግዛት መብት መልሳ ታቋቁማለች።"
      explanation: "የምርጫ ቅስቀሳ መድረኳ 'የቤት ባለቤትነትን ማስፋት' በሚለው ስር የተከራዮችን የመግዛት መብት የዲሲን ኃይለኛ የፀረ-መፈናቀል ሕግ TOPA ን በማጠናከር መልሶ ለማቋቋም በግልጽ ቃል ገብታለች — TOPA ን መልሶ ማቋቋምና ማጠናከርን በቀጥታ ይደግፋል። ሰፊው የቤት መድረኳ 'የቸልተኛ ባለቤት የንግድ ሞዴልን' ማቆም እና የህብረት ሥራ ለውጦችን መደገፍን ጨምሮ በጽኑ ለተከራዮች ወገንተኛ ነው።"

    - question_id: housing_dopa
      explanation: "DOPA ን በማሻሻል ከንቲባው አንድ የተወሰነ ህንፃ ከተማዋ ራሷ ከምታለማው ይልቅ ለግንበኞች ለምን መሸጥ እንዳለበት እንዲያብራራ ለመጠየቅ ታቅዳለች፣ ይህን አሰራር ተከትሎ ዘላቂ እና ጥልቅ ተመጣጣኝ ቤት እጦት እንደሚፈጠር በመጥቀስ።"

    - question_id: environment_data_centers
      quote: "በVirginia ያሉ የAI ዳታ ሴንተሮች ወጪያችንን እያስወደዱ ናቸው እና እነሱን ለማስቆም ያሉንን መሣሪያዎች ሁሉ እየተጠቀምን አይደለም። እንደ ከንቲባ፣ Janeese ዜጎቻቸው ተመሳሳይ ህመም የሚያስከትል መዘዝ የሚገጥማቸው አስተዳዳሪዎች ጋር በቅርበት ትሰራለች።"
      explanation: "ለሚጨምሩ የመገልገያ ወጪዎች ተጠያቂ ለማድረግ ተጨማሪ ገደቦችን በመተግበር አዲስ የዳታ ሴንተር ግንባታን እንደምትገድብ ታመለክታለች።"

    - question_id: sanitation_rats
      explanation: "እንደ ምክር ቤት አባል፣ Lewis George ለአይጥ እንቅስቃሴ ክትትል በሕዝብ ተደራሽ የሆነ ዳሽቦርድ ለማቋቋም ሕግ አቅርባለች፣ የብዛት ግምቶችን እና በሕክምናዎች እና በአገልግሎት ጥያቄዎች ላይ የጂኦስፓሻል አዝማሚያዎችን ጨምሮ። እንዲሁም DPW የመኖሪያ ቆሻሻ ማጠራቀሚያዎችን ሲያነሳ አይጥ ቢያጋጥመው በDPW እና በDPH መካከል ያለውን ቅንጅት ለማሻሻል ትፈልጋለች።"

    - question_id: fiscal_progressive_taxation
      explanation: "ለረጅም ጊዜ ባዶ በሆኑ የንግድ ቦታዎች ላይ የንብረት ግብር እና ለተረጋገጡ የማህበራዊ-ጥቅም ንግዶች 15% የዋጋ ቅናሽን ጨምሮ ተራማጅ የገቢ እርምጃዎችን ታቀርባለች። መድረኳ ቤትን፣ የህፃናት እንክብካቤን እና የትምህርት ፕሮግራሞችን ከመቁረጥ ይልቅ መጠበቅን ቅድሚያ ይሰጣል፣ ምንም እንኳን ትላልቅ አዳዲስ የኮርፖሬት ግብር ጭማሪዎችን እንደ ቀዳሚ የበጀት-ክፍተት መሣሪያዋ ባታቀርብም።"

    - question_id: home_rule_dc_resist
      quote: "ዲሲን ለመከላከል ሁሉን አቀፍ የሕግ ስልት ለመፈጸም ከዲሲ ጠቅላይ ዐቃቤ ሕግ ቢሮ ጋር በእጅ ለእጅ መሥራት።"
      explanation: "የባውዘር አስተዳደር የፌደራል ጣልቃ ገብነትን ለመቋቋም በቂ ስላልሰራ በከፍተኛ ሁኔታ ተችታለች፣ እና የዲሲን የበጀት ራስ-ገዝነት ለመከላከል የሕግ መሣሪያዎችን እና የሕዝብ ተሟጋችነትን በጽኑ መጠቀምን ከአሁኑ ከንቲባ ጋር እንደ ዋነኛ ልዩነት ታቀርባለች። በኤፕሪል 30፣ 2026 Fair Elections Program የከንቲባ ክርክር ላይ ከጠቅላይ ዐቃቤ ሕግ Brian Schwalb ጋር 'ያሉንን ሕጋዊ መሣሪያዎች ሁሉ ለመመከት' ቃል ገብታለች፣ አስተዳደሩ የዲሲን የፖሊስ አዛዥ ለመቆጣጠር ሲሞክር 'ከEleanor Holmes Norton ጋር በፍርድ ቤት የነበረች ብቸኛዋ የምክር ቤት አባል' መሆኗን በመጥቀስ — 'እና ሕጋዊ መሣሪያዎቻችንን ስለተጠቀምን አሸነፍን።'"

    - question_id: federal_workers_advocate
      quote: "ለተፈናቀሉ የፌደራል ሠራተኞች እና ተቋራጮች ፈጣን ምላሽ የሚሰጥ Federal Workforce Transition Center ማቋቋም፣ ከዩኒቨርሲቲዎች ጋር በመተባበር መልሶ ለማሰልጠን እና ወደ ዲሲ የማስተማር ሥራዎች እና ሌሎች ተፈላጊ ሥራዎች ሽግግርን መደገፍን ጨምሮ።"
      explanation: "Lewis George ለተፈናቀሉ የፌደራል ሠራተኞች እና ተቋራጮች ፈጣን ምላሽ የሚሰጥ Federal Workforce Transition Center ለማቋቋም ቃል ገብታለች። እንዲሁም የባውዘር አስተዳደር የፌደራል ጣልቃ ገብነትን በበቂ ሁኔታ ስላልተቋቋመ በከፍተኛ ሁኔታ ተችታለች።"

    - question_id: harm_reduction_safe_injection
      explanation: "Lewis George ደህንነቱ የተጠበቀ የመርፌ ቦታዎችን መክፈት ትደግፋለች፣ የኦፒዮይድ ዕፅ ብዛት ሞትን ዲሲ ከሚገጥሟት 'እጅግ አጣዳፊ የሕዝብ ጤና ቀውሶች አንዱ' ብላ ጠርታዋለች። በ2023 ሁለት overdose prevention centers ለመክፈት በFY2024 በጀት 15 ሚሊዮን ዶላር ጠይቃ ነበር።"

    - question_id: childcare_universal
      quote: "እያንዳንዱ ቤተሰብ ለህፃናት እንክብካቤ እርዳታ ብቁ ይሆናል እና ቤተሰቦች ለህፃናት እንክብካቤ ከቤተሰብ ገቢያቸው ከ7% በላይ አያወጡም፣ ብዙ ቤተሰቦች ያነሰ የሚከፍሉ ሲሆን አንዳንዶቹ ምንም አይከፍሉም።"
      explanation: "የLewis George 'Childcare For All' መድረክ ሁሉን አቀፍ ተመጣጣኝ የህፃናት እንክብካቤ ይጠይቃል፦ እያንዳንዱ ቤተሰብ ለእርዳታ ብቁ ሆኖ ከቤተሰብ ገቢ 7% ላይ የተወሰነ (ከ100ሺ ዶላር በታች ለሚያገኙ ቤተሰቦች ከ600 ዶላር በወር በታች)። ባለ-ሦስት-ክፍል እቅድ፦ ድጎማን ለሁሉም ቤተሰቦች ማስፋት፣ በትምህርት ቤቶች ውስጥ በጋራ ማስቀመጥና በማይክሮ-ድጋፍ አቅርቦትን መጨመር፣ እና በPay Equity Fund በኩል ከDCPS መምህራን ጋር የሚነፃፀር ደመወዝ ዋስትና መስጠት።"

    - question_id: transit_bike_bus_lanes
      explanation: "መድረኳ በዲሲ በጣም በተጨናነቁ መንገዶች ላይ ለአውቶቡስ የተወሰኑ መንገዶችን መጨመር እና በመላ ከተማው በማህበረሰብ የተደገፉ የተጠበቁ የብስክሌት መንገዶችን መተግበር ቃል ይገባል፣ በWards 7 እና 8 ያለውን Shepherd Branch Trail እና የሰሜን-ምስራቅ-ሰሜን-ምዕራብ የተጠበቀ የብስክሌት መንገድ ጨምሮ። እንዲሁም አውቶቡሶችን ለSNAP ተቀባዮች ነፃ ለማድረግ እና ሰፊ የትራንስፖርት ክፍያ ድጋፍን ለመመርመር ቃል ይገባል።"

    - question_id: environment_renewable_energy
      explanation: "የLewis George 10-ነጥብ የመገልገያ ተመጣጣኝነት እቅድ የማህበረሰብ ሶላርን በሁሉም ባሉ የመንግሥት ህንፃዎች፣ የትምህርት ቤት ፓርኪንግ ሎቶች፣ የመጫወቻ ሜዳዎች እና ባዶ የመንግሥት መሬት ላይ በከፍተኛ ሁኔታ ማስፋትን፤ ለተከራዮች የበረንዳ ሶላር ማበረታታትን፤ በትምህርት ቤቶች እና በመንግሥት ህንፃዎች ውስጥ የኃይል ቁጠባ የአፈጻጸም ውሎችን (ESPCs) መተግበርን፤ እና Solar Shade Expansion Amendment Act ን ማስፋትን ያካትታል።"

    - question_id: education_community_schools
      quote: "የማህበረሰብ ትምህርት ቤቶች (Community Schools) ድጋፎችን ኢንቨስት ማድረግና ማስፋት እና ከቤተሰቦች ጋር ለመገናኘት ስኬታማ የቤት-ጉብኝት አገልግሎቶችን ማስፋት።"
      explanation: "መድረኳ በግልጽ 'የማህበረሰብ ትምህርት ቤቶች ድጋፎችን ኢንቨስት ማድረግና ማስፋት እና ከቤተሰቦች ጋር ለመገናኘት ስኬታማ የቤት-ጉብኝት አገልግሎቶችን ማስፋት' ይላል። የ'ሙሉ ልጁን መደገፍ' ምሰሶዋ የማህበረሰብ ትምህርት ቤቶችን ሞዴል ይመስላል፣ የተንከባካቢ መንገድ-ማሳያ ድጋፍ እና የተቀላጠፈ ፀረ-ከትምህርት መቅረት ጥረቶችን ይጨምራል።"

    - question_id: housing_social_model
      quote: "በተረጋጋ ኪራይ በዲሲ ባለቤትነት የተያዘ የተለያየ ገቢ ያላቸው የሚኖሩበት ቤት በመገንባት Dignified Homes DC ን ማስጀመር፣ የሕዝብ መኖሪያ ኢንቨስትመንቶች ከትርፍ ይልቅ ነዋሪዎችን ቅድሚያ እንዲሰጡ ማረጋገጥ።"
      explanation: "መድረኳ 'በተረጋጋ ኪራይ በዲሲ ባለቤትነት የተያዘ የተለያየ ገቢ ያላቸው የሚኖሩበት ቤት በመገንባት Dignified Homes DC ን ማስጀመር' ቃል ይገባል። ይህ የሕዝብ ባለቤትነት እና የተለያየ-ገቢ ንድፍ ያለው ግልጽ የማህበራዊ ቤት ሞዴል ነው። የሰኔ 2026 Greater Greater Washington ጽሑፏ ቁርጠኝነቱን ይደግማል፦ 'በዲስትሪክት ባለቤትነት የተያዘ የተለያየ ገቢ ያላቸው የሚኖሩበት ቤት በተረጋጋ ኪራይ የሚያስችል የማህበራዊ ቤት ፕሮግራም ማቋቋም።'"

    - question_id: housing_rent_stabilization
      explanation: "መድረኳ 'ተከራዮች ሊገመቱ የሚችሉ የቤት ወጪዎች እንዲኖራቸው እና የቤት አቅራቢዎች ግልጽ መመሪያዎች እንዲኖራቸው የኪራይ ማረጋጊያን በማዘመን ኪራይን ማረጋጋት' ይጠይቃል። አጣጣሏ ከ1975 በኋላ ወዳሉ ህንፃዎች በግልጽ ከማስፋት ይልቅ 'ማዘመን' ነው፣ ነገር ግን የኪራይ ማረጋጊያን ለተከራዮች ጥበቃ መሣሪያ አድርጋ በጽኑ ትደግፋለች።"

    - question_id: housing_production_trust_fund
      explanation: "መድረኳ 'ኢንቨስትመንቶችን ከሊለኩ ውጤቶች ጋር በማያያዝ እና ከፍተኛ ፍላጎት ያላቸውን ነዋሪዎች ቅድሚያ በመስጠት ለቤት ኢንቨስትመንቶች ተጠያቂነትን መጠየቅ' ይጠይቃል፣ እንዲሁም Dignified Homes DC ን እንደ አዲስ በሕዝብ-የተደገፈ የቤት ተነሳሽነት ማስጀመር። በሰኔ 2026 ጽሑፏ 'እንደ housing production trust fund ገንዘብ ወይም የፌደራል ገንዘብ ያሉ አስቀድሞ ባሉ የገንዘብ ዘዴዎች ላይ እተማመናለሁ' ትላለች፣ ሆኖም 'የቤት አቅርቦት ችግሮቻችን በድጎማ ብቻ ልንፈታው ከምንችለው በላይ ናቸው' በማለት ታስጠነቅቃለች — HPTF ን በከፍተኛ ሁኔታ ለማሳደግ ከመጥራት ይልቅ እንደ ነባር መሣሪያ ትደግፈዋለች (+1 እንጂ +2 አይደለም)።"

    - question_id: parks_rec_funding
      quote: "በእያንዳንዱ ወረዳ የከትምህርት በኋላ እና የበጋ ፕሮግራም ማስፋት።"
      explanation: "መድረኳ 'ወጣቶች መገናኘትና መዝናናት የሚችሉባቸውን ደህንነታቸው የተጠበቀ የከትምህርት በኋላ እና የሌሊት የሳምንቱ መጨረሻ ቦታዎች ላይ ኢንቨስት ማድረግ'፣ 'በእያንዳንዱ ወረዳ የከትምህርት በኋላ እና የበጋ ፕሮግራም ማስፋት' እና በሁሉም 8 ወረዳዎች የማህበረሰብ ማዕከላት መፍጠር ቃል ይገባል። የDPR-አይነት ፕሮግራምን መደገፍን ያመለክታል ነገር ግን DPR ን በግልጽ አይጠራም ወይም የበጀት ጭማሪ አይጠይቅም።"

    - question_id: housing_upzoning
      quote: "ጊዜ ያለፈባቸውን የዞን ገደቦች በማስወገድ በመላ ከተማው ተጨማሪ ቤት መፍቀድ፣ ይህም ተጨማሪ ቤቶች እና ተጨማሪ የቤት አይነቶች በመላው ዲሲ፣ በተለይም በትራንስፖርት ኮሪደሮች አቅራቢያ እንዲገነቡ ለማድረግ።"
      explanation: "መድረኳ 'ጊዜ ያለፈባቸውን የዞን ገደቦች በማስወገድ በመላ ከተማው ተጨማሪ ቤት መፍቀድ' እና ምርትን ለማፋጠን የተቀላጠፈ ፈቃድ አሰጣጥ ቃል ይገባል። በሰኔ 2026 Greater Greater Washington ጽሑፏ የበለጠ ሄዳ፣ 'በመላ ዲስትሪክት እስከ ስድስት ክፍሎች ያሉ ትናንሽ አፓርትመንት ቤቶችን' ሕጋዊ በማድረግ፣ የማፈግፈግ እና የጎን-ግቢ መስፈርቶችን በማቅለል፣ የፓርኪንግ መስፈርቶችን በመላ ከተማው በማቆም እና Comprehensive Plan ን በመፃፍ በዲስትሪክቱ እጅግ ሀብታም ሰፈሮች የነበረውን አግላይ የነጠላ-ቤተሰብ ዞን ለመቀልበስ — በአምስት ዓመት 72,000 ቤቶችን (የአሁኑ አስተዳደር ግብ እጥፍ) ለመገንባት ቃል ገብታለች።"

    - question_id: transit_fare_free_buses
      explanation: "ከሁሉን አቀፍ ከክፍያ-ነፃ አገልግሎት ይልቅ ያተኮረ ነፃ ትራንስፖርትን ትደግፋለች፦ 'አውቶቡሶች በSNAP የምግብ እርዳታ ፕሮግራም ለተመዘገቡ የዲሲ ነዋሪዎች ነፃ ይሆናሉ' እና ለትራንስፖርት የገንዘብ ድጋፍ ለማስፋት 'ሌሎች መንገዶችን ትመረምራለች።'"

    - question_id: transit_congestion_pricing
      explanation: "የDDOT የመጨናነቅ ዋጋ አወጣጥ ጥናት እንዲለቀቅ ገፍታለች (ሥልጣን ከያዘች በ48 ሰዓታት ውስጥ ለማድረግ ቃል በመግባት፣ ይህም ከንቲባ ባውዘር እንዲለቁት አድርጓል)። እንደ ከንቲባ 'ጥናቱን በጥንቃቄ ትገመግማለች እና አስፈላጊ ከሆነ ታዘምናለች እና ከማህበረሰብ አባላት፣ ከዲስትሪክት ባለሥልጣናት እና ከአካባቢው አስተዳደሮች ባለሥልጣናት ጋር ተግባራዊነቱን ለመመልከት ትሰራለች' — ለእሱ ክፍት ናት ግን መጀመሪያ ለጥናት እና ለማህበረሰብ ሂደት ቁርጠኛ ናት።"

    - question_id: childcare_birth_to_three
      quote: "Janeese የጨቅላ እና የታዳጊ ፕሮግራሞችን ትርፍ አቅም ባላቸው የDC Public Schools (DCPS) እና የቻርተር ትምህርት ቤት ህንፃዎች ውስጥ፣ እንዲሁም በበቂ ጥቅም ላይ ባልዋሉ በዲስትሪክት ባለቤትነት ተቋማት ውስጥ በጋራ ታስቀምጣለች።"
      explanation: "የ'Childcare For All' እቅዷ ድጎማን ለእያንዳንዱ ቤተሰብ ታሰፋለች (ከገቢ 7% የተወሰነ) እና የጨቅላ እና የታዳጊ ፕሮግራሞችን በትምህርት ቤቶች እና በዲስትሪክት ተቋማት ውስጥ በጋራ ታስቀምጣለች — የጨቅላ/ታዳጊ እንክብካቤን በጽኑ ታሰፋለች፣ ነገር ግን ከነፃ፣ ሁሉን አቀፍ የልደት-እስከ-ሦስት ዋስትና ይልቅ በገቢ ላይ በተመሰረተ የተመጣጣኝነት ጣሪያ በኩል።"

    - question_id: econ_small_business_tax_relief
      quote: "የዲሲን የትንሽ ንግድ ንብረት ግብር ቅናሽ ማስፋት።"
      explanation: "ያተኮረ የትንሽ-ንግድ እፎይታን ትደግፋለች — የዲሲን የትንሽ ንግድ ንብረት ግብር ቅናሽ ማስፋት፣ የኪራይ ዋስትናዎች፣ ለተረጋገጡ የማህበራዊ-ጥቅም ንግዶች 15% የዋጋ ቅናሽ እና 'Buy Local' ዘመቻ — እንዲሁም ለረጅም ጊዜ ባዶ በሆኑ የንግድ ቦታዎች ላይ የንብረት ግብር በማሳደግ። በኤፕሪል 30፣ 2026 Fair Elections Program የከንቲባ ክርክር ላይ ለበለጠ ቀጥተኛ የገንዘብ ድጋፍ 'አዎ' ብላ መልሳለች፣ ፈቃድ አሰጣጥን ማቅለል (ለሁለት ዓመታት የጠበቁ የWard 4 ንግዶችን በመጥቀስ)፣ የትንሽ-ንግድ እገዛን በአንድ ኤጀንሲ ስር ማጠቃለል እና ባዶ እና የተበላሹ ህንፃዎችን ለወጣት ሥራ ፈጣሪዎች፣ ለአርቲስቶች እና ለ ghost kitchens መክፈትን ጠርታለች።"

    - question_id: transit_traffic_cameras
      explanation: "በኤፕሪል 30፣ 2026 Fair Elections Program የከንቲባ ክርክር ፈጣን-ጥያቄ ዙር፣ George ተጨማሪ የትራፊክ-ማስከበሪያ ካሜራዎችን ስለማስፋት 'አይ' ብላ መልሳለች።"

    - question_id: food_access_public_grocery
      quote: "በWards 5፣ 7 እና 8 የግሮሰሪ መደብሮችን እና የችርቻሮ አገልግሎቶችን ጨምሮ የዲሲ ነዋሪዎችን ቅድሚያ የሚሰጥ ልማትን ቅድሚያ መስጠት።"
      explanation: "George የምግብ ተደራሽነትን ማዕከላዊ ጉዳይ አድርጋለች፣ ከAnacostia በስተምስራቅ በመንግሥት ባለቤትነት የተያዘ የግሮሰሪ መደብር በማቅረብ እና ግሮሰሪ መደብሮችን እና የችርቻሮ አገልግሎቶችን ወደ አገልግሎት ላልደረሳቸው Wards 5፣ 7 እና 8 የሚያመጣ የዲስትሪክት ልማትን ቅድሚያ በመስጠት። የምግብ በረሃዎችን ለማስወገድ ቀጥተኛ የከተማ ጣልቃ ገብነትን በጽኑ ትደግፋለች።"

    - question_id: environment_electricity_affordability
      quote: "Janeese ዋጋዎችን በማፅደቅ ወይም ባለማፅደቅ ሁልጊዜ የማህበረሰብ ተጽእኖን ማዕከል የሚያደርጉ Public Service Commissioners ትሾማለች። ይህ ገንዘብ ወደ ኪሳችን ይመልሳል…"
      explanation: "የGeorge 'Affordable Utilities For All' መድረክ ሂሳቦችን ለመቀነስ 10-ነጥብ እቅድ ሲሆን፣ Pepco 'ባለፉት ሦስት ዓመታት እያንዳንዳቸው ዋጋን ጨምሯል' እና Public Service Commission ነዋሪዎችን እንዳሳዘነ በመጥቀስ ይከፍታል። በዋጋ ማፅደቅ ላይ የማህበረሰብ ተጽእኖን ማዕከል የሚያደርጉ የPSC ኮሚሽነሮችን ትሾማለች፣ ነዋሪዎችን ከPepco እና ከWashington Gas ዋጋ ጭማሪ ትጠብቃለች እና ለዝቅተኛ-ገቢ ቤተሰቦች ሂሳቦችን ትቀንሳለች። በጽኑ የጠንካራ ጣልቃ ገብነትን ትደግፋለች።"

    - question_id: econ_business_activity_tax
      explanation: "George እንደ የሕግ ድርጅቶች፣ ሎቢስቶች እና አማካሪዎች ባሉ ከፍተኛ-ገቢ ባላቸው የሙያ-አገልግሎት ድርጅቶች ላይ አዲስ የንግድ-እንቅስቃሴ ግብር አቅርባለች — እንደ ሁሉን አቀፍ ተመጣጣኝ የህፃናት እንክብካቤ ያሉ አገልግሎቶችን ለመደገፍ ተራማጅ መንገድ ሆኖ፣ ይህን ከሚቃወመው McDuffie ጋር ዋነኛ ልዩነት ነው። በጽኑ ትደግፋለች።"

    - question_id: labor_worker_protections
      quote: "የሚከፈልበት የቤተሰብ ዕረፍትን አስፋፍቻለሁ ምክንያቱም አባቴ በታመመ ጊዜ እሱን ለመንከባከብ ከሥራ ዕረፍት ወስጄ ነበር እና ሁሉም ሰው ለሚወዳቸው ሰዎች ይህንን ማድረግ መቻል አለበት።"
      explanation: "እንደ ምክር ቤት አባል፣ George የሚከፈልበት የቤተሰብ ዕረፍትን አስፋፍታለች፣ ለቅድመ-ልጅነት አስተማሪዎች ደመወዝ አሳድጋለች፣ በምግብ ቤት ሠራተኞች ላይ የነበረውን አነስተኛ ክፍያ አስቀርታለች እና የሠራተኞችን ጥበቃ አጠናክራለች፣ እና በዲሲ ውሎች ላይ ጠንካራ የሠራተኛ መስፈርቶችን ለመጠየቅ እና ለ gig ሠራተኞች ጥበቃን ለማስፋት ቃል ገብታለች። የሠራተኞችን ጥበቃ ማስፋትን በጽኑ ትደግፋለች።"

    - question_id: homelessness_housing_first
      explanation: "George የተረጋጋ ቤትን የደህንነት መሠረት አድርጋ ታቀርባለች እና የሽግግር መኖሪያ ቤት ፕሮግራሞችን እና በመንግሥት ባለቤትነት የተያዘ የተለያየ ገቢ ያላቸው የሚኖሩበት 'Dignified Homes DC' ሞዴል ትደግፋለች፣ ከማስከበር ይልቅ የድጋፍ መኖሪያ ቤትን በማጉላት። Housing First-ተኮር አካሄድን ትደግፋለች።"

    - question_id: education_impact_osse
      explanation: "George ከWashington Teachers' Union ጋር በመሥራት IMPACT የመምህራን-ግምገማ ሥርዓትን በእድገት ላይ እንዲያተኩር ታድሰዋለች፣ እና ነፃ የOffice of the State Superintendent (OSSE) ጠይቃለች። የዚህን ጥያቄ ሁለቱንም ክፍሎች በጽኑ ትደግፋለች።"

- id: ernest-johnson
  short_bio: >
    የColumbia Heights ነዋሪ፤ የሪል እስቴት ደላላ፣ Notary Public እና የHarvard Government
    Analysis ማስተርስ ምሩቅ። የFriends of Frank Reeves Center መሥራች፤ ለስምንት ዓመታት
    የBack-2-School Block Party አዘጋጅ። የDC Apprenticeship Council አባል። ቀደም ያለ ጥፋተኝነት
    (conviction) አለበት።
  long_bio: |
    Ernest E. Johnson (ዕድሜ 78) የዕድሜ ልክ ዋሽንግተናዊ እና የColumbia Heights ነዋሪ ሲሆን፣
    Banneker Junior High (የዲሲ የመንግሥት ትምህርት ቤት) ተምሯል፣ ከUniversity of Maryland
    የመጀመሪያ ዲግሪ (B.S.) አግኝቷል እና በHarvard University የGovernment Analysis ማስተርስ
    አጠናቋል። ፈቃድ ያለው የሪል እስቴት ደላላ እና Notary Public ሲሆን፣ በDC Apprenticeship
    Council እና በ3rd District Advisory Council ያገለግላል።

    የለ-ትርፍ Friends of the Frank Reeves Center (501c4) መሥራች እንደመሆኑ፣ Johnson
    ለስምንት ዓመታት Back-2-School Block Party ን አዘጋጅቷል፣ ለ Raymond እና Tubman
    Elementary Schools ተማሪዎች ቦርሳዎችን፣ የትምህርት ቁሳቁሶችን እና ነፃ የፀጉር አስተካክሎ ሲሰጥ —
    እነዚህን ትምህርት ቤቶች የለ-ትርፍ ድርጅቱ በ2013 አሳድጓል። የሕዝብ መሬትን ከቅንጦት ልማት ይልቅ
    ለማህበረሰብ ጥቅም — ተመጣጣኝ ዋጋ ያለው ቤትን እና የBlack Broadway ሙዚየምን ጨምሮ — መጠቀምን
    ደግፏል፣ እና እንደ RFK Stadium ስምምነት ያሉ የሕዝብ ንብረት ስጦታዎችን ይቃወማል። በWashington
    Commanders ውስጥ 26% 'የማህበረሰብ ድርሻ' ጠይቋል። በወጣትነቱ ቀደም ያለ ጥፋተኝነት እንዳለበት በግልጽ
    ተናግሯል፣ ዕጩነቱን 'ቤዛነት እውን ነው' የሚል ማረጋገጫ አድርጎ ያቀርባል።

    መድረኩ በሦስት ምሰሶዎች ላይ ያተኩራል። በትምህርት፦ መሠረት-መጀመሪያ ሥርዓተ-ትምህርት (በ3ኛ ክፍል
    በፎኒክስ ላይ የተመሰረተ ንባብ፣ የሂሳብ ብቃት፣ ኩርሲቭ መጻፍ) በቅድመ ክፍሎች፣ ወደ ግዴታ STEM፣
    ከኢንዱስትሪ ሰርተፊኬቶች እና ከአሠሪ አጋርነት ጋር የሙያ ስልጠና መስመሮች እና የኮሌጅ ዝግጁነት
    ፕሮግራሞች የሚሸጋገር — በ2029 95% የ3ኛ-ክፍል የንባብ ብቃት እና 95% የምረቃ መጠን ግብ ይዟል። በሕዝብ
    ደህንነት፦ በእያንዳንዱ ወረዳ ማህበረሰብ-ተኮር ፖሊስ፣ የሰውነት ካሜራዎች፣ የውጥረት-ማርገብ ስልጠና፣ የጥቃት
    ማቋረጥ ፕሮግራሞች፣ የዕፅ ፍርድ ቤት ማስፋት፣ በማረሚያ ቤቶች የአእምሮ ጤና እና የሱስ ሕክምና፣ እና
    በከትምህርት በኋላ ፕሮግራሞች፣ ስፖርቶች እና አማካሪነት በኩል የወጣቶች ጣልቃ ገብነት። በገቢ ላይ፦ አረጋውያንን
    እና ወጣቶችን የሚቀጥር 'Beautify DC' የሥራ ተነሳሽነት፣ በአሁኑ ጊዜ ነፃ የሆኑ ከፍተኛ-ዋጋ ንብረቶችን
    ግብር መጣል፣ እና ወደ ዲስትሪክቱ በዋና መንገዶች የተጓዥ ቶሎች።
  positions:
    - question_id: housing_topa_restore
      explanation: "የተከራዮችን ጥበቃ ይደግፋል እና በለ-ትርፍ ሥራው በኩል ለተመጣጣኝ ዋጋ ቤት ታግሏል። የምርጫ ቅስቀሳ መድረኩ በሕዝብ መሬት ላይ ከግንበኛ ትርፍ ይልቅ የማህበረሰብ ጥቅምን ቅድሚያ ይሰጣል።"

    - question_id: crime_public_health
      quote: "ኃይል ላልተሞላበት ወንጀለኞች የዕፅ ፍርድ ቤት ማስፋት።"
      explanation: "መድረኩ በከፍተኛ-አደጋ አካባቢዎች የጥቃት ማቋረጥ ፕሮግራሞችን፣ ኃይል ላልተሞላበት ወንጀለኞች የዕፅ ፍርድ ቤት ማስፋትን፣ በማረሚያ ቤቶች የአእምሮ ጤና እና የሱስ ሕክምና አገልግሎቶችን እና በአማካሪነት እና በሥራ ስልጠና በኩል የወጣቶች ጣልቃ ገብነትን ያካትታል — ከማህበረሰብ ፖሊስ ማሻሻያዎች እና ተደጋጋሚ ወንጀለኞችን ከተጠናከረ ክስ ጎን ለጎን። በኤፕሪል 30፣ 2026 Fair Elections Program የከንቲባ ክርክር ላይ የጥቃት አቋራጮች 'ከፕሮግራሙ እንዲመረቁ' እንደሚፈልግ ተናግሯል፣ በተመላሽ ዜጎች ላይ መተማመን በስነ-ልቦና ጉዳታቸው ምክንያት የረጅም ጊዜ ሙያ አለመሆኑን አስጠንቅቆ፣ እና በDC Jail እና በወጣቶች ተቋማት ጥቃትን በተሻለ ማስተዳደርን ጠርቷል።"

    - question_id: parks_rec_funding
      quote: "በከፍተኛ-ወንጀል አካባቢዎች የከትምህርት በኋላ ፕሮግራሞች።"
      explanation: "የወጣቶች ጣልቃ ገብነት መድረኩ 'በከፍተኛ-ወንጀል አካባቢዎች የከትምህርት በኋላ ፕሮግራሞች፣ የስፖርት እና የመዝናኛ ዕድሎች፣ የግጭት መፍታት እና የመሪነት ስልጠና' ይጠይቃል — የፓርኮች እና መዝናኛ-አይነት ፕሮግራምን መደገፍን ያመለክታል፣ ምንም እንኳን DPR በግልጽ ባይጠራም።"

    - question_id: transit_congestion_pricing
      quote: "ወደ ዲስትሪክቱ በዋና የተጓዥ መንገዶች ቶሎች መትከል።"
      explanation: "የ'Growing Revenue Without Raising Taxes' እቅዱ 'ወደ ዲስትሪክቱ በዋና የተጓዥ መንገዶች ቶሎች መትከል' ያቀርባል — ከዲስትሪክት ውጭ ላሉ ተጓዦች ያተኮረ የመንገድ-ዋጋ አካሄድ፣ ከመጨናነቅ ዋጋ አወጣጥ ጋር ተመሳሳይ ቤተሰብ ውስጥ።"

    - question_id: fiscal_progressive_taxation
      quote: "በአሁኑ ጊዜ ነፃ የሆኑ ከፍተኛ-ዋጋ ንብረቶችን ግብር መጣል።"
      explanation: "የገቢ እቅዱ የከተማ አገልግሎቶችን እና የBeautify DC የሥራ ተነሳሽነቱን ለመደገፍ 'በአሁኑ ጊዜ ነፃ የሆኑ ከፍተኛ-ዋጋ ንብረቶችን ግብር መጣል' ያቀርባል — በከፍተኛ-ዋጋ ንብረት ላይ ያተኮረ የግብር መሠረት ማስፋት። ይህንን ከሰፊ የግብር ጭማሪዎች ጠንካራ ተቃውሞ ጋር ያጣምራል፦ በኤፕሪል 30፣ 2026 Fair Elections Program የከንቲባ ክርክር ላይ 'ግብር ማሳደግ አያስፈልገንም' ብሎ ደጋግሞ አጥብቆ ተናግሯል፣ የበጀት ክፍተቱ ከአዲስ ቀረጥ ይልቅ ግንበኞችን በማጣራት እና 'ብክነት፣ ማጭበርበር እና ብዝበዛ' በማስቆም መዘጋት አለበት ሲል ተከራክሯል። በከፍተኛ-ዋጋ ንብረት ግብር ላይ እንደ ቅድመ-ሁኔታ +1 ተመዝግቧል፤ ከጠቅላላ የግብር ጭማሪዎች ላይ ያለውን የክርክር አጽንዖት ልብ ይበሉ።"

    - question_id: crime_more_police
      explanation: "በኤፕሪል 30፣ 2026 Fair Elections Program የከንቲባ ክርክር ላይ Johnson 'የMPD እጥረትን መፍታት' እንደ ከንቲባ ከሚፈታቸው ከባድ የህዝብ-ደህንነት ችግሮች አንዱ አድርጎ ጠርቷል፣ የፖሊስ የሰው ኃይል መመለስን መደገፍን ያመለክታል። ከዝርዝር የቅጥር ቁርጠኝነት ይልቅ አጭር ጥቅስ፣ እና በጥቃት ማቋረጥ፣ በወጣቶች ጣልቃ ገብነት እና በግንበኛ ተጠያቂነት ላይ ባለው አጽንዖት የተመጣጠነ።"

    - question_id: mpd_ice_cooperation
      quote: "መጠለያ ከተማን (sanctuary city) አልደግፍም። በሕሊናዬ መጠለያ ከተማን መደገፉን መቀጠል አልችልም።"
      explanation: "በኤፕሪል 30፣ 2026 Fair Elections Program የከንቲባ ክርክር ላይ Johnson 'መጠለያ ከተማን አልደግፍም' ብሏል፣ ይህን እንደ የገንዘብ ብክነት በማቅረብ (ለስደተኞች የሆቴል መኖሪያ በ250 ዶላር በሌሊት ሲደግፍ፣ እንዳለው፣ ጥቁር ነዋሪዎች በተመጣጣኝ-ቤት መጠባበቂያ ዝርዝር ላይ ይሞታሉ)። ይህ የመጠለያ ፖሊሲ ተቃውሞ ከጥያቄው የ-ምንም-ትብብር አቋም ጋር ያስቀምጠዋል፣ ምንም እንኳን በበጀት/ቅድሚያ ቃላት ቢቀርጸውም እና የMPD ከICE ጋር ያለውን የአሰራር ትብብር በቀጥታ ባያነሳም — እንደ መካከለኛ፣ ጠንካራ ያልሆነ ተቃውሞ ተመዝግቧል።"

    - question_id: transit_bike_bus_lanes
      explanation: "በኤፕሪል 30፣ 2026 Fair Elections Program የከንቲባ ክርክር ፈጣን-ጥያቄ ዙር፣ Johnson ለተጨማሪ የአውቶቡስ መንገዶች፣ ለተጨማሪ የትራፊክ-ማስከበሪያ ካሜራዎች እና ለብስክሌት መንገዶች ፓርኪንግ መቀነስ ቀጥተኛ 'አይ፣ አይ እና አይ' ብሎ መልሷል — ጠንካራ፣ አጠቃላይ ተቃውሞ።"

    - question_id: transit_traffic_cameras
      explanation: "በኤፕሪል 30፣ 2026 Fair Elections Program የከንቲባ ክርክር ፈጣን-ጥያቄ ዙር፣ Johnson የትራፊክ-ማስከበሪያ ካሜራዎችን ስለማስፋት 'አይ' ብሎ መልሷል።"

    - question_id: econ_rfk_stadium
      quote: "ያንን ስምምነት እሰርዛለሁ፣ እንደገና እደራደራለሁ። የአሜሪካ ግብር ከፋዮች የቡድኑን 26% ባለቤት ይሆናሉ።"
      explanation: "በኤፕሪል 30፣ 2026 Fair Elections Program የከንቲባ ክርክር ላይ Johnson የ1.3 ቢሊዮን ዶላር RFK/Commanders ስምምነትን 'የምሰርዘው' እና ሕዝቡ 26% የባለቤትነት ድርሻ እና tag-along ስምምነት እንዲያገኝ እንደገና የምደራደርበት መጥፎ ስምምነት ብሎ ጠርቷል። በተዋቀረበት መልኩ ስምምነቱን በጽኑ ይቃወማል።"
