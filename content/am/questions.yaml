# Amharic overlay for quiz questions. Only translatable text (prompt, explanation);
# ids match content/questions.yaml. Unreviewed Amharic draft — proper nouns, program
# names, and DC agencies kept in English (often parenthetically).

- id: housing_topa_restore
  prompt: "ዲሲ TOPA ን (የተከራዮች የመግዛት ዕድል አዋጅ) መልሳ ማቋቋምና ማጠናከር አለባት፣ ይህም ተከራዮች ህንፃቸው ለውጭ ገዢ ከመሸጡ በፊት የመግዛት መብት እንዲኖራቸው ለማድረግ ነው።"
  explanation: |
    TOPA (DC Code Title 42, Chapter 34) ለዲሲ ተከራዮች ባለቤታቸው ሊሸጥ ሲፈልግ መጀመሪያ
    የመግዛት መብት ይሰጣል። የቅርብ ጊዜ ማሻሻያዎች ወሰኑን አጥብበዋል። TOPA ን ማጠናከር ቁልፍ የፀረ-
    መፈናቀል መሣሪያ ነው።

- id: housing_rent_stabilization
  prompt: "ዲሲ የኪራይ ማረጋጊያን (rent stabilization) ከ1975 በኋላ የተገነቡ ህንፃዎችን ጨምሮ ተጨማሪ ቤቶችን እንዲሸፍን ማስፋት አለባት።"
  explanation: |
    የዲሲ የኪራይ ማረጋጊያ ሕግ በአሁኑ ጊዜ ከ1978 በፊት በተገነቡ እና 5 ወይም ከዚያ በላይ ክፍሎች ባሏቸው
    ህንፃዎች ውስጥ ያሉ አብዛኞቹን ክፍሎች ይሸፍናል። ማስፋቱ በአስር ሺዎች የሚቆጠሩ ተጨማሪ ተከራዮችን
    ይጠብቃል፣ ነገር ግን ተቺዎች አዲስ ግንባታን ሊያደናቅፍ ይችላል ይላሉ።

- id: housing_dopa
  prompt: "ዲሲ የዲስትሪክት የመግዛት ዕድል አዋጅን (DOPA) ተጠቅማ የመኖሪያ ህንፃዎችን በመግዛት እንደ ተመጣጣኝ ዋጋ ያለው ቤት መጠበቅ አለባት።"
  explanation: |
    DOPA ለዲስትሪክቱ የተወሰኑ ባለ-ብዙ ቤተሰብ ህንፃዎች ለገበያ ሲቀርቡ የመግዛት መብት ይሰጣል፣ ይህም
    ከተማዋ ወደ ገበያ-ዋጋ ቤት ከመቀየር ይልቅ ተመጣጣኝ ዋጋ ያላቸውን ክፍሎች እንድትጠብቅ ያስችላታል።

- id: housing_production_trust_fund
  prompt: "ዲሲ የቤት ምርት መተማመኛ ፈንድን (Housing Production Trust Fund) በከፍተኛ ሁኔታ ማሳደግ አለባት።"
  explanation: |
    የቤት ምርት መተማመኛ ፈንድ (HPTF) ተመጣጣኝ ዋጋ ያለው ቤት ግንባታና ጥበቃን ይደግፋል። ከንቲባ
    ባውዘር በቅርቡ በቀረበው በጀታቸው ፈንዱን በ50% ለመቀነስ አቅርበዋል። ዕጩዎች ማሳደግ፣ ማስቀጠል ወይም
    መቀነስ ላይ ይለያያሉ።

- id: housing_social_model
  prompt: "ዲሲ የማህበራዊ ቤት ሞዴል — በመንግሥት ባለቤትነት የተያዘ፣ የተለያየ ገቢ ያላቸው የሚኖሩበት ቤት — መከተል አለባት።"
  explanation: |
    የማህበራዊ ቤት (በቪየና፣ በሲንጋፖር እና በMontgomery County, MD እንደተተገበረው) የሕዝብ መሬት እና
    የገንዘብ ድጋፍ ተጠቅሞ ቋሚ ተመጣጣኝ ዋጋ ያላቸውና የተለያየ ገቢ ያላቸው የሚኖሩባቸው ማህበረሰቦች
    ይገነባል። ዲሲ በአሁኑ ጊዜ በዋናነት ለግል ግንበኞች በሚሰጥ ድጎማ ላይ ትተማመናለች።

- id: transit_bike_bus_lanes
  prompt: "ዲሲ ተጨማሪ የተጠበቁ የብስክሌት መንገዶችን እና ለአውቶቡስ የተወሰኑ መንገዶችን (bus lanes) መገንባት አለባት።"
  explanation: |
    ዲሲ በቅርብ ዓመታት የተጠበቀ የብስክሌት መንገድ መረቧን አስፍታለች፣ ነገር ግን ግስጋሴው ያልተመጣጠነ ነው።
    እንደ Georgia Ave እና 14th St ባሉ ኮሪደሮች ላይ የአውቶቡስ መንገዶች ለብዙ ሺህ ተጓዦች የጉዞ
    ጊዜን በከፍተኛ ሁኔታ ሊቀንሱ ይችላሉ።

- id: mpd_ice_cooperation
  prompt: "MPD በዲሲ ውስጥ በሚካሄዱ የኢሚግሬሽን ማስከበር ሥራዎች ላይ ICE ን ወይም ሌሎች የፌደራል ኤጀንሲዎችን መርዳት የለበትም።"
  explanation: |
    ዲሲ የMPD ከፌደራል ኢሚግሬሽን ማስከበር ጋር የሚያደርገውን ትብብር የሚገድቡ የመጠለያ-እሴት (sanctuary-
    values) ፖሊሲዎች አሏት። በትራምፕ አስተዳደር ስር የአካባቢ ፖሊስ ICE ን እንዲረዳ ጫናው ጨምሯል።
    ዕጩዎች በዚህ ጉዳይ ላይ በከፍተኛ ሁኔታ ይለያያሉ።

- id: education_community_schools
  prompt: "ዲሲ ትምህርት ቤቶች ከትምህርት ባሻገር የአእምሮ ጤና፣ የቤተሰብ ድጋፍ እና ሌሎች አገልግሎቶችን የሚሰጡ የሰፈር ማዕከላት የሚሆኑበትን 'የማህበረሰብ ትምህርት ቤቶች' (community schools) ሞዴል ማስፋት አለባት።"
  explanation: |
    የማህበረሰብ ትምህርት ቤቶች ከትምህርታዊ ስልጠና በተጨማሪ የተሟሉ አገልግሎቶችን — የአእምሮ ጤና
    ባለሙያዎች፣ ማህበራዊ ሠራተኞች፣ የቤተሰብ ድጋፍ ፕሮግራሞች — ይሰጣሉ። ዲሲ በOSSE በኩል የማህበረሰብ
    ትምህርት ቤቶች ማበረታቻ ተነሳሽነት (Community Schools Incentive Initiative) አላት።

- id: education_mental_health_schools
  prompt: "እያንዳንዱ የዲሲ የመንግሥት ትምህርት ቤት የተወሰነ የባህሪ ጤና ባለሙያ (behavioral health clinician) በሠራተኝነት ሊኖረው ይገባል።"
  explanation: |
    ተሟጋቾች በእያንዳንዱ ትምህርት ቤት የአእምሮ ጤና ባለሙያዎች መኖራቸው የባህሪ ችግሮችን ሊቀንስ፣
    ተሳትፎን ሊያሻሽል እና ቀውሶች ከመፈጠራቸው በፊት ቀደም ብሎ ጣልቃ ለመግባት ሊረዳ ይችላል ይላሉ።

- id: crime_public_health
  prompt: "ዲሲ ጥቃትን እንደ የሕዝብ ጤና ችግር ልትመለከተውና በጥቃት ማቋረጥ ፕሮግራሞች እና በማህበረሰብ-ተኮር መፍትሄዎች ላይ በከፍተኛ ሁኔታ ኢንቨስት ማድረግ አለባት።"
  explanation: |
    በ2016 በዲሲ ምክር ቤት የጸደቀው የNeighborhood Engagement Achieves Results (NEAR)
    Act የጥቃት አቋራጮችን፣ በስነ-ልቦና ጉዳት ላይ የተመሰረተ እንክብካቤን እና የማህበረሰብ ጤና
    ሠራተኞችን ጨምሮ ለጥቃት ቅነሳ የሕዝብ-ጤና ማዕቀፍ አቋቁሟል።

- id: crime_secure_dc
  prompt: "የ2024 Secure DC ጥቅል ሕግ — ቅጣቶችን ያሳደገና ከፍርድ በፊት እስራትን ያስፋፋ — የዲሲን የወንጀል መጨመር ለመፍታት ትክክለኛው አካሄድ ነበር።"
  explanation: |
    የ2024 Secure DC Omnibus Amendment Act የወንጀል ቅጣቶችን አሳደገ፣ ከፍርድ በፊት ለእስራት
    የሚረዱ መሣሪያዎችን አስፋፋ እና አዳዲስ ወንጀሎችን ጨመረ። በዲሲ ምክር ቤት ካሉ የተለያዩ የፖለቲካ
    ወገኖች ድጋፍ አግኝቶ ጸደቀ፣ ነገር ግን ተቺዎች ውጤታማ አይደለም ወይም ጎጂ ነው ብለውታል።

- id: crime_more_police
  prompt: "በዲሲ ወንጀልን ለመቀነስ በከፍተኛ ሁኔታ ተጨማሪ የMPD መኮንኖችን መቅጠር ቅድሚያ የሚሰጠው ጉዳይ ነው።"
  explanation: |
    MPD በቅርብ ዓመታት የመኮንኖቹ ቁጥር ከተፈቀደለት ጥንካሬ በታች በከፍተኛ ሁኔታ ሲቀንስ ታይቷል። ሁለቱም
    ዋነኞቹ የከንቲባ ዕጩዎች ተጨማሪ መኮንኖችን መቅጠርን ይደግፋሉ፣ ነገር ግን ይህን ከሌሎች የወንጀል-ቅነሳ
    አካሄዶች አንፃር ምን ያህል ቅድሚያ መስጠት እንዳለበት ይለያያሉ።

- id: youth_curfew_support
  prompt: "ዲሲ የወጣቶችን ወንጀል ለመቀነስ መሣሪያ አድርጋ ለአካለ መጠን ላልደረሱ የሰዓት እላፊ (curfew) ማስከበር አለባት።"
  explanation: |
    ዲሲ ለዓመታት የወጣቶች የሰዓት እላፊ ሕግ አላት። ደጋፊዎች የሰዓት እላፊ የወጣቶችን ወንጀል ሊቀንስ እና
    ወጣቶችን ሊጠብቅ ይችላል ይላሉ፤ ተቃዋሚዎች ግን መደበኛ የወጣቶችን ባህሪ ወንጀል ያደርጋሉ፣ ጥቁር
    ወጣቶችን ከመጠን በላይ ይነጥላሉ እና ጠንካራ አማራጭ ፕሮግራም ከሌለ ውጤታማ አይደሉም ይላሉ።

- id: youth_curfew_programming
  prompt: "ማንኛውም የወጣቶች የሰዓት እላፊ ለወጣቶች በአማራጭ ፕሮግራም ላይ — ሥራዎች፣ የመዝናኛ ማዕከላት፣ የአእምሮ ጤና አገልግሎቶች — ከፍተኛ ኢንቨስትመንት ጋር መታጀብ አለበት።"
  explanation: |
    የሰዓት እላፊን የሚደግፉ ዕጩዎች እንኳ ብዙ ጊዜ የአጭር ጊዜ እርምጃ ብቻ ናቸው እና በተስፋፋ ከትምህርት
    ውጭ ፕሮግራም፣ በተራዘመ የመዝናኛ ማዕከል ሰዓት እና በወጣቶች የሥራ ዕድሎች መታጀብ አለባቸው ይላሉ።

- id: statehood_top_priority
  prompt: "የዲሲን ግዛትነት (statehood) ማሳካት ለዲስትሪክቱ የኮንግረስ ተወካይ ቀዳሚ ቅድሚያ ሊሆን ይገባል።"
  explanation: |
    የዲሲ ነዋሪዎች የፌደራል ግብር ይከፍላሉ እና በወታደርነት ያገለግላሉ ነገር ግን በኮንግረስ ድምፅ የመስጠት
    ውክልና የላቸውም። ግዛትነት ለዲሲ ሁለት ሴናተሮች እና ድምፅ የሚሰጥ የምክር ቤት ተወካይ ይሰጣታል።

- id: statehood_tax_exemption
  prompt: "የዲሲ ነዋሪዎች እንደ Puerto Rico ነዋሪዎች ከፌደራል የገቢ ግብር ነፃ ሊደረጉ ይገባል።"
  explanation: |
    አንድ ዕጩ (Greg Jaczko) የዲሲ ነዋሪዎች ድምፅ የመስጠት ውክልና ስለሌላቸው ለፌደራል የገቢ ግብር
    መገዛት የለባቸውም ይላል — እንደ Puerto Rico ባሉ ግዛቶች ላይ የተመሰረተ አካሄድ። ተቺዎች ይህ
    ከግዛትነት ትግሉ የሚያዘናጋ ነው ይላሉ።

- id: federal_workers_advocate
  prompt: "ዲሲ የፌደራል ሠራተኞችን ከጅምላ ስንብት ለመጠበቅ እና የፌደራል ኤጀንሲዎች ከዲስትሪክቱ እንዳይዛወሩ ለመከላከል ያሉትን ሕጋዊ መሣሪያዎች ሁሉ — ክስ መመስረትን እና የሕዝብ ተሟጋችነትን ጨምሮ — መጠቀም አለባት።"
  explanation: |
    ዋሽንግተን ዲሲ ከ160,000 በላይ የፌደራል ሠራተኞች አሏት። የትራምፕ አስተዳደር በDOGE የተመራ የሰው
    ኃይል ቅነሳ የጅምላ ስንብቶችን እና የፌደራል ኤጀንሲዎችን የማዛወር ሀሳቦችን አስከትሏል። ዲሲ ምን ያህል
    በጽኑ ምላሽ መስጠት እንዳለባት ዕጩዎች ይለያያሉ።

- id: environment_renewable_energy
  prompt: "ዲሲ ወደ 100% ታዳሽ ኃይል የምታደርገውን ሽግግር በጽኑ ማፋጠን አለባት፣ በሕዝብ ህንፃዎች ላይ ሶላር በመትከል እና በጂኦተርማል እና በሌሎች ንፁህ ምንጮች ላይ ኢንቨስት በማድረግ።"
  explanation: |
    ዲሲ በ2032 100% ታዳሽ ኤሌክትሪክን የሚያልም የታዳሽ ኃይል መለኪያ (Renewable Portfolio
    Standard) አላት። ዲስትሪክቱ ከአሁኑ መስፈርቶች ባሻገር በሶላር፣ በጂኦተርማል እና በንፁህ ኃይል
    መሠረተ ልማት ላይ ምን ያህል በቅድሚያ ኢንቨስት ማድረግ እንዳለበት ዕጩዎች ይለያያሉ።

- id: environment_data_centers
  prompt: "ዲሲ በዲስትሪክቱ ውስጥ አዳዲስ የዳታ ሴንተር ግንባታ ላይ ገደቦችን ማስቀመጥ አለባት።"
  explanation: |
    ሰሜናዊ ቨርጂኒያ በዓለም ትልቁ የዳታ ሴንተሮች ክምችት ይዟል፣ እና ዲሲ የራሷን ለማስፋት ጫና ገጥሟታል።
    ትላልቅ ዳታ ሴንተሮች ለማቀዝቀዣ ከፍተኛ መጠን ያለው ኤሌክትሪክ እና ውሃ ይጠይቃሉ፣ ይህም በመረቡ
    አስተማማኝነት እና በአካባቢ ተጽእኖ ላይ ስጋት ይፈጥራል።

- id: parks_rec_funding
  prompt: "ዲሲ ለፓርኮች እና መዝናኛ ዲፓርትመንት የሚሰጠውን የገንዘብ ድጋፍ ማሳደግ አለባት፣ የተራዘመ የመዝናኛ ማዕከል ሰዓቶችን እና የተስፋፋ የወጣቶችና የአረጋውያን ፕሮግራምን ጨምሮ።"
  explanation: |
    የዲሲ የፓርኮች እና መዝናኛ ዲፓርትመንት (DPR) ከ70 በላይ ተቋማትን ያንቀሳቅሳል እና የወጣቶች ሥራዎችን፣
    ከትምህርት በኋላ ፕሮግራሞችን፣ የአረጋውያን አገልግሎቶችን እና የማህበረሰብ ፕሮግራም ይሰጣል። የበጀት
    ጫናዎች በቅርብ ዓመታት በአንዳንድ ተቋማት ሰዓትና ሠራተኛ እንዲቀንስ አድርገዋል።

- id: sanitation_rats
  prompt: "ዲሲ የዲስትሪክቱን ሥር የሰደደ የአይጥ ወረርሽኝ ለመፍታት ሁሉን አቀፍ የመላ-ከተማ የአይጥ ቁጥጥር ፕሮግራም ተግባራዊ ማድረግ አለባት — መደበኛ የቆሻሻ መያዣዎችን አይጥ በማይገባባቸው ማጠራቀሚያዎች መተካትን ጨምሮ።"
  explanation: |
    ዲሲ በተከታታይ በአሜሪካ ውስጥ በአይጥ ከተወረሩ ከተሞች መካከል ትመደባለች። በዕጩዎች የቀረቡ መፍትሄዎች
    በሁሉም ወረዳዎች አይጥ የማይገባባቸው የብረት የቆሻሻ መያዣዎች፣ የተሻለ የDPW ቅንጅት እና ስልታዊ የማጥፋት
    ፕሮግራሞችን ያካትታሉ።

- id: harm_reduction_safe_injection
  prompt: "ዲሲ ሰዎች በህክምና ክትትል ስር አደንዛዥ ዕፅ መጠቀም የሚችሉባቸውን ደህንነቱ የተጠበቀ የመርፌ ቦታዎችን (overdose prevention centers) መክፈት አለባት።"
  explanation: |
    ደህንነቱ የተጠበቀ የመርፌ ቦታዎች (overdose prevention centers ተብለውም ይጠራሉ) ሰዎች ቀደም
    ብለው ያገኙትን ዕፅ ጣልቃ ሊገቡ በሚችሉ ሠራተኞች ክትትል ስር እንዲጠቀሙ ያስችላሉ። New York City
    በ2021 በአሜሪካ የመጀመሪያውን በሕግ የተፈቀደ ቦታ ከፍታለች። በ2023 Janeese Lewis George
    ሁለት እንዲህ ያሉ ማዕከላትን ለመክፈት በዲሲ FY2024 በጀት 15 ሚሊዮን ዶላር ጠይቃ ነበር። ዲሲ
    በአሜሪካ ግዛቶች መካከል ካሉት ከፍተኛ የዕፅ ሞት መጠን ካላቸው አንዷ ናት።

- id: childcare_universal
  prompt: "ዲሲ የተደጎመ የህፃናት እንክብካቤን ወደ ሁሉን አቀፍ ፕሮግራም ማስፋት አለባት — ለሁሉም የዲሲ ነዋሪዎች ምንም ይሁን ገቢያቸው የሚገኝ — በPre-K ማሻሻያ እና ማስፋፊያ ፕሮግራም (PKEEP) ላይ በመገንባት።"
  explanation: |
    የዲሲ Pre-K ማሻሻያ እና ማስፋፊያ ፕሮግራም (PKEEP) በአሁኑ ጊዜ ለሦስት እና ለአራት ዓመት ሕፃናት
    ነፃ፣ ጥራት ያለው pre-K ይሰጣል። በርካታ ዕጩዎች ድጎማውን ለጨቅላ እና ለታዳጊ ህፃናት እንክብካቤ
    እንዲሸፍን ማስፋትን ይደግፋሉ፣ ይህም የህፃናት እንክብካቤን ለሁሉም የዲሲ ነዋሪዎች ተመጣጣኝ ለማድረግ ነው።

- id: childcare_birth_to_three
  prompt: "ዲሲ ለዲስትሪክት ቤተሰቦች ከልደት እስከ ሦስት ዓመት ድረስ ነፃ፣ ጥራት ያለው የህፃናት እንክብካቤ — ምንም የመጠባበቂያ ዝርዝር (waitlist) ሳይኖር — ዋስትና መስጠት አለባት።"
  explanation: |
    የ2018 Birth-to-Three for All DC Act ተመጣጣኝ ዋጋ ያለው የጨቅላ እና የታዳጊ እንክብካቤ
    ግብ አስቀምጧል፣ ነገር ግን የገንዘብ ድጋፍ ወደ ኋላ ቀርቷል። አንዳንድ ዕጩዎች ከልደት ጀምሮ ነፃ
    እንክብካቤ ዋስትና ይሰጡና የህፃናት እንክብካቤ ድጎማ መጠባበቂያ ዝርዝሩን ያስወግዳሉ፤ ሌሎች ከሁሉን
    አቀፍ ነፃ ዋስትና ይልቅ በገቢ ላይ የተመሰረተ የተመጣጣኝነት ጣሪያ (ለምሳሌ ምንም ቤተሰብ ከገቢው ከ7-10%
    በላይ እንዳይከፍል) ወይም ያተኮረ እርምጃ ይመርጣሉ።

- id: transit_fare_free_buses
  prompt: "የዲሲ አውቶቡሶች ለሁሉም ተጓዦች ከክፍያ ነፃ (fare-free) መሆን አለባቸው።"
  explanation: |
    የዲሲ "Metro for D.C." ሕግ በዲስትሪክቱ ውስጥ ከክፍያ ነፃ የMetrobus አገልግሎትን ይደግፋል፣
    ምንም እንኳን WMATA ሙሉ ተግባራዊነቱን ቢቃወምም። ዕጩዎች አውቶቡሶች ለሁሉም ነፃ መሆን አለባቸው፣
    ለዝቅተኛ ገቢ ወይም በSNAP ለተመዘገቡ ብቻ ነፃ መሆን አለባቸው፣ ወይም በሌሎች የተመጣጣኝነት እርምጃዎች
    ክፍያ-ተኮር ሆነው መቆየት አለባቸው ላይ ይለያያሉ።

- id: transit_congestion_pricing
  prompt: "ዲሲ የመጨናነቅ ዋጋ አወጣጥ (congestion pricing) ተግባራዊ ማድረግ አለባት — አሽከርካሪዎች በከተማ መሃል በጣም በተጨናነቁ ክፍሎች ለመግባት ክፍያ እንዲከፍሉ ማድረግ።"
  explanation: |
    DDOT የመጨናነቅ ዋጋ አወጣጥን መጨናነቅን ለመቀነስ፣ ልቀትን ለመቀነስ እና ለትራንስፖርት ገቢ ለማግኘት
    መሣሪያ አድርጎ አጥንቷል። ተዛማጅ የመንገድ-ዋጋ ሀሳቦች የተጓዥ ቶሎችን እና ከፍ ያለ የመኖሪያ ፓርኪንግ
    ፈቃድ ክፍያዎችን ያካትታሉ። ዕጩዎች ከንቁ ደጋፊዎች እስከ በጥንቃቄ ብቻ ለማጥናት እስከሚፈልጉ ይደርሳሉ።

- id: housing_upzoning
  prompt: "ዲሲ ነጠላ-ቤተሰብ-ብቻ የዞን ገደቦችን በማስወገድ አፓርትመንቶችን እና 'የጎደለ-መሃል' ቤትን (ድብል፣ ትሪፕል እና ትናንሽ ባለ-ብዙ ቤተሰብ ህንፃዎች) በመላ ከተማው ሕጋዊ ማድረግ አለባት።"
  explanation: |
    የዲሲ ቀጣይ Comprehensive Plan እና Future Land Use Map (የdc2050 ሂደት) የተለያዩ ሰፈሮች
    ምን ያህል አዲስ ቤት ማስተናገድ እንዳለባቸው ይወስናል። አንዳንድ ዕጩዎች አግላይ የነጠላ-ቤተሰብ ዞንን ማቆም
    እና በትራንስፖርት ኮሪደሮች አቅራቢያ ጥግግትን መፍቀድ ይፈልጋሉ፤ ሌሎች ከupzoning ይልቅ የተከራዮችን
    ጥበቃ ወይም የሰፈር ባህሪን ያጎላሉ።

- id: crime_police_in_schools
  prompt: "ዲሲ የፖሊስ መኮንኖችን ከመንግሥት ትምህርት ቤቶች ውጭ ማድረግ እና በምትኩ በአማካሪዎች፣ በማህበራዊ ሠራተኞች እና በአእምሮ-ጤና ሠራተኞች ላይ ኢንቨስት ማድረግ አለባት።"
  explanation: |
    የዲሲ 2020 የፖሊስ ማሻሻያ ሕግ School Resource Officers ን ከDCPS ቀስ በቀስ ለማስወጣት
    ተንቀሳቅሷል፣ ይህ ለውጥ በወንጀል ስጋቶች ምክንያት ሲከራከርበት እና በከፊል ሲቀለበስ ቆይቷል። ዕጩዎች
    ፖሊስ-ባልሆኑ ድጋፎች — አማካሪዎች እና የባህሪ-ጤና ሠራተኞች — ላይ ኢንቨስት ማድረግ ወይም በትምህርት
    ቤቶች ውስጥና አካባቢ የፖሊስ ኃይል ማስቀጠል ላይ ይለያያሉ።

- id: fiscal_progressive_taxation
  prompt: "ዲሲ የዲስትሪክቱን የበጀት ክፍተት ለመዝጋት በትላልቅ ኮርፖሬሽኖች እና በሀብታም ነዋሪዎች ላይ ግብር ማሳደግ አለባት።"
  explanation: |
    የዲሲ FY2026 በጀት በከባድ የበጀት እጥረት ምክንያት ለቤት ምርት መተማመኛ ፈንድ፣ ለፓርኮች እና ለህፃናት
    እንክብካቤ ፕሮግራሞች ጥልቅ ቅነሳዎችን አቅርቧል። ዕጩዎች እነዚያን ፕሮግራሞች ከትላልቅ ኮርፖሬሽኖች እና
    ከፍተኛ-ገቢ ካላቸው ነዋሪዎች ገቢ በማግኘት ለመጠበቅ ወይም ግብርን በመግታት እና በወጪ ቁጥጥር እና
    በኢኮኖሚ እድገት በጀቱን ለማመጣጠን ላይ ይለያያሉ።

- id: econ_small_business_tax_relief
  prompt: "ዲሲ በትናንሽ እና በአካባቢ ንግዶች ላይ ግብርና ክፍያዎችን መቀነስ አለባት — እንደ የትንሽ ችርቻሮ ንብረት ግብር ቅናሽ ያለ እፎይታ መስጠትን ጨምሮ — እንዲከፈቱ፣ እንዲቀጥሉ እና እንዲያድጉ ለመርዳት።"
  explanation: |
    ትናንሽ ንግዶች ከፍተኛ የንግድ ኪራይ፣ ክፍያዎች እና በሀገሪቱ ካሉ ከፍተኛ የመጀመሪያ-ዓመት የውድቀት
    መጠኖች አንዱ ይጋፈጣሉ። አንዳንድ ዕጩዎች የንግድ ግብርና ክፍያዎችን መቀነስ እና እንደ Small Retailer
    Property Tax Credit ያሉ ቅናሾችን ማስፋት ያቀርባሉ፤ ሌሎች ከግብር ቅነሳ ይልቅ ከትላልቅ
    ኮርፖሬሽኖች ገቢ ማግኘት ወይም ቢሮክራሲን መቀነስ ያጎላሉ።

- id: education_mayoral_control
  prompt: "ዲሲ የDC የመንግሥት ትምህርት ቤቶች ላይ ያለውን የከንቲባ ቁጥጥር ማቆም እና ሥልጣኑን ለተመረጠ የስቴት የትምህርት ቦርድ (State Board of Education) መመለስ አለባት።"
  explanation: |
    የ2007 Public Education Reform Amendment Act DCPS ን በቀጥታ በከንቲባ ቁጥጥር ስር
    አስቀመጠ፣ የተመረጠውን የስቴት የትምህርት ቦርድ በአብዛኛው ወደ አማካሪ ሚና ቀንሷል። አንዳንድ ዕጩዎች
    የአስተዳደር ሥልጣኑን ለተመረጠው ቦርድ ይመልሳሉ፤ ሌሎች ተጠያቂነቱ በከንቲባው እጅ እንዲቆይ ይደግፋሉ።

- id: environment_public_power
  prompt: "ዲሲ Pepco ን ለመተካት በመንግሥት ባለቤትነት የተያዘ የኤሌክትሪክ አገልግሎት መፍጠር አለባት።"
  explanation: |
    Pepco፣ በባለሀብት ባለቤትነት የተያዘ ሞኖፖሊ፣ ቋሚ የትርፍ መጠን ዋስትና ተሰጥቶታል እና ዋጋን ደጋግሞ
    አሳድጓል። አንዳንድ ዕጩዎች ዲሲ ወደ ሕዝባዊ ኃይል (public power) — እንደ Nebraska ወይም እንደ
    ብዙ የአሜሪካ ከተሞች ያለ ማዘጋጃ ቤታዊ አገልግሎት፣ ዝቅተኛ ዋጋ የመጠየቅ አዝማሚያ ያላቸው — መሄድ
    አለባት ይላሉ፣ ሌሎች ደግሞ ከሕዝብ ባለቤትነት ይልቅ Pepco ን በሕዝብ አገልግሎት ኮሚሽን (Public
    Service Commission) በኩል ጠንካራ ቁጥጥር ማድረግ ይመርጣሉ።

- id: statehood_strategy_bipartisan
  prompt: "የዲሲ ተወካይ ግዛትነትን በዋናነት በግጭትና በተቃውሞ ሳይሆን በኮንግረስ ውስጥ የሁለቱም ፓርቲ ጥምረት እና የሕግ ስምምነቶችን በመገንባት መከታተል አለበት።"
  explanation: |
    ዕጩዎች ግዛትነትን ለማራመድ በሚረዱ ስልቶች ላይ ይለያያሉ። አንዳንዶች ታጋሽ ጥምረት-መገንባትን እና
    በሁለቱ ወገኖች መካከል "ታላቅ ድርድር" (grand bargain) አካሄድን ይመርጣሉ፤ ሌሎች ለአስርት
    ዓመታት የቆየው ይህ ስልት ከሽፏል እና ጉዳዩን ለማስገደድ የበለጠ ግጭታዊ ስልቶችን — የግብር ተቃውሞን
    እስከ ማካተት ድረስ — ይጠይቃሉ ይላሉ።

- id: delegate_budget_autonomy
  prompt: "የዲሲን የበጀት እና የሕግ አወጣጥ ራስ-ገዝነት ከኮንግረስ ጣልቃ ገብነት መከላከል ለዲስትሪክቱ ተወካይ ቀዳሚ ቅድሚያ ሊሆን ይገባል።"
  explanation: |
    በHome Rule Act ስር፣ ኮንግረስ የዲሲ ሕጎችን ሊገመግምና ሊሽር እና በዲስትሪክቱ በአካባቢ በተሰበሰበ
    በጀት ላይ ጣልቃ ሊገባ ይችላል — በ2025 ከዲሲ በጀት ወደ 1 ቢሊዮን ዶላር እንደቆረጠው። ተወካዩ
    የዲሲን ራስ-ገዝነት እና በጀት ከፌደራል ጣልቃ ገብነት መጠበቅን ምን ያህል በጽኑ ቅድሚያ መስጠት
    እንዳለበት ዕጩዎች ይለያያሉ።

- id: home_rule_dc_resist
  prompt: "ዲሲ በከተማ አስተዳደር ላይ ለሚደረግ የትራምፕ አስተዳደር ጣልቃ ገብነት ጸጥ ካለ ዲፕሎማሲ ወይም ተግባራዊ ድርድር ይልቅ በቆራጥ፣ ይፋዊ አቋም — ክስ በመመስረት፣ የጥበቃ ሕጎችን በማጽደቅ እና ሕገ-ወጥ የፌደራል ትዕዛዞችን ለመፈጸም በመቃወም — ምላሽ መስጠት አለባት።"
  explanation: |
    ከMPD እና ከኢሚግሬሽን ማስከበር ባሻገር፣ የትራምፕ አስተዳደር በዲሲ በአካባቢ የተሰበሰበ በጀት ቆርጧል፣
    የከተማ ኤጀንሲዎችን ለመቆጣጠር አቅርቧል እና በከተማ ሕጎች ላይ ጣልቃ ገብቷል። ዕጩዎች በክስ፣ በሕግ እና
    በሕዝብ ተሟጋችነት በኩል ጠንካራ፣ ግጭታዊ አቋም ከሚፈልጉ እስከ የዲሲን ጥቅም ለመጠበቅ ከኮንግረስ እና
    ከዋይት ሃውስ ጋር ተግባራዊ ግንኙነትን ከሚመርጡ ይደርሳሉ።

- id: delegate_oppose_federal_mpd
  prompt: "ተወካዩ የዲሲን ፖሊስ ዲፓርትመንት ለመቆጣጠር ወይም ብሔራዊ ዘብ (National Guard) እና የፌደራል ወኪሎችን በከተማው ለማሰማራት የሚደረጉ የፌደራል ሙከራዎችን መታገል አለበት።"
  explanation: |
    በ2025 የፌደራል መንግሥት የHome Rule Act Section 740 ን ጠቅሶ በሜትሮፖሊታን ፖሊስ
    ዲፓርትመንት ላይ ቁጥጥር አወጀ እና ብሔራዊ ዘብ እና የፌደራል ወኪሎችን በዲሲ አሰማራ። የአካባቢ የህዝብ-
    ደህንነት ተቋማት የፌደራል ቁጥጥርን ምን ያህል በኃይል መቋቋም እንዳለበት ዕጩዎች ይለያያሉ።

- id: transit_metro_funding
  prompt: "ዲሲ ለMetro (WMATA) የሚሰጠውን የገንዘብ ድጋፍ ማሳደግ አለባት፣ ሌሎች የከተማ አገልግሎቶችን መቀነስ ቢያስከትልም እንኳ።"
  explanation: |
    WMATA መዋቅራዊ የአሰራር ጉድለቶች ይጋፈጣል፣ እና ዲሲ፣ Maryland እና Virginia የየራሳቸውን
    መዋጮ ይደራደራሉ። ተደጋጋሚ ክርክር ዲሲ የበለጠ ማስገባት አለባት — ሌሎች አገልግሎቶችን በመጉዳት ዋጋ
    እንኳ — ወይም ብዙ ተጓዦች ከከተማ ዳርቻ ስለሚመጡ Maryland እና Virginia ድርሻቸውን እስኪያሳድጉ
    ድረስ መታገስ አለባት የሚል ነው።

- id: econ_commuter_tax
  prompt: "ዲሲ በዲስትሪክቱ ውስጥ የሚሰሩ ግን በMaryland ወይም Virginia የሚኖሩ ሰዎች ላይ የተጓዥ ግብር (commuter tax) መጣል አለባት (የፌደራል ሕግ ቢፈቅድ)።"
  explanation: |
    የፌደራል ሕግ (Home Rule Act) በአሁኑ ጊዜ ዲሲ በከተማው የሚሰሩ ነዋሪ-ያልሆኑ ሰዎችን ገቢ ግብር
    እንዳትጥል ይከለክላል። ደጋፊዎች ተጓዦች ለግብር መሠረቱ ሳያበረክቱ የከተማ አገልግሎቶችን ይጠቀማሉ ይላሉ፤
    ተቃዋሚዎች ንግዶችን እና ገዢዎችን ሊያደናቅፍ ይችላል እና ለማውጣት የኮንግረስ ሕግ ይጠይቃል ብለው
    ያስጠነቅቃሉ።

- id: transit_traffic_cameras
  prompt: "ዲሲ ራስ-ሰር የትራፊክ-ማስከበሪያ ካሜራ ፕሮግራሙን (የፍጥነት እና የቀይ-መብራት ካሜራዎች) ማስፋት አለባት።"
  explanation: |
    ዲሲ በሀገሪቱ ካሉት ትላልቅ ራስ-ሰር የትራፊክ-ማስከበሪያ ካሜራ ፕሮግራሞች አንዱን ታንቀሳቅሳለች።
    ደጋፊዎች ካሜራዎችን እንደ Vision Zero የመንገድ-ደህንነት መሣሪያ ይመለከታሉ፤ ተቺዎች ግን ዝቅተኛ-
    ገቢ ባላቸው አሽከርካሪዎች ላይ በይበልጥ የሚወድቅ ኋላ-ቀር፣ ገቢ-ተኮር ሸክም ይሏቸዋል እና ቦታ
    አቀማመጣቸውን ይጠይቃሉ።

- id: housing_production_vs_affordability
  prompt: "ሁለቱ ሲጋጩ፣ ዲሲ በእያንዳንዱ ፕሮጀክት ላይ የጥልቅ-ተመጣጣኝነት መስፈርቶችን ከማብዛት ይልቅ ተጨማሪ ቤት በፍጥነት መገንባትን — ገበያ-ዋጋን ጨምሮ — ቅድሚያ መስጠት አለባት።"
  explanation: |
    ማዕከላዊ የቤት ውጥረት፦ ምርት-መጀመሪያ ተሟጋቾች የቁጥጥር መሰናክሎችን መቀነስ እና ከሁሉም ዓይነት
    (ገበያ-ዋጋን ጨምሮ) ብዙ መገንባት ዋጋን ለመቀነስ ፈጣኑ መንገድ ነው ይላሉ፣ ተመጣጣኝነት-መጀመሪያ
    ተሟጋቾች ግን የጥልቅ-ተመጣጣኝነት መስፈርቶች ከሌሉ አዲሱ አቅርቦት የቆዩ ነዋሪዎችን ያፈናቅላል ይላሉ።
    ብዙ ዕጩዎች ይህን አጣጣል እንደ ሐሰተኛ ምርጫ አድርገው ይቃወማሉ፤ ገለልተኛ ወይም ድብልቅ መልስ ያንን
    እይታ ያንፀባርቃል።

- id: housing_office_conversion
  prompt: "ዲሲ ባዶ የከተማ መሃል የቢሮ ህንፃዎችን ወደ ቤት ለመቀየር ማበረታቻዎችን መስጠት አለባት፣ ለእነዚያ ለውጦች የተመጣጣኝ-ቤት መስፈርቶችን መተውን ቢያስከትል እንኳ።"
  explanation: |
    የከተማ መሃል የቢሮ ክፍት ቦታ ወደ 20% ስለሆነ፣ ዲሲ ከቢሮ-ወደ-መኖሪያ ለውጦችን ለማነሳሳት የግብር
    ማበረታቻዎችን ተጠቅማለች። ክርክሩ (ውድ የሆኑትን) ለውጦች በፋይናንስ ተግባራዊ ለማድረግ የማካተት/
    የተመጣጣኝ-ቤት መስፈርቶችን መተው፣ ወይም ጥቂት ፕሮጀክቶች ብቻ ቢሳኩም እንኳ በተመጣጣኝነት ላይ
    መጽናት ላይ ነው።

- id: econ_rfk_stadium
  prompt: "የዲስትሪክቱ የRFK ስታዲየም / Washington Commanders መልሶ ማልማት ስምምነት፣ በተዋቀረበት መልኩ፣ ለዲሲ ነዋሪዎች ጥሩ ኢንቨስትመንት ነው።"
  explanation: |
    ዲሲ የRFK ስታዲየም ቦታን መልሶ ለማልማት እና Washington Commanders ን ለመመለስ ያደረገችው
    ስምምነት ከማህበረሰብ-ጥቅም፣ ከአካባቢ-ቅጥር እና ከእኩልነት ቁርጠኝነቶች ጎን ለጎን ከፍተኛ የሕዝብ ሀብት
    ይመድባል። ዕጩዎች ስምምነቱን (እና ቁጥጥሩን) ከሚከላከሉ፣ ለትልቅ የሕዝብ ድርሻ እንደገና መደራደር
    ከሚፈልጉ፣ እና ደካማ የእኩልነት ወይም የአካባቢ-ቅጥር ዋስትናዎች ስላሉት ከሚነቅፉ መካከል ይከፋፈላሉ።

- id: food_access_public_grocery
  prompt: "ዲሲ የምግብ በረሃዎችን ለማስወገድ በቀጥታ ጣልቃ መግባት አለባት — ከAnacostia በስተምስራቅ ባሉ አገልግሎት ባልደረሳቸው አካባቢዎች በመንግሥት ባለቤትነት የተያዘ የግሮሰሪ መደብር መክፈትን ጨምሮ።"
  explanation: |
    ብዙ ሰፈሮች፣ በተለይም ከAnacostia ወንዝ በስተምስራቅ፣ ጥቂት ሙሉ-አገልግሎት ግሮሰሮች አሏቸው።
    ዕጩዎች በመፍትሄው ላይ ይለያያሉ፦ አንዳንዶች (ለምሳሌ Janeese Lewis George) በመንግሥት
    ባለቤትነት የተያዘ ማዘጋጃ ቤታዊ የግሮሰሪ መደብር ያቀርባሉ፣ ሌሎች የግል ግሮሰሮችን ለመሳብ ማበረታቻዎችን
    ይመርጣሉ (ዲሲ በWard 8 በSkyland ከLidl ጋር እንዳደረገችው)። የከንቲባ ባውዘር በጀትም ተማሪዎች
    የበጋ ምግቦችን እንዲያገኙ የሚረዳ ቢሮ ለመቁረጥ አቅርቧል።

- id: environment_electricity_affordability
  prompt: "ዲሲ የነዋሪዎችን የኤሌክትሪክ ሂሳብ ለመቀነስ በጽኑ መንቀሳቀስ አለባት — ለምሳሌ የPepco ዋጋ ጭማሪዎችን በሕዝብ አገልግሎት ኮሚሽን (Public Service Commission) በኩል በመቃወም ወይም መልሶ በመቀልበስ።"
  explanation: |
    Pepco፣ በባለሀብት ባለቤትነት የተያዘ ሞኖፖሊ፣ በዲሲ ሕዝብ አገልግሎት ኮሚሽን የሚፀድቅ የዋጋ ጭማሪ
    ደጋግሞ ይጠይቃል፣ እና እየጨመረ የመጣው የኤሌክትሪክ ሂሳብ በ2026 ውድድር ቀዳሚ የተመጣጣኝነት ስጋት
    ሆኖ ብቅ ብሏል። ዲስትሪክቱ ምን ያህል በጽኑ ጣልቃ መግባት እንዳለበት ዕጩዎች ይለያያሉ — የዋጋ
    ጭማሪዎችን ከመቃወም እና ቁጥጥርን ከማጠናከር እስከ ሕዝባዊ ኃይል መከታተል — ከመገልገያ ሂሳቦችን
    እንደ ገበያ ጉዳይ ከመመልከት አንፃር። ይህ ዲሲ አገልግሎቱን ሙሉ በሙሉ ማዘጋጃ ቤታዊ ማድረግ አለባት ወይ
    ከሚለው የተለየ ነው።

- id: econ_business_activity_tax
  prompt: "ዲሲ ለከተማ ፕሮግራሞች ገቢ ለማግኘት ከፍተኛ-ገቢ ባላቸው የሙያ-አገልግሎት ድርጅቶች — እንደ የሕግ ድርጅቶች፣ ሎቢስቶች እና አማካሪዎች ባሉ — ላይ አዲስ ግብር መፍጠር አለባት።"
