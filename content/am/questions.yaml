    የበጀት እጥረት ሲገጥማቸው፣ አንዳንድ ዕጩዎች (በተለይ Janeese Lewis George) እንደ የሕግ
    ድርጅቶች፣ ሎቢስቶች እና አማካሪዎች ባሉ ከፍተኛ-ገቢ ባላቸው የሙያ-አገልግሎት ድርጅቶች ላይ ያተኮረ
    አዲስ የንግድ-እንቅስቃሴ ግብር አቅርበዋል። ደጋፊዎች አገልግሎቶችን ለመደገፍ ተራማጅ መንገድ አድርገው
    ይመለከቱታል፤ ተቃዋሚዎች (እንደ Kenyan McDuffie ያሉ) በፌደራል የሥራ ኪሳራ መካከል አሠሪዎችን
    ያባርራል ብለው ያስጠነቅቃሉ።

- id: labor_worker_protections
  prompt: "ዲሲ የሠራተኞችን ጥበቃ ማጠናከር አለባት — የሚከፈልበት የቤተሰብ እና የህክምና ዕረፍትን በማስፋት እና ዝቅተኛ ደመወዝን በማሳደግ — ለአሠሪዎች ወጪ ቢያስከትል እንኳ።"
  explanation: |
    የዲሲ Universal Paid Leave ፕሮግራም በአሁኑ ጊዜ እስከ 12 ሳምንታት የሚከፈልበት የቤተሰብ እና
    የህክምና ዕረፍት ይሰጣል፣ እና ዲስትሪክቱ ከሀገሪቱ ከፍተኛ ዝቅተኛ ደመወዞች አንዱ አለው። አንዳንድ ዕጩዎች
    (እንደ የሚከፈልበት-ዕረፍት ሕግ ደራሲ Elissa Silverman ያሉ) እነዚህን የሠራተኛ ጥበቃዎች የበለጠ
    ያስፋፋሉ፣ ደመወዝ ተመጣጣኝነትን ይነዳል ሲሉ ይከራከራሉ፤ ሌሎች በጠባብ በጀት እና በፌደራል የሥራ
    ኪሳራ መካከል ለትናንሽ አሠሪዎች ስለሚጨመር ወጪ ይጨነቃሉ።

- id: homelessness_housing_first
  prompt: "ዲሲ ካምፖችን በማፍረስ ላይ ከመተማመን ይልቅ ቤት አልባነትን ለመፍታት ቋሚ የድጋፍ መኖሪያ ቤትን እና 'Housing First' አገልግሎቶችን ማስፋት አለባት።"
  explanation: |
    የዲሲ የቤት-አልባ-አገልግሎት ስልት "Housing First" ን — ሰዎችን ከተሟሉ አገልግሎቶች ጋር ወደ ቋሚ
    የድጋፍ መኖሪያ ቤት ማስገባትን — አጉልቷል፣ ምንም እንኳን ከተማዋ እና የፌደራል መንግሥት የካምፕ
    ማፍረስ ቢያጠናክሩም። ዕጩዎች የድጋፍ-መኖሪያ ኢንቨስትመንትን ማስፋት ወይም ካምፖችን ማፍረስ እና
    መጠለያ ቅድሚያ መስጠት ላይ ይለያያሉ።

- id: education_impact_osse
  prompt: "ዲሲ የIMPACT የመምህራን-ግምገማ ሥርዓትን ማደስ እና የስቴት የትምህርት ሱፐርኢንተንደንት ቢሮን (OSSE) ከከንቲባው ነፃ ማድረግ አለባት።"
  explanation: |
    IMPACT የDCPS በፈተና እና በምልከታ ላይ የተመሰረተ የመምህራን-ግምገማ ሥርዓት ሲሆን፣ በWashington
    Teachers' Union ለረጅም ጊዜ ሲተች ቆይቷል፤ OSSE፣ የስቴት የትምህርት ኤጀንሲ፣ በአሁኑ ጊዜ
    ለከንቲባው ተጠሪ ነው። አንዳንድ ዕጩዎች (እንደ Janeese Lewis George ያሉ) IMPACT ን ያድሳሉ
    እና OSSE ን ነፃ ያደርጋሉ፤ ሌሎች (እንደ Kenyan McDuffie ያሉ) ቀደም ያሉ የነፃነት ሕጎችን
    ተቃውመዋል እና አሁን ያለውን የግምገማ ሥርዓት ይከላከላሉ።

- id: housing_height_act_repeal
  prompt: "ዲሲ የፌደራል Height Act ን እንዲሽር ወይም እንዲያላላ ኮንግረስን መግፋት አለባት፣ ይህም ዲስትሪክቱ ረዣዥም ህንፃዎችን እንዲገነባ ለማድረግ ነው።"
  explanation: |
    የ1910 Height of Buildings Act በዲሲ የህንፃ ቁመቶችን ይገድባል እና በኮንግረስ ብቻ ሊለወጥ
    ይችላል። አንዳንድ ዕጩዎች (በተለይ የተወካይ ዕጩ Brooke Pinto) መሻር ወይም ማላላት ዲሲ ቤት እና
    ጥግግት እንድትጨምር ይፈቅዳል ይላሉ፤ ሌሎች እንደ ዝቅተኛ ቅድሚያ ይመለከቱታል ወይም የከተማዋን ዝቅተኛ
    አድማስ መጠበቅ ያደንቃሉ።

- id: delegate_federal_land_transfer
  prompt: "ተወካዩ በዲሲ ያለ የፌደራል መሬትን — እንደ National Park Service ቦታዎች እና ባዶ ወይም ትርፍ የፌደራል ህንፃዎች — ወደ አካባቢ የዲስትሪክት ቁጥጥር ለማስተላለፍ መሥራት አለበት።"
  explanation: |
    የፌደራል መንግሥት በዲሲ ውስጥ ብዙ መሬት ይዟል፣ ከ300 በላይ የNational Park Service
    "ሪዘርቬሽኖችን" እና በኤጀንሲ ዝውውሮች የተተዉ ባዶ የGSA ህንፃዎችን ጨምሮ። እነዚህን ቦታዎች ወደ
    ዲስትሪክቱ ማስተላለፍ ተወካይ የዲሲን የግብር መሠረት ለማስፋት እና ቤት ለመገንባት ካሉት ጥቂት ተጨባጭ
    መሣሪያዎች አንዱ ነው። የ2026 ውድድር ዕጩዎች ዝውውሮችን በሰፊው ይደግፋሉ ነገር ግን ኮንግረስ መሬቱ
    እንዴት ጥቅም ላይ እንደሚውል ቅድመ ሁኔታዎችን ማያያዝ አለበት ወይስ በቀላሉ አስረክቦ ዲሲ በአካባቢ
    እንድትወስን መተው አለበት ላይ ይለያያሉ።

- id: delegate_impeach_trump
  prompt: "ተወካዩ የፕሬዝዳንት ትራምፕን ኢምፒችመንት (impeachment) በንቃት መግፋት አለበት።"
  explanation: |
    በዲሲ ላይ ሕገ-ወጥ የፌደራል ጣልቃ ገብነት ብለው በሚገልጹት — ከበጀት እገዳ እና ከብሔራዊ ዘብ
    ማሰማራት እስከ የWhite House East Wing ማፍረስ — ሲጋፈጡ፣ ዕጩዎች ተገቢው ምላሽ ላይ
    ይለያያሉ። አንድ ዕጩ (Greg Jaczko) ኢምፒችመንት ለ"አምባገነንነት" ሕገ-መንግሥታዊ መድሃኒት ነው
    ይላል እና የዴሞክራቲክ አመራር ስለሚያስወግደው ይነቅፋል፤ ሌሎች ጥምረት-መገንባትን፣ የቁጥጥር
    ችሎቶችን፣ ኮንግረስን መልሶ ማሸነፍን ወይም ከኢምፒችመንት ይልቅ ለዲሲ ሀብቶችን በተግባራዊ መልኩ
    ማረጋገጥን ያጎላሉ።

- id: delegate_metro_federal_funding
  prompt: "የፌደራል መንግሥት ለMetro (WMATA) ቋሚ የገንዘብ ድጋፍ ቁርጠኝነት ማድረግ አለበት፣ እና ተወካዩ ይህን ለማረጋገጥ መታገል አለበት።"
  explanation: |
    Metro በፌደራል መንግሥት የተገነባ እና የፌደራል መንግሥትንና የሰው ኃይሉን የሚያገለግል ነው፣ ነገር ግን
    አሁን ያለው የፌደራል መዋጮ (በPRIIA ሕግ በኩል) ጊዜ ያለፈበት እና በቂ ያልሆነ ተደርጎ በሰፊው
    ይታያል፣ ይህም ዲሲ፣ Maryland እና Virginia ቀሪውን እንዲደራደሩ ይተዋል። ዕጩዎች ተወካዩ ለቋሚ
    የፌደራል ድጋፍ መታገል አለበት በሚለው በሰፊው ይስማማሉ፣ ምንም እንኳን አንዳንዶች ከግዛትነት እና
    ከ"እኩል መሠረት" ጋር ቢያያይዙትም ሌሎች Maryland እና Virginia ፍትሃዊ የክልል ድርሻ መክፈል
