- slug: ward5
  title: "Ward 5 Councilmember"
  short_description: "Incumbent Zachary Parker faces two challengers in the June 16 Democratic primary."
  whats_at_stake: |
    Ward 5 covers a wide swath of Northeast DC including Trinidad, Brentwood,
    Langdon, Edgewood, Michigan Park, Brookland, Lamond-Riggs, Fort Lincoln,
    and the Ivy City corridor. Incumbent Councilmember Zachary Parker, the first
    Black openly gay Council member in DC history, is seeking re-election. The ward
    has seen significant development pressure along the NoMa, Ivy City, and Rhode
    Island Avenue corridors and a sharp decline in violent crime under Parker's tenure.
    Three Democrats are on the primary ballot, and ranked choice voting applies
    for the first time in June 2026.
  election_date: 2026-06-16
  sources:
