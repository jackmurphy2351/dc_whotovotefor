- slug: at_large_bonds
  title: "At-Large Council — Regular Election"
  short_description: "At-Large seat open due to Anita Bonds' retirement. Nine Democrats are on the June 16 primary ballot."
  whats_at_stake: |
    This regular Democratic primary fills ONE At-Large seat — the seat held by
    retiring Councilmember Anita Bonds. Nine Democrats are running, and because
    three or more candidates appear on the ballot, ranked choice voting applies
    for the first time in June 2026; the single winner becomes the Democratic
    nominee for the November general election. This is one of two At-Large
    contests on the June 16 ballot — the other is the separate NON-PARTISAN
    SPECIAL election for the seat Kenyan McDuffie vacated to run for mayor. DC
    has four At-Large seats, of which two are up in 2026. At-Large members
    represent the entire District and serve four-year terms.
  election_date: 2026-06-16
