- slug: ward6
  title: "Ward 6 Councilmember"
  short_description: "Three-term incumbent Charles Allen faces two challengers in the June 16 Democratic primary."
  whats_at_stake: |
    Ward 6 is the only ward with neighborhoods in all four quadrants of the city —
    Capitol Hill, Southwest Waterfront and the Wharf, Navy Yard and Capitol
    Riverfront, NoMa, Penn Quarter, Gallery Place-Chinatown, and Buzzard Point.
    Three-term incumbent Charles Allen, a progressive who chaired the Council's
    judiciary and public safety committee, is seeking re-election. Public safety
    — including disputes over crime data and the city's response to "teen
    takeovers" — is the central issue dividing him from challengers Gloria Nauden
    and Michael Murphy. Three Democrats are on the primary ballot, and ranked
    choice voting applies for the first time in June 2026.
  election_date: 2026-06-16
