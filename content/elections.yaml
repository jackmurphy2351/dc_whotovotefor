- slug: ward1
  title: "Ward 1 Councilmember"
  short_description: "Five Democrats are vying to replace retiring Councilmember Brianne Nadeau in the June 16 primary."
  whats_at_stake: |
    Ward 1 covers Columbia Heights, Mt. Pleasant, Adams Morgan, Petworth, Shaw,
    and parts of U Street. The ward has a large Latinx community, significant
    affordable housing stock, and ongoing gentrification pressures. Retiring
    Councilmember Brianne Nadeau has endorsed Rashida Brown. Five Democrats are
    in the primary, and ranked choice voting applies for the first time in
    June 2026.
  election_date: 2026-06-16
