      title: "2026 DC Elections — DC Board of Elections"
      publisher: dcboe.org
      accessed: 2026-05-27

- slug: delegate
  title: "Non-Voting Delegate to Congress"
  short_description: "Choose DC's next advocate in the U.S. House. Eleanor Holmes Norton is retiring after 35 years in office."
  whats_at_stake: |
    DC's Delegate can speak on the House floor, serve on committees, introduce
    legislation, and fight for the District's budget — but cannot vote on final
    passage of bills. Incumbent Eleanor Holmes Norton is not seeking re-election
    after 18 terms. This is one of the most competitive and expensive delegate
    races in DC history. Five Democrats are in the primary, and ranked choice
    voting applies for the first time in June 2026.
  election_date: 2026-06-16
  sources:
    - url: https://ballotpedia.org/United_States_House_of_Representatives_election_in_the_District_of_Columbia,_2026
      title: "United States House of Representatives election in the District of Columbia, 2026 — Ballotpedia"
      publisher: ballotpedia.org
      accessed: 2026-05-27
