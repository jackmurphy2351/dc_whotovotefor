- slug: mayor
  title: "Mayoral Election"
  short_description: "Choose DC's next mayor — seven Democrats are on the June 16 primary ballot."
  whats_at_stake: |
    The mayor sets DC's annual budget, appoints all major agency heads (including
    the MPD chief), and is the District's primary negotiator with Congress and the
    White House. In 2026, with federal threats to DC autonomy intensifying, this
    race carries extra weight. Incumbent Mayor Muriel Bowser is not seeking
    re-election. Seven Democrats are running in the primary, and ranked choice
    voting applies for the first time in June 2026.
  election_date: 2026-06-16
