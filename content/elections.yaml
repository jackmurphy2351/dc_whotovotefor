      title: "Voter Guide — June 16, 2026 Primary and Special Elections (DCBOE)"
      publisher: dcboe.org
      accessed: 2026-06-04

- slug: at_large_mcduffie
  title: "At-Large Council — Special Election (McDuffie Seat)"
  short_description: "A non-partisan special general election to fill the At-Large seat vacated when Kenyan McDuffie ran for mayor."
  whats_at_stake: |
    This is a NON-PARTISAN SPECIAL GENERAL ELECTION — not a Democratic primary.
    Special elections to fill a Council vacancy are non-partisan by law and open
    to ALL registered DC voters regardless of party; the candidates run as
    Independents as a consequence of that rule, not the reason for it. Four
    candidates (Doni Crawford, Khalil Lee, Jacque Patterson, and Elissa Silverman)
    are on the June 16 ballot. Unlike the other races on the ballot, the winner of
    this special election does NOT advance to November — they are sworn in once
    results are certified and serve only the remainder of Kenyan McDuffie's term,
    through January 2, 2027. The same seat is then up for a full four-year term in
    the November 2026 general election. Ranked choice voting applies for the first
    time in June 2026.
  election_date: 2026-06-16
  sources:
    - url: https://ballotpedia.org/City_elections_in_Washington,_D.C._(2026)
      title: "City elections in Washington, D.C. (2026) — Ballotpedia"
