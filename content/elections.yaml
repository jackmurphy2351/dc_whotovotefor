      title: "Voter Guide — June 16, 2026 Primary and Special Elections (DCBOE)"
      publisher: dcboe.org
      accessed: 2026-06-04
    - url: https://www.nbcwashington.com/news/local/what-to-know-about-the-special-election-for-an-at-large-seat-on-the-dc-council/4112210/
