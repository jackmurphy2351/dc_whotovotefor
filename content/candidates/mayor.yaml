- id: gary-goodweather
  name: "Gary Goodweather"
  election_slug: mayor
  in_fair_elections: true
  campaign_url: https://www.goodweatherfordc.com/
  endorsements:
    - category: "Advocacy & community organizations"
      items:
        - "DMV New Liberals"
        - "DC Voters for Animals"
  short_bio: >
    U.S. Army veteran (Captain); 30+ years in business and organizational
    leadership; Bucknell B.A. (Political Science) and Johns Hopkins MBA (Finance).
    DC area resident for 20+ years.
  long_bio: |
    Gary Goodweather is a U.S. Army veteran who attained the rank of Captain
    before receiving an honorable discharge in 2004. He holds a B.A. in Political
    Science from Bucknell University and an MBA in Finance from Johns Hopkins
    University. With over 30 years of experience in business and organizational
    management, he has worked with DC government agencies and the legislative branch.

    His platform is organized around four signature initiatives:
    - Fare-Free DC: eliminating Metrobus and Metrorail fares for DC residents,
      saving regular riders ~$1,000/year
    - Power DC: solar on public buildings, community solar bill credits,
      geothermal and sewer heat recovery to lower utility bills
    - Rat Free DC: rodent-proof trash containers, dry ice burrow treatment,
      increased trash collection, and a community Rat Block Captain program
    - Capital Corps: a structured civic service program connecting residents to
      training, mentorship, and careers in healthcare, education, tech, and
      public safety; includes a Youth Track with after-school programs and
      a dedicated mental health clinician and nurse in every school

    He supports social housing and community land trusts for permanent
    affordability, and a strong Home Rule / sanctuary stance: DC agencies would
    be prohibited from cooperating with immigration enforcement without a
    judicial warrant, and schools, hospitals, and houses of worship would be
    designated protected spaces.
  advisories: []
  sources:
    - url: https://ballotpedia.org/Mayoral_election_in_Washington,_D.C.,_2026_(June_16_Democratic_primary)
      title: "Mayoral election in Washington, D.C., 2026 — Ballotpedia (Candidate Connection survey)"
      publisher: ballotpedia.org
      accessed: 2026-05-27
