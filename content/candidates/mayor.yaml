- id: ernest-johnson
  name: "Ernest E. Johnson"
  election_slug: mayor
  in_fair_elections: false  # TODO: verify
  campaign_url: null  # TODO: add campaign URL
  endorsements: []
  short_bio: >
    Lifelong Washingtonian; University of Maryland graduate; completing a master's
    in Government at Harvard. Community advocate, nonprofit leader, and opponent
    of public land giveaways to billionaires. Has a prior conviction.
  long_bio: |
    Ernest E. Johnson is a lifelong Washingtonian who graduated from the University
    of Maryland and is currently completing a master's degree in Government at Harvard
    University. He has led nonprofits, chaired local organizations, and fought for
    affordable housing, youth programs, and economic opportunity across all eight wards.
    He has been open about having a prior conviction in his youth, framing his candidacy
    as proof that "redemption is real."

    As founder of the nonprofit Friends of the Frank Reeves Center, he has championed
    using public land for community benefit — including affordable housing and a museum
    of Black Broadway — rather than luxury development. He opposes giving away public
    assets like RFK Stadium to wealthy sports owners without guaranteed community benefits
    and has called for a 26% "community stake" in the Washington Commanders.
  advisories: []
  sources:
