- id: kenyan-mcduffie
  name: "Kenyan McDuffie"
  election_slug: mayor
  in_fair_elections: true
  campaign_url: https://kenyanmcduffie.com/
  endorsements: []
  short_bio: >
    Fourth-generation Washingtonian; 13-year DC Council member (Ward 5, then
    At-Large); author of the NEAR Act; former civil rights attorney in the Obama
    Justice Department. Howard University and UDC graduate.
  long_bio: |
    Kenyan McDuffie is a fourth-generation Washingtonian who served 13 years on
    DC Council, first representing Ward 5 and then serving At-Large. He graduated
    from the University of the District of Columbia and Howard University before
    earning his law degree from the University of Maryland Carey School of Law.
    He worked for Congresswoman Eleanor Holmes Norton, then became a prosecutor
    and later a civil rights attorney in the Obama-era Justice Department.

    In 2016, McDuffie authored the NEAR Act, establishing DC's public-health
    framework for violence reduction. He voted for the 2024 Secure DC omnibus.
    On the Council he led passage of one of the nation's strongest clean energy
    standards, authored the Child Wealth Building Act (Baby Bonds) and the
    District's first Guaranteed Basic Income program, and directed $100 million
    in pandemic relief grants to small businesses. He grew up in Ward 5, home to
    the city's largest share of industrial land, and frames environmental justice
    as a core pillar of his campaign. His mayoral platform pledges to build
    12,000 new housing units by 2030, fully fund the NEAR Act, issue a Day-One
    directive ending MPD cooperation with ICE, expand legal protections for
    immigrant families, and create a federal workforce transition pipeline for
    displaced federal workers. He conditionally supports teen curfews as a
    short-term measure alongside youth programming. Free DC has advised voters
    not to rank him.
