      stance: 2
      explanation: "Orange Plan explicitly mandates: 'Curfew: Individuals under 18 must be off DC streets Sunday–Thursday, 11:00 PM–6:00 AM, with defined exceptions.' This is one of ten named pillars in his governing blueprint."
