- id: janeese-lewis-george
  name: "Janeese Lewis George"
  election_slug: mayor
  in_fair_elections: true
  campaign_url: https://www.janeese4dc.com/
  endorsements:
    - "Free DC (freedcproject.org/news/our-2026-endorsements-guide)"
    - "Working Families Party (workingfamilies.org/candidates/)"
    - "Democratic Socialists of America"
    - "Washington Area Bicyclist Association (WABA)"
  short_bio: >
    Ward 4 Councilmember and native Washingtonian with six years on DC Council.
    Howard University law graduate; former assistant attorney general of DC.
  long_bio: |
    Janeese Lewis George has represented Ward 4 on DC Council since 2021. A native
    Washingtonian, she earned her B.A. in political science from St. John's University
    and her J.D. from Howard University. She worked as an attorney, assistant district
    attorney in Philadelphia, and assistant attorney general of Washington, D.C. before
    entering elected office.

    Her campaign platforms include building more housing by reforming zoning laws and
    streamlining permitting, expanding childcare access, and improving job pathways for
    young people. She opposes teen curfews and supports the NEAR Act's public-health
    approach to violence. She voted for the 2024 Secure DC omnibus legislation.
    She is endorsed by Free DC, the Working Families Party, and DC DSA.
  advisories: []
