  short_bio: >
    Ward 4 Councilmember and native Washingtonian with six years on DC Council.
    Howard University law graduate; former assistant attorney general of DC.
  long_bio: |
    Janeese Lewis George has represented Ward 4 on DC Council since 2021. A native
    Washingtonian, she earned her B.A. in political science from St. John's University
    and her J.D. from Howard University. She worked as an attorney, assistant district
    attorney in Philadelphia, and assistant attorney general of Washington, D.C. before
    entering elected office.

    Her campaign platforms include: universal affordable childcare (every family
    capped at 7% of household income); a 10-point utility affordability plan holding
    Pepco accountable and expanding community solar; Dignified Homes DC (DC-owned
    mixed-income housing with stable rents); modernizing rent stabilization;
    dedicated bus lanes and protected bike lanes; safe injection sites; a rapid
    response Federal Workforce Transition Center for displaced federal employees;
    and a comprehensive public safety plan balancing enforcement with the NEAR Act's
    public health approach. She opposes teen curfews and voted for the 2024 Secure
    DC omnibus. She has been sharply critical of the Bowser administration for not
    doing enough to resist federal encroachment. She is endorsed by Free DC, the
    Working Families Party, and DC DSA.
  advisories: []
