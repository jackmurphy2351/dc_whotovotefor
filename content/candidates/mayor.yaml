- id: hope-solomon
  name: "Hope Solomon"
  election_slug: mayor
  in_fair_elections: false
  campaign_url: https://hopefordc.com/
  endorsements: []
  short_bio: >
    Born and raised in DC; DC Public Schools alum. Worked inside the FBI
    identifying system failures. Family business since 1977; small business
    owner. "Get the basics right" platform: trash, rats, snow, permits, 911.
    "DOGE'd" from federal position February 2026. All-volunteer campaign.
  long_bio: |
    Hope Solomon was born and raised in Washington, DC and attended DC Public
    Schools. Her parents' men's formalwear shop has been part of the city since
    1977 — where she says she learned "what real work looks like, how to treat
    people with dignity, and how hard it is to keep a small business alive when
    the city that depends on you doesn't always make it easy."

    She spent years working inside the FBI and alongside federal law enforcement
    agencies, identifying system failures and fixing them — "not spinning them."
    She lost her federal position in February 2026 amid the Trump administration's
    DOGE-era workforce reductions and launched her mayoral campaign shortly after,
    describing it partly as "her official way to bitch" about both the state of
    the city and federal overreach.

    Her platform is built around competence over new programs. She frames her
    candidacy as prioritizing execution over ideology: "I'm not running to invent
    problems to solve. I'm running to fix the ones we already live with every day —
    trash, rats, snow removal, public safety, permits, 911 response. Get the basics
    right first." She only supports adding programs that "actually work, are paid
    for, and show results," and is explicit about budget limits rather than promising
    new spending.

    She ran an all-volunteer campaign with minimal fundraising (approximately $3,500
    as of March 2026) and did not qualify for DC's public financing program. She
    is explicitly positive about ranked-choice voting, saying it "opens the door to
    real competition, real ideas, and real accountability" so voters can "vote for
    who you believe in — not against who you fear."
  advisories: []
  sources:
