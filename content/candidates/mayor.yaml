- id: ernest-johnson
  name: "Ernest E. Johnson"
  election_slug: mayor
  in_fair_elections: false
  campaign_url: https://ernestformayor2026.com/
  endorsements: []
  short_bio: >
    Columbia Heights resident; real estate broker, Notary Public, and Harvard
    Government Analysis master's graduate. Founder, Friends of Frank Reeves Center;
    eight-year Back-2-School Block Party organizer. DC Apprenticeship Council member.
    Has a prior conviction.
  long_bio: |
    Ernest E. Johnson is a lifelong Washingtonian and Columbia Heights resident who
    attended Banneker Junior High (DC public school), earned a B.S. from the
    University of Maryland, and completed a master's in Government Analysis at
    Harvard University. He is a licensed real estate broker and Notary Public, and
    serves on the DC Apprenticeship Council and the 3rd District Advisory Council.

    As founder of the nonprofit Friends of the Frank Reeves Center (501c4), Johnson
    has organized the Back-2-School Block Party for eight years, providing backpacks,
    school supplies, and free haircuts to students at Raymond and Tubman Elementary
    Schools, which his nonprofit adopted in 2013. He has championed using public land
    for community benefit — including affordable housing and a museum of Black Broadway
    — rather than luxury development, and opposes public asset giveaways like the RFK
    Stadium deal. He has called for a 26% "community stake" in the Washington Commanders.
    He has been open about having a prior conviction in his youth, framing his candidacy
    as proof that "redemption is real."

    His platform focuses on three pillars. On education: a fundamentals-first curriculum
    (phonics-based reading by 3rd grade, arithmetic mastery, cursive writing) in early
    grades, transitioning to mandatory STEM, vocational training tracks with industry
    certifications and employer partnerships, and college readiness programs — with a
    target of 95% 3rd-grade reading proficiency and 95% graduation rate by 2029. On
    public safety: community-based policing in every ward, body cameras, de-escalation
    training, violence interruption programs, drug court expansion, mental health and
    addiction treatment in corrections, and youth intervention through after-school
    programs, sports, and mentorship. On revenue: a "Beautify DC" jobs initiative
    employing seniors and youth, taxing currently exempt high-value properties, and
    commuter tolls on major arteries into the District.
  advisories: []
