      publisher: "Gary Goodweather Campaign"
      accessed: 2026-05-28
    - url: https://www.goodweatherfordc.com/policy-plans
      title: "Policy & Plans — Gary Goodweather for Mayor"
      publisher: "Gary Goodweather Campaign"
      accessed: 2026-05-28
