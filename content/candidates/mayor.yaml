- id: vincent-orange
  name: "Vincent Orange"
  election_slug: mayor
  in_fair_elections: false
  campaign_url: https://orangeformayor.com/
  endorsements: []
  short_bio: >
    Attorney, CPA, and long-serving DC politician. BS/BA (University of the
    Pacific), JD Howard, LLM Taxation Georgetown; Harvard Kennedy School
    executive certificates. Former CEO of DC Chamber of Commerce; Region VP
    at PEPCO. Author of 30+ enacted DC laws including the $15 minimum wage.
  long_bio: |
    Vincent Orange is an attorney and certified public accountant whose academic
    credentials include a B.S. in Business Administration and B.A. in Communications
    from the University of the Pacific, a J.D. from Howard University School of Law,
    an LLM in Taxation from Georgetown University Law Center, and executive
    certificates from Harvard Kennedy School in senior government leadership and
    crisis management. He was selected at age 14 as an A Better Chance Scholar to
    attend Fountain Valley College Preparatory in Colorado, graduating ranked 5th
    in the Class of 1975.

    In the private sector he served as President and CEO of the DC Chamber of
    Commerce (2016–2020, elevated the Chamber from #5 to #1 nationally), Region
    Vice President for Government Affairs and Public Policy at PEPCO, Tax Senior
    at Arthur Andersen, and Chief Financial Officer at the National Children's Center.

    In elected office he served as Ward 5 Councilmember (8 years) and At-Large
    Councilmember (2 terms), chairing the Committee on Government Operations
    (23 agencies) and the Committee on Business, Consumer & Regulatory Affairs
    (34 agencies). He was DC's Democratic National Committeeman during the Obama
    administration (2006–2014). He has authored or enacted more than 30 DC laws,
    including the $15 minimum wage with CPI indexing, MBSYEP youth employment
    expansion, the CBE statutory enhancements, the Textbooks-on-Time Act, and
    the Ballpark Omnibus Act. He received Vincent Orange Day (April 13, 2025),
    a Biden Lifetime Achievement Award (2023), and is a Washington DC Hall of
    Fame Society inductee (2018).

    His "Orange Plan" is a 10-point governing blueprint focused on execution
    over ideology: education from pre-K through guaranteed post-secondary
    pathways; a youth curfew paired with apprenticeship mandates; restoring MPD
    to ~4,100 officers; fiscal discipline and AAA credit restoration; homeownership
    expansion with workforce and tiny homes for residents earning $50,000 or less;
    economic growth without tax increases; working pragmatically with Congress and
    the White House; and ranked-choice voting as a tool for consensus leadership.
    He supports DC statehood and Home Rule preservation.
  advisories: []
  sources:
