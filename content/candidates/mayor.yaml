# ── WRITE-IN CANDIDATE ────────────────────────────────────────────────────────
# Yaida Ford did not qualify for the primary ballot and is running as a write-in.
- id: yaida-ford
  name: "Yaida Ford"
  election_slug: mayor
  in_fair_elections: false
  campaign_url: https://www.yaida4dc.com/
  endorsements: []
  short_bio: >
    Write-in mayoral candidate and civil rights attorney. Two decades of
    litigation against the DOJ, MPD, WMATA, and DC Housing Authority on behalf
    of workers and families. Senior advocate, urban farmer, and food justice
    activist.
  long_bio: |
    Yaida Ford is a write-in candidate for mayor of Washington, D.C. She did
    not qualify for the June 16, 2026 Democratic primary ballot.

    Ford is a civil rights attorney whose career began in 2005 clerking for
    Judge Harold Cushenberry at DC Superior Court's Criminal Division. She spent
    four years at the Legal Aid Society of DC representing disabled workers
    seeking Social Security benefits, then served as legislative counsel to
    Council member Jim Graham (Ward 1), focusing on job training for low-income
    mothers. Since entering private practice in 2012 she has specialized in
    civil rights litigation, winning verdicts or settlements against the U.S.
    DOJ, USDA (10 settlements), MPD, WMATA, U.S. Park Police, DC Housing
    Authority, public charter schools, and private developers.

    Ford is a Marshall-Brennan Fellow who taught constitutional literacy at
    Dunbar High School and an Abramson Fellow. Her senior advocacy work
    includes helping elderly couples avoid foreclosure after predatory lending,
    protecting senior landlords victimized by rental assistance fraud, and
    challenging corporate landlords who neglect maintenance to force seniors out.
    She has sued the District over permitting barriers to urban food production,
    and raises backyard hens, multiple garden beds, and fruit trees at her home
    in a DC food desert.

    Her father Earl was among the first Black men hired as a soil scientist by
    the USDA in the early 1970s; her mother Linda taught 16 years in Head Start.
    Both parents worked Louisiana cotton fields to pay for college — a legacy
    of resilience that Ford cites as the foundation of her civic values.

    Her campaign platform emphasizes economic empowerment through vocational
    trades and AI upskilling, DC statehood and local autonomy, government
    accountability, balanced housing policy protecting tenants and small
    landlords alike, DPR programming for youth, and transparent community policing.
  advisories: []
  sources:
    - url: https://51st.news/dc-mayoral-race-goodweather-solomon-sampath-2026/
      title: "These four candidates are also running for D.C. mayor — The 51st"
      publisher: "The 51st"
      accessed: 2026-05-28
