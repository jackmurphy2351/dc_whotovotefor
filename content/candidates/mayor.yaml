- id: vincent-orange
  name: "Vincent Orange"
  election_slug: mayor
  in_fair_elections: false  # TODO: verify
  campaign_url: null  # TODO: add campaign URL
  endorsements: []
  short_bio: >
    Attorney, CPA, and long-serving DC politician. Former Ward 5 Councilmember
    (2 terms) and At-Large Councilmember (2 terms); DC Democratic National
    Committeeman. Championed DC's $15 minimum wage.
  long_bio: |
    Vincent Orange is an attorney and certified public accountant with degrees in
    taxation, law, communications, and business administration. He has served two
    terms as Ward 5 Councilmember and two terms as an At-Large Councilmember on
    DC Council, and as DC Democratic National Committeeman.

    During his time on Council, he helped spark economic development projects
    including Home Depot, Costco, Rhode Island Row, and Union Market in NoMa.
    He secured DC's $15 minimum wage with CPI indexing, passed laws on sick leave
    and wage theft, and expanded youth employment through MBSYEP. He reopened
    McKinley Technology High School. He has been a longtime advocate for DC
    statehood, including speaking at the 20th Anniversary of the Million Man March.
  advisories: []
  sources:
