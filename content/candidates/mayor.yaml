  election_slug: mayor
  in_fair_elections: false  # TODO: verify
  campaign_url: null  # TODO: add campaign URL
  endorsements: []
  short_bio: >
    Cybersecurity director and federal contractor. Born in India, immigrated at
    age 7; DC resident for 10+ years. Not a career politician.
  long_bio: |
    Rini Sampath is a cybersecurity director who was born in Theni, India,
    immigrated to the United States at age seven, and has spent over a decade
    calling DC home. As a federal contractor, she has spent years improving
    government programs and citizen services. She has also worked as a field
    organizer in local communities and managed higher education nonprofit programs.

    Her campaign focuses on fixing basic city services, lowering the cost of
    living (particularly childcare and housing), strengthening neighborhoods
    (including addressing food deserts east of the Anacostia River), and making
    DC's streets safer for pedestrians and cyclists. She is not a career politician
    and is not affiliated with any special interest groups.
