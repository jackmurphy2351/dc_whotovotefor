  short_bio: >
    Cybersecurity company director, age 31; U Street resident. Former USC Student
    Body President (first all-women ticket). Built three civic tech tools: "DC Fix It"
    311 app, budget transparency dashboard, and small business permitting concierge.
    "Fix the basics" execution-first platform. Did not qualify for DC Fair Elections.
  long_bio: |
    Rini Sampath is a cybersecurity company director who was born in Theni, India,
    immigrated to the United States at age seven, and has lived in the U Street
    neighborhood for over a decade. At the University of Southern California she was
    elected Student Body President as part of the first all-women ticket. She has
    since worked as a federal contractor improving government programs and citizen
    services, as a field organizer, and managing higher education nonprofit programs.

    Her campaign launched after the February 2026 snowstorm exposed what she called
    a failure of basic city services — neighbors stranded, people with disabilities
    unable to leave their homes, workers losing income. She did not qualify for DC's
    public financing program and ran without special interest backing.

    To demonstrate her governing philosophy, her team built three civic tech
    prototypes before election day: "DC Fix It" (a redesigned 311 app with
    geolocated reporting, neighbor request visibility, and request tracking), a
    public budget transparency dashboard, and a Small Business Permitting Concierge
    to help entrepreneurs navigate DC's licensing and permit process.

    Her platform covers five areas. On housing: set a production goal exceeding the
    prior 36,000-unit benchmark, eliminate parking minimums near transit, crack down
    on predatory rental fees, protect the Housing Production Trust Fund. On public
    safety: address MPD's $75M+ overtime problem through staffing stabilization; full
    operational review of the public safety ecosystem; evidence-based violence
    interruption programs; expand Late Night Hype and MBSYEP. On education: target
    the 40% chronic absenteeism rate through interagency coordination (DCPS, OSSE,
    health providers, family outreach); make early literacy a top priority (only 26%
    of DC 4th graders read proficiently); expand afterschool seats in Wards 7 and 8;
    revive the DC Youth Advisory Council as a paid leadership program. On statehood:
    build DC statehood into a national Democratic priority; no data sharing between
    MPD and ICE; full audit of DC government contacts with federal enforcement. On
    transportation: refocus Vision Zero on execution with a public project dashboard;
    bus priority and protected bike lanes where appropriate; better repair tracking.
  advisories: []
