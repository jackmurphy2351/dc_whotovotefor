  short_bio: >
    Former At-Large Councilmember 2015–2023; lead champion for DC's paid family
    leave law. Former Washington Post reporter and DC Fiscal Policy Institute
    policy analyst. Ward 6 / Capitol Hill homeowner. Endorsed by 17 groups
    including AFL-CIO, Washington Teachers' Union, AFSCME, ATU, and DC Firefighters.
    Aligned with Janeese Lewis George.
  long_bio: |
    Elissa Silverman (age 53) grew up in Baltimore public schools and earned her
    BA from Brown University. She began her career as a journalist — authoring the
    Washington City Paper's "Loose Lips" political column and later reporting for
    the Washington Post — before moving into public policy at the DC Fiscal Policy
    Institute, where she analyzed the city's budget and led advocacy campaigns to
    raise the minimum wage and increase agency transparency.

    She served as an At-Large Councilmember from 2015 to 2023, losing her seat to
    Kenyan McDuffie in 2022. Her signature legislative achievement was co-authoring
    DC's paid family and medical leave law — which provides up to 12 weeks of paid
    leave — that launched in 2020; her persistent oversight led to benefits
    increases and a cut in the employer tax rate. Other council highlights include:
    leading the effort to create a maintenance and repair fund for public housing;
    funding the Cure the Streets violence interruption program (with AG Karl Racine);
    creating the DC Healthcare Sector Partnership to train DC residents for
    healthcare careers; expanding the Marion Barry Summer Youth Employment Program;
    and passing inclusionary zoning measures for affordable units. She briefly
    worked for Maryland Governor Wes Moore's Department of Labor in 2024. She is
    currently a board member of Seabury Resources for Aging.

    She is a Ward 6 resident and Capitol Hill homeowner, a longtime bike commuter,
    and is aligned with DC Councilmember Janeese Lewis George. Her campaign focuses
    on stopping Council collaboration with ICE, budget accountability, increasing
    the housing supply, properly training and staffing MPD alongside evidence-based
    violence prevention, and reducing school truancy.
