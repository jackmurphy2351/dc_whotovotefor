      stance: 0
      explanation: "In her DC for Democracy questionnaire Crawford says 'simply increasing the size of the police force will not resolve the underlying conditions that drive crime,' but argues MPD is effectively 'doing the job of more officers' through costly mandatory overtime (over 1.81 million OT hours / $133 million in FY2025) and that DC should 'rebalance the size of the force' — hiring officers to cut overtime and reinvest the savings (~$45 million) into root-cause programs. Mixed: supports right-sizing staffing but rejects more police as the priority for reducing crime."
      sources:
