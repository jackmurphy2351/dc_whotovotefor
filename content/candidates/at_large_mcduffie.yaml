  # At-Large Council (Special Election — McDuffie seat) — 2026 NON-PARTISAN SPECIAL GENERAL ELECTION
# All four candidates run as Independents. This is NOT a Democratic primary.
# Special elections to fill a Council vacancy are non-partisan by law, so the
# contest appears on every registered voter's ballot regardless of party.
# Source: https://ballotpedia.org/City_elections_in_Washington,_D.C._(2026)

