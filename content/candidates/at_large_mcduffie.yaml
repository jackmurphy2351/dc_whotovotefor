          title: "DC Fair Elections Program At-Large special-election debate (April 28, 2026)"
          publisher: "DC Office of Campaign Finance"
          accessed: 2026-06-03

    - question_id: transit_traffic_cameras
      stance: -1
      quote: "No. I think we should keep them though ... they're designed to make the streets safe, not to raise revenue."
      explanation: "In the April 28, 2026 Fair Elections Program special-election debate lightning round, Silverman opposed expanding automated traffic cameras while supporting keeping the existing ones, framing them as a safety (not revenue) tool."
      sources:
        - url: https://www.youtube.com/watch?v=EPfD0_neF04
          title: "DC Fair Elections Program At-Large special-election debate (April 28, 2026)"
          publisher: "DC Office of Campaign Finance"
          accessed: 2026-06-03

    - question_id: housing_production_vs_affordability
      stance: 0
      quote: "I don't think it's a tradeoff."
      explanation: "At the April 28, 2026 Fair Elections Program special-election debate Silverman rejected the production-vs-affordability framing — 'we need to do both,' build more and remove regulatory burdens while also filling hundreds of vacant DC Housing Authority units. Recorded as mixed."
      sources:
        - url: https://www.youtube.com/watch?v=EPfD0_neF04
          title: "DC Fair Elections Program At-Large special-election debate (April 28, 2026)"
          publisher: "DC Office of Campaign Finance"
          accessed: 2026-06-03

    - question_id: housing_office_conversion
      stance: 0
      explanation: "At the April 28, 2026 Fair Elections Program special-election debate Silverman said subsidizing office-to-residential conversions is 'the future of our downtown' (a change in her thinking), but 'challenge[d] the tradeoff,' arguing that because taxpayer dollars subsidize the conversions 'we can expect some affordability in those projects.' Supports conversions but resists a full affordability waiver; recorded as mixed."
      sources:
        - url: https://www.youtube.com/watch?v=EPfD0_neF04
          title: "DC Fair Elections Program At-Large special-election debate (April 28, 2026)"
          publisher: "DC Office of Campaign Finance"
          accessed: 2026-06-03

    - question_id: labor_worker_protections
      stance: 2
      quote: "She was the lead champion for D.C.'s paid family leave program, which has benefitted tens of thousands of workers… led advocacy campaigns to raise the minimum wage."
      explanation: "Silverman co-authored and was the lead champion of DC's paid family and medical leave law (up to 12 weeks) and previously led campaigns to raise the minimum wage. Expanding worker protections is her signature issue — strongly supports. On tipped wages, her DC for Democracy questionnaire notes she 'supported I-77 when I was on the Council, and voted for I-82 as a resident,' but says she 'will not vote for any other initiative on this topic or really any other policy until we reform our initiative process' — a procedural stance rather than a retreat from worker protections."
      sources:
        - url: https://www.elissafordc.com/
          title: "Supporting D.C.'s Workers and Businesses — Elissa Silverman for DC Council"
          publisher: "Elissa Silverman Campaign"
          accessed: 2026-06-04
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Elissa Silverman"
          publisher: "DC for Democracy"
          accessed: 2026-06-15

    - question_id: homelessness_housing_first
      stance: 1
      explanation: "In her DC for Democracy questionnaire Silverman argues 'when housing costs are high, homelessness is high,' so DC must build more housing (market-rate and affordable) and fill the nearly 10% of vacant Class C (mostly affordable) units. For Permanent Supportive Housing recipients she would 'make good on providing the supportive part of PSH' — social workers and other supports — a housing-and-services approach rather than encampment clearing."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Elissa Silverman"
          publisher: "DC for Democracy"
          accessed: 2026-06-15

    - question_id: youth_curfew_support
      stance: -1
      explanation: "In her DC for Democracy questionnaire Silverman is skeptical that curfews work — 'almost no one has been arrested under the curfew law, and yet we still see large groups of kids causing disturbances' — and pivots to investing in alternatives (late-night programs, truancy programs, job training) and getting chronically absent students back in school, rather than endorsing curfew enforcement."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Elissa Silverman"
          publisher: "DC for Democracy"
          accessed: 2026-06-15

    - question_id: youth_curfew_programming
      stance: 2
      explanation: "In her DC for Democracy questionnaire Silverman calls for 'investing in alternatives for our children, like more late-night programs, more school truancy programs, and more job training programs,' citing her record as former Labor and Workforce Development Committee chair funding youth pathways into healthcare and IT jobs, and pledging to 'double down on those investments.'"
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Elissa Silverman"
          publisher: "DC for Democracy"
          accessed: 2026-06-15

    - question_id: environment_renewable_energy
      stance: 1
      explanation: "In her DC for Democracy questionnaire Silverman supports the Healthy Homes Act's electric-appliance assistance, opposes the mayor 'raiding our renewable energy funds' (the Sustainable Energy Trust Fund) and would vote to restore them, and backs funding to help residents and businesses switch from gas to electric — though she is 'not sure' she supports a full fossil-fuel-appliance ban yet."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Elissa Silverman"
          publisher: "DC for Democracy"
          accessed: 2026-06-15

    - question_id: fiscal_progressive_taxation
      stance: 2
      explanation: "In her DC for Democracy questionnaire Silverman says she has 'voted in the past to raise taxes to make our tax code more progressive,' favoring tax changes that 'improve the lives of residents' (the child tax credit, affordable housing, a larger EITC), and explicitly states 'I do think we should adopt the business activity tax, which will also make our system fairer.' Strongly supportive of progressive revenue, while cautioning against raising taxes 'just for the sake of raising taxes.'"
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Elissa Silverman"
          publisher: "DC for Democracy"
          accessed: 2026-06-15

    - question_id: econ_business_activity_tax
      stance: 2
      quote: "I do think we should adopt the business activity tax, which will also make our system fairer."
      explanation: "In her DC for Democracy questionnaire Silverman explicitly states 'I do think we should adopt the business activity tax, which will also make our system fairer,' and supports Councilmember Lewis George's call to use it to significantly expand child-care funding. Strongly supports."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Elissa Silverman"
          publisher: "DC for Democracy"
          accessed: 2026-06-15

    - question_id: childcare_universal
      stance: 1
      explanation: "In her DC for Democracy questionnaire Silverman supports 'expanding our child care supports' and would vote for Councilmember Lewis George's proposal to use the business activity tax to fund a significant expansion. She emphasizes getting kids into school as early as possible and praises New York's universal-style Pre-K-2 push — supportive of broadly expanding subsidized childcare, though she does not spell out a universal-regardless-of-income guarantee."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Elissa Silverman"
          publisher: "DC for Democracy"
          accessed: 2026-06-15

    - question_id: education_mayoral_control
      stance: 1
      explanation: "In her DC for Democracy questionnaire Silverman says she has 'long supported a larger role for the Board of Education' and that it 'can take a far stronger role without fully undoing mayoral control' — for example, giving the elected board power to hire or fire the Chancellor to bring in more parent voices. Supports shifting authority toward the elected board, but stops short of fully ending mayoral control."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Elissa Silverman"
          publisher: "DC for Democracy"
          accessed: 2026-06-15

- id: khalil-lee
  name: "Khalil Lee"
  election_slug: at_large_mcduffie
  # Fair Elections certification revoked by OCF on 2026-04-27 (Docket No. 2026 FP-004);
  # see the advisories below.
  in_fair_elections: false
  campaign_url: https://www.lee4dc.com/
  endorsements: []
  short_bio: >
    Native Washingtonian and former congressional staffer. Born at DC General;
    grew up in Ward 7; graduated Friendship Public Charter School Collegiate
    Academy; attended University of Vermont via DC TAG Program (2016). Campaign
    focuses on housing affordability and anti-displacement, DC home rule and
    statehood, public safety, and economic development.
  long_bio: |
    Khalil Lee is a native Washingtonian born at DC General hospital — then
    attached to the Central Detention Facility — to an incarcerated mother. He
    grew up through DC public schools, participated in the Marion Barry Summer
    Youth Employment Program and DC Youth and Government, and volunteered weekly
    with the Mayor's Serve DC initiative. He graduated from Friendship Public
    Charter School Collegiate Academy in Ward 7, and through the DC TAG Program
    attended the University of Vermont, where he served on Student Government,
    worked in Burlington City Hall, and won the University's first national
    championship in American Policy Debate. He graduated in 2016 alongside his
    adoptive parents Bruce and Maureen Normann, whom he met through Holy
    Comforter Saint Cyprian Roman Catholic Church on East Capitol Street.

    He subsequently worked as a congressional staffer, an experience he says
    gives him "a unique vantage point to navigate the strained relationship
    between the District and the federal government." He frames his candidacy
    around bridging "homegrown understanding and federal insight" to fight for
    DC's autonomy and improve economic opportunity across the District.

    His campaign centers on the housing affordability and anti-displacement
    crisis — noting that "revitalization without affordability isn't progress;
    it's displacement dressed up as development" — as well as DC home rule and
    statehood, public safety, and economic development.
  advisories:
    - organization: "WAMU"
      year: 2026
      text: >-
        In March 2026, WAMU reported that several people listed as contributors in
        Lee's campaign finance filings said they never donated to his campaign — one
        also said Lee listed their two children as contributors and petition
        volunteers though they never gave money or worked for him. The Office of
        Campaign Finance opened an investigation after rival candidate Elissa
        Silverman flagged the discrepancies. Lee, who stood to receive $110,000 in
        public Fair Elections funds, did not respond to WAMU's requests for comment.
      source:
        url: https://wamu.org/story/26/03/25/dc-council-candidate-faces-allegations-false-donation-reporting/
        title: "A D.C. Council candidate accused of falsely reporting campaign donations"
        publisher: "WAMU 88.5"
        accessed: 2026-06-12
    - organization: "DC Office of Campaign Finance"
      year: 2026
      text: >-
        On April 27, 2026, the Office of Campaign Finance issued an Order to Revoke
        Certification (Docket No. 2026 FP-004, subject 'Certification Revocation')
        against Lee and his Lee4DC committee, ending their participation in the Fair
        Elections Program. OCF's public Fair Elections registry lists the campaign's
        certification status as revoked.
      source:
        url: https://fairelections.ocf.dc.gov/public/registrantDisclosureDetails/193
        title: "Fair Elections Program registrant disclosure — Lee4DC (Khalil Lee), Order to Revoke Certification, Docket No. 2026 FP-004"
        publisher: "DC Office of Campaign Finance"
        accessed: 2026-06-12
  sources:
    - url: https://www.lee4dc.com/
      title: "Khalil Lee for DC Council — Campaign Website"
      publisher: "lee4dc.com"
      accessed: 2026-06-03
    - url: https://eastoftheriverdcnews.com/2026/05/01/who-is-running-in-the-at-large-special-election/
      title: "Who is Running in the At-Large Special Election? — East of the River DC News"
      publisher: "East of the River DC News"
      accessed: 2026-06-03
  positions:
    - question_id: home_rule_dc_resist
      stance: 1
      quote: "The federal government's unyielding encroachment on D.C.'s autonomy... I feel a fervent responsibility to push back against that."
      explanation: "Explicitly frames federal overreach as a core campaign issue, calling it 'unyielding encroachment' that undermines DC's ability to govern itself. Supports DC statehood. Argues his congressional experience gives him a vantage point to 'navigate the strained relationship between the District and the federal government' — assertive in principle but also emphasizes strategic use of federal connections rather than confrontation alone."
      sources:
        - url: https://www.lee4dc.com/
          title: "Khalil Lee for DC Council — Campaign Website"
          publisher: "lee4dc.com"
          accessed: 2026-06-03
