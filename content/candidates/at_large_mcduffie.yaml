  # At-Large Council (Special Election — McDuffie seat) — 2026 NON-PARTISAN SPECIAL GENERAL ELECTION
# All three candidates run as Independents. This is NOT a Democratic primary.
# ALL registered DC voters may vote regardless of party affiliation.
# Source: https://ballotpedia.org/City_elections_in_Washington,_D.C._(2026)

- id: doni-crawford
  name: "Doni Crawford"
  election_slug: at_large_mcduffie
  in_fair_elections: false  # TODO: verify Fair Elections status
  campaign_url: https://www.donicrawford.com/
  endorsements:
    - "Opportunity DC"
    - "District of Columbia Association of REALTORS"
    - "Greater Capital Association of REALTORS"
    - "DC Charter School Action"
    - "Center for Strong Public Schools Action Fund"
    - "Washington Parking Association"
  short_bio: >
    At-Large Councilmember (Independent), appointed unanimously January 2026.
    Former Committee Director of the Council's Committee on Business and Economic
    Development; formerly at DC Fiscal Policy Institute (secured $41M pandemic
    relief for excluded workers). Negotiated RFK/Commanders stadium deal ($50M
    community benefits agreement). U. Pittsburgh (Master of Public and
    International Affairs). Cross-endorsing with Jacque Patterson.
  long_bio: |
    Doni Crawford (age 36) was appointed unanimously to the DC Council as an
    At-Large Independent on January 20, 2026, filling the seat vacated by Kenyan
    McDuffie. She holds a Master of Public and International Affairs and a BA in
    Political Science and Hispanic Languages and Literatures from the University
    of Pittsburgh.

    She built her career around affordable housing, racial justice, and inclusive
    economic development. At DC Fiscal Policy Institute she authored influential
    research and led a coalition that secured $41 million in pandemic relief for
    workers excluded from federal programs — including informal-economy workers,
    returning citizens, and undocumented workers. She earlier drove community
    revitalization strategies at Neighborhood Allies in Pittsburgh, managing
    multi-million-dollar grant programs. She joined Kenyan McDuffie's Council
    staff in 2022 as a policy adviser, became his legislative director, and then
    served as Committee Director for the Committee on Business and Economic
    Development, where she played a pivotal role negotiating the RFK Stadium /
    Washington Commanders redevelopment — securing a $50 million community
    benefits agreement and local hiring requirements. Her work has been featured
    in Time Magazine, CNN, and The Washington Post.

    Since her appointment she has been active across all eight wards and received
    the inaugural Wanda Alston Legacy Award from the Wanda Alston Foundation for
    her support of LGBTQ homeless youth. She has agreed to cross-endorse with
    Jacque Patterson.

    On public safety she supports a "right-sized, well-trained" MPD and opposes
    using DC's police department as a tool of federal immigration enforcement. On
    youth safety, she authored legislation pairing any curfew zone with mandatory
    youth programming and clear limits on law enforcement discretion. On
    statehood, one of her first meetings as Councilmember was with DC's Shadow
    Senator to align on strategy; she has co-introduced legislation to protect DC
    residents from federal law enforcement overreach and calls for a dedicated
    federal relations office at the Council level.
  advisories: []
  sources:
    - url: https://www.donicrawford.com/
      title: "Doni Crawford for DC Council — Campaign Website"
      publisher: "Doni Crawford Campaign"
      accessed: 2026-05-29
    - url: https://51st.news/dc-council-at-large-special-election-candidates-interview/
      title: "Meet the candidates running in the D.C. Council At-Large special election — The 51st"
      publisher: "The 51st"
      accessed: 2026-05-27
  positions:
    - question_id: youth_curfew_support
      stance: 1
      explanation: "Conditionally supports teen curfews as a short-term measure, to be phased out by 2028. Her own legislation required curfew zones to be paired with alternative youth programming and placed clear limits on law enforcement discretion — emphasizing that curfews alone are not a public safety strategy."
      sources:
        - url: https://www.donicrawford.com/
          title: "Doni Crawford for DC Council — Campaign Website"
          publisher: "Doni Crawford Campaign"
          accessed: 2026-05-29
        - url: https://51st.news/dc-council-at-large-special-election-candidates-interview/
          title: "Meet the candidates — The 51st"
          publisher: "The 51st"
          accessed: 2026-05-27

    - question_id: youth_curfew_programming
      stance: 2
      explanation: "Authored legislation requiring that youth programming be provided alongside any curfew zone. Supports investing in out-of-school programming, behavioral health clinicians in schools, and extended rec center hours."
      sources:
        - url: https://www.donicrawford.com/
          title: "Doni Crawford for DC Council — Campaign Website"
          publisher: "Doni Crawford Campaign"
          accessed: 2026-05-29
        - url: https://51st.news/dc-council-at-large-special-election-candidates-interview/
          title: "Meet the candidates — The 51st"
          publisher: "The 51st"
          accessed: 2026-05-27

    - question_id: education_mental_health_schools
      stance: 2
      explanation: "Pledges to protect the School-Based Behavioral Health Program — which places clinicians in DC public and charter schools — from budget cuts, calling cuts 'not a savings but a cost we will pay in other ways.' Wants to expand out-of-school time funding for safe, structured after-school programming."
      sources:
        - url: https://www.donicrawford.com/
          title: "Doni Crawford for DC Council — Campaign Website"
          publisher: "Doni Crawford Campaign"
          accessed: 2026-05-29

    - question_id: mpd_ice_cooperation
      stance: 2
      explanation: "Explicitly states that DC's police department must never be used as a tool of federal immigration enforcement. Has co-introduced legislation to protect DC residents from federal law enforcement overreach."
      sources:
        - url: https://www.donicrawford.com/
          title: "Doni Crawford for DC Council — Campaign Website"
          publisher: "Doni Crawford Campaign"
          accessed: 2026-05-29

    - question_id: statehood_top_priority
      stance: 2
      explanation: "Treats statehood as an urgent priority; one of her first acts as Councilmember was meeting with DC's Shadow Senator to align on strategy. Has co-introduced legislation protecting residents from federal law enforcement overreach. Calls for a dedicated federal relations office at the Council level so DC's voice on the Hill is consistent and strategic."
      sources:
        - url: https://www.donicrawford.com/
          title: "Doni Crawford for DC Council — Campaign Website"
          publisher: "Doni Crawford Campaign"
          accessed: 2026-05-29

    - question_id: housing_upzoning
      stance: 2
      explanation: "Supports 'building more housing across every ward, including duplexes and small apartment buildings in neighborhoods that currently only allow single-family homes, and converting vacant office buildings into places people can live,' and fixing the Inclusionary Zoning process so affordable units stop sitting empty."
      sources:
        - url: https://www.donicrawford.com/
          title: "Doni Crawford for DC Council — Campaign Website"
          publisher: "Doni Crawford Campaign"
          accessed: 2026-05-30

    - question_id: econ_small_business_tax_relief
      stance: 1
      explanation: "Wants to 'make DC genuinely easier to do business in, especially for minority and women-owned businesses,' create a one-stop place for new business owners, and reduce unnecessary licensing barriers. Introduced legislation to examine whether DC's tax incentive programs actually benefit the District — emphasizing accountable incentives and lower barriers more than across-the-board tax cuts."
      sources:
        - url: https://www.donicrawford.com/
          title: "Doni Crawford for DC Council — Campaign Website"
          publisher: "Doni Crawford Campaign"
          accessed: 2026-05-30

- id: jacque-patterson
  name: "Jacque Patterson"
  election_slug: at_large_mcduffie
  in_fair_elections: false  # TODO: verify Fair Elections status
  campaign_url: https://www.jacque4dc.com/
  endorsements:
    - "ElectED DC (education equity group)"
  short_bio: >
    DC State Board of Education President; military veteran; 30-year DC community
    servant. Born in foster care, raised on social safety net programs. Former
    Community Affairs coordinator (Mayor Williams), Housing Finance Agency Board
    (Mayor Fenty), Advisory Board on Veterans Affairs (Mayor Gray). ANC
    commissioner (5 terms). Cross-endorsing with Doni Crawford.
  long_bio: |
    Jacque Patterson (age 61) was born in foster care and raised in a home that
    relied on food stamps and social safety net programs. That experience
    instilled in him a lifelong commitment to preserving people's dignity in
    government — he often recalls standing in line with his parents for benefits
    recertification and the judgment that came with it. He served in the military,
    where he internalized a "service before self" ethos, and has spent 30 years
    serving DC communities.

    He has held appointments under three DC mayors: Community Affairs coordinator
    in Mayor Anthony Williams' administration, Housing Finance Agency Board of
    Directors appointee under Mayor Adrian Fenty, and Advisory Board on Veterans
    Affairs appointee under Mayor Vincent Gray. He served on an ANC for five terms
    (ten years) and has worked in education, nonprofits, and charter schools. He
    is currently President of the DC State Board of Education and lives in Ward 8,
    where he has been based since the mid-1990s.

    On housing, he supports balanced policies that protect tenants while expanding
    the supply of affordable housing; in the 51st interview he proposed increasing
    the Housing Production Trust Fund from $100M to $250M per year, against Mayor
    Bowser's proposed 50% cut. He is a strong advocate for "community schools"
    that provide resources for families beyond basic education. On public safety,
    he believes enforcement and prevention must work together, with investment in
    education, mentorship, and workforce opportunity for young people. He supports
    teen curfews only temporarily, while youth programming scales up. He has agreed
    to cross-endorse with Doni Crawford.
  advisories: []
