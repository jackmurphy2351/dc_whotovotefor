- id: khalil-lee
  name: "Khalil Lee"
  election_slug: at_large_mcduffie
  in_fair_elections: true
  campaign_url: https://www.lee4dc.com/
  endorsements: []
  short_bio: >
    Native Washingtonian and former congressional staffer. Born at DC General;
    grew up in Ward 7; graduated Friendship Public Charter School Collegiate
    Academy; attended University of Vermont via DC TAG Program (2016). Campaign
    focuses on housing affordability and anti-displacement, DC home rule and
    statehood, public safety, and economic development.
  long_bio: |
    Khalil Lee is a native Washingtonian born at DC General hospital — then
    attached to the Central Detention Facility — to an incarcerated mother. He
    grew up through DC public schools, participated in the Marion Barry Summer
    Youth Employment Program and DC Youth and Government, and volunteered weekly
    with the Mayor's Serve DC initiative. He graduated from Friendship Public
    Charter School Collegiate Academy in Ward 7, and through the DC TAG Program
    attended the University of Vermont, where he served on Student Government,
    worked in Burlington City Hall, and won the University's first national
    championship in American Policy Debate. He graduated in 2016 alongside his
    adoptive parents Bruce and Maureen Normann, whom he met through Holy
    Comforter Saint Cyprian Roman Catholic Church on East Capitol Street.

    He subsequently worked as a congressional staffer, an experience he says
    gives him "a unique vantage point to navigate the strained relationship
    between the District and the federal government." He frames his candidacy
    around bridging "homegrown understanding and federal insight" to fight for
    DC's autonomy and improve economic opportunity across the District.

    His campaign centers on the housing affordability and anti-displacement
    crisis — noting that "revitalization without affordability isn't progress;
    it's displacement dressed up as development" — as well as DC home rule and
    statehood, public safety, and economic development.
  advisories: []
  sources:
    - url: https://www.lee4dc.com/
      title: "Khalil Lee for DC Council — Campaign Website"
      publisher: "lee4dc.com"
      accessed: 2026-06-03
    - url: https://eastoftheriverdcnews.com/2026/05/01/who-is-running-in-the-at-large-special-election/
      title: "Who is Running in the At-Large Special Election? — East of the River DC News"
      publisher: "East of the River DC News"
      accessed: 2026-06-03
  positions:
    - question_id: home_rule_dc_resist
      stance: 1
      quote: "The federal government's unyielding encroachment on D.C.'s autonomy... I feel a fervent responsibility to push back against that."
      explanation: "Explicitly frames federal overreach as a core campaign issue, calling it 'unyielding encroachment' that undermines DC's ability to govern itself. Supports DC statehood. Argues his congressional experience gives him a vantage point to 'navigate the strained relationship between the District and the federal government' — assertive in principle but also emphasizes strategic use of federal connections rather than confrontation alone."
      sources:
        - url: https://www.lee4dc.com/
          title: "Khalil Lee for DC Council — Campaign Website"
          publisher: "lee4dc.com"
          accessed: 2026-06-03
