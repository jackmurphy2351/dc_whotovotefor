- id: elissa-silverman
  name: "Elissa Silverman"
  election_slug: at_large_mcduffie
  in_fair_elections: false  # TODO: verify Fair Elections status
  campaign_url: null  # TODO: add campaign URL
  endorsements:
    - "Greater Greater Washington (pro-transit group)"
    - "Bike Walk Bus PAC"
    - "Sierra Club DC"
  short_bio: >
    Former At-Large Councilmember (8 years); transit and housing advocate.
    Lost her At-Large seat to Kenyan McDuffie in 2022.
  long_bio: |
    Elissa Silverman (age 53) held the At-Large councilmember position for eight
    years before losing it to Kenyan McDuffie in 2022. She briefly worked for
    Maryland Governor Wes Moore's Department of Labor in 2024. Her three primary
    focus areas are: (1) building a coordinated city-wide response to Trump-era
    federal threats; (2) reforming DC Housing Authority and the Housing Production
    Trust Fund; and (3) reducing truancy by making schools safer and more welcoming.
    She is endorsed by Greater Greater Washington, Bike Walk Bus PAC, and Sierra
    Club DC. She is aligned with Janeese Lewis George.
  advisories: []
  sources:
