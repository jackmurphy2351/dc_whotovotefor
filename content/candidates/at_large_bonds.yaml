- id: candace-nelson
  name: "Candace Tiana Nelson"
  election_slug: at_large_bonds
  in_fair_elections: false  # TODO: verify
  campaign_url: null  # TODO: add campaign URL
  endorsements: []
  short_bio: >
    Government oversight specialist (age 50); former chief of staff to Ward 4
    Councilmember Janeese Lewis George. Nearly 20 years across 5 DC agencies;
    led AG Brian Schwalb's transition. Lives in Brightwood.
  long_bio: |
    Candace Tiana Nelson (age 50) has nearly two decades of experience inside DC's
    government, working across five city agencies under multiple mayors. Most recently
    she served as chief of staff to Ward 4 Councilmember Janeese Lewis George, and
    before that led the transition team for DC Attorney General Brian Schwalb after
    his 2022 election. She lives in the Brightwood neighborhood.

    Nelson says the issue that pushed her to run was DC's inadequate response to
    Republican attacks on home rule: she says there wasn't enough communication
    among the city's top leaders or within the council itself. She wants the council
    to create its own dedicated federal affairs office, a stand-alone education
    committee, and a committee focused exclusively on finance and revenue. Above all,
    she runs on oversight and accountability: "I will understand oversight," she says,
    because she has worked inside five agencies and seen how government can fail
    without rigorous scrutiny.
  advisories: []
  sources:
    - url: https://51st.news/at-large-candidates-dc-council-anita-bonds/
      title: "Meet the candidates for an At-Large seat on the DC Council — The 51st"
      publisher: "The 51st"
      accessed: 2026-05-27
  positions:
    - question_id: education_community_schools
      stance: 2
      explanation: "Wants a stand-alone DC Council education committee, which does not currently exist. Believes DC already spends significant money on education and housing but needs better oversight to ensure quality."
