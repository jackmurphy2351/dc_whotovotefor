  positions:
    - question_id: housing_production_trust_fund
      stance: 1
      quote: "Invest in the Housing Production Trust Fund with strong oversight."
      explanation: "Explicitly pledges to 'Invest in the Housing Production Trust Fund with strong oversight.' Also supports streamlined permitting and use of public land to increase supply across all eight wards."
      sources:
        - url: https://lisaraymondfordc.com/
          title: "Lisa Raymond for DC Council — Campaign Website"
          publisher: "lisaraymondfordc.com"
          accessed: 2026-05-30

    - question_id: education_community_schools
      stance: 1
      explanation: "Supports wraparound youth services — mental health care, career pathways, safe afterschool spaces, and employer partnerships — but does not specifically endorse the community schools model by name. Her education platform focuses on teaching quality, CTE, and school infrastructure."
      sources:
        - url: https://lisaraymondfordc.com/
          title: "Lisa Raymond for DC Council — Campaign Website"
          publisher: "lisaraymondfordc.com"
          accessed: 2026-05-30

    - question_id: education_mental_health_schools
      stance: 2
      quote: "expand school-based mental health care, support community providers, and continue the DBH-MPD co-responder model so youth in crisis receive care and support — not criminalization."
      explanation: "Explicitly calls for the District to 'expand school-based mental health care, support community providers, and continue the DBH-MPD co-responder model so youth in crisis receive care and support — not criminalization.'"
      sources:
        - url: https://lisaraymondfordc.com/
          title: "Lisa Raymond for DC Council — Campaign Website"
          publisher: "lisaraymondfordc.com"
          accessed: 2026-05-30

    - question_id: crime_more_police
      stance: 1
      quote: "a well-trained, adequately staffed police force."
      explanation: "Explicitly supports 'a well-trained, adequately staffed police force' alongside transparency and oversight. Also calls for holding federal partners accountable for prosecutions and judicial appointments. In her DC for Democracy questionnaire she wrote that 'MPD must be supported with the resources needed to do its job, alongside strong Council oversight to ensure accountability and community trust,' while expanding civilian and mental-health co-responders (building on the DBH-MPD program) and reentry support for returning citizens."
      sources:
        - url: https://lisaraymondfordc.com/
          title: "Lisa Raymond for DC Council — Campaign Website"
          publisher: "lisaraymondfordc.com"
          accessed: 2026-05-30
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Lisa Raymond"
          publisher: "DC for Democracy"
          accessed: 2026-06-16

    - question_id: youth_curfew_support
      stance: 1
      quote: "supports targeted, temporary public safety measures, including curfews, when necessary to keep residents safe. But enforcement alone cannot be the foundation of youth policy."
      explanation: "Explicitly states she 'supports targeted, temporary public safety measures, including curfews, when necessary to keep residents safe. But enforcement alone cannot be the foundation of youth policy.' One of the few At-Large candidates to explicitly endorse curfews as a tool. In her DC for Democracy questionnaire she was more guarded, writing that while youth curfews 'might be appropriate in certain situations, they are not a long term solution and should be limited to emergency situations.'"
      sources:
        - url: https://lisaraymondfordc.com/
          title: "Lisa Raymond for DC Council — Campaign Website"
          publisher: "lisaraymondfordc.com"
          accessed: 2026-05-30
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Lisa Raymond"
          publisher: "DC for Democracy"
          accessed: 2026-06-16

    - question_id: youth_curfew_programming
      stance: 1
      quote: "The long-term solution is opportunity, connection, and hope."
      explanation: "Pairs her curfew support with a comprehensive youth investment agenda: evidence-based conflict management programs, career pathways, paid apprenticeships (champions DC Young Adult Corps Act), expanded safe afterschool and late-night spaces, and school-based mental health care. 'The long-term solution is opportunity, connection, and hope.' In her DC for Democracy questionnaire she stressed that curfews 'are not a long term solution' and that DC 'must look at more concrete solutions' — supervised late-night gathering spaces, youth employment, apprenticeships — and pledged to give young people 'a seat at the table' in designing them."
      sources:
        - url: https://lisaraymondfordc.com/
          title: "Lisa Raymond for DC Council — Campaign Website"
          publisher: "lisaraymondfordc.com"
          accessed: 2026-05-30
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Lisa Raymond"
          publisher: "DC for Democracy"
          accessed: 2026-06-16

    - question_id: transit_bike_bus_lanes
      stance: 1
      explanation: "Supports 'pedestrian safety and a low-stress network for biking' and 'multi-modal transportation options that reduce costs and serve residents in all eight wards.' Supports 'electrified transit options.' Does not specifically call for protected bike lanes or dedicated bus lanes."
      sources:
        - url: https://lisaraymondfordc.com/
          title: "Lisa Raymond for DC Council — Campaign Website"
          publisher: "lisaraymondfordc.com"
          accessed: 2026-05-30

    - question_id: environment_renewable_energy
      stance: 1
      explanation: "Supports 'robust implementation of the Carbon Free DC plan' and the Healthy Homes Act. Wants gas-free, energy-efficient affordable housing construction and tough Public Service Commission oversight to control utility costs. In her DC for Democracy questionnaire she backed the Healthy Homes Act and pledged to protect the Sustainable Energy Trust Fund from raids (proposing a supermajority requirement before its funds can be diverted), and said she is 'in favor of transitioning off of fossil fuels' — while cautioning that banning fossil-fuel appliances without financial support could 'cripple lower-income families' and disproportionately burden Black and brown communities."
      sources:
        - url: https://lisaraymondfordc.com/
          title: "Lisa Raymond for DC Council — Campaign Website"
          publisher: "lisaraymondfordc.com"
          accessed: 2026-05-30
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Lisa Raymond"
          publisher: "DC for Democracy"
          accessed: 2026-06-16

    - question_id: housing_upzoning
      stance: 1
      explanation: "Supports increasing housing supply across all eight wards through streamlined permitting and strategic use of public land. Endorsed by DC YIMBYs, signaling a pro-supply, pro-density orientation, though her platform emphasizes process reform over an explicit end to single-family zoning. At the April 28, 2026 Fair Elections Program At-Large debate she rejected the framing as 'either/or,' saying DC needs deeply affordable housing and to 'build more housing,' with partners and a streamlined process, to 'create a climate where people will actually come and build.' In her DC for Democracy questionnaire she backed expanding 'middle housing' — duplexes, triplexes, four-plexes, and small apartment buildings — to 'gently increase density and housing options in neighborhoods that may not support large complexes,' plus higher inclusionary-zoning mandates with density bonuses tied to deeper affordability commitments."
      sources:
        - url: https://lisaraymondfordc.com/
          title: "Lisa Raymond for DC Council — Campaign Website"
          publisher: "lisaraymondfordc.com"
          accessed: 2026-05-30
        - url: https://www.youtube.com/watch?v=ll_lVXlwuF8
          title: "DC Fair Elections Program At-Large primary debate (April 28, 2026)"
          publisher: "DC Office of Campaign Finance"
          accessed: 2026-06-03
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Lisa Raymond"
          publisher: "DC for Democracy"
          accessed: 2026-06-16

    - question_id: crime_public_health
      stance: 1
      explanation: "At the April 28, 2026 Fair Elections Program At-Large debate Raymond, drawing on her work at Covenant House Greater Washington, said the answer to youth offending 'starts with the basics': housing, wraparound services, and high-quality workforce development that 'meets youth where they are' and puts them on a path to independence — a prevention- and services-first approach. In her DC for Democracy questionnaire she praised Baltimore's model of 'treating violence as a public health issue' with 'community-centered, evidence-driven approaches,' while stressing it need not be a binary — 'I don't think it has to be one or the other' between investing in police and addressing root causes."
      sources:
        - url: https://www.youtube.com/watch?v=ll_lVXlwuF8
          title: "DC Fair Elections Program At-Large primary debate (April 28, 2026)"
          publisher: "DC Office of Campaign Finance"
          accessed: 2026-06-03
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Lisa Raymond"
          publisher: "DC for Democracy"
          accessed: 2026-06-16

    - question_id: home_rule_dc_resist
      stance: 1
      quote: "We have to continue to legislate based on what our values are, not on an administration that may or may not intervene."
      explanation: "At the April 28, 2026 Fair Elections Program At-Large debate Raymond urged the Council to 'legislate boldly' for residents and 'based on what our values are, not on an administration that may or may not intervene' — i.e., not preemptively complying. She also stressed educating Democratic allies and said she would withhold support from out-of-state candidates who will not commit to DC statehood. Assertive in principle, paired with a relationship/education strategy. In her DC for Democracy questionnaire she pledged to 'fight Congressional interference, including any efforts to override D.C. laws or local decisions,' protect DC's local budget, advance full voting rights and statehood, and organize residents alongside DC Vote and FreeDC to defend home rule."
      sources:
        - url: https://www.youtube.com/watch?v=ll_lVXlwuF8
          title: "DC Fair Elections Program At-Large primary debate (April 28, 2026)"
          publisher: "DC Office of Campaign Finance"
          accessed: 2026-06-03
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Lisa Raymond"
          publisher: "DC for Democracy"
          accessed: 2026-06-16

    - question_id: crime_police_in_schools
      stance: 1
      explanation: "Reverse-coded question: keeping armed police out of schools aligns with the statement. In the April 28, 2026 Fair Elections Program At-Large debate lightning round, Raymond answered 'no' to returning armed police to all DC public high schools, saying she could support unarmed security or support services at the door but not armed officers across the board."
      sources:
        - url: https://www.youtube.com/watch?v=ll_lVXlwuF8
          title: "DC Fair Elections Program At-Large primary debate (April 28, 2026)"
          publisher: "DC Office of Campaign Finance"
          accessed: 2026-06-03

    - question_id: transit_metro_funding
      stance: 0
      explanation: "At the April 28, 2026 Fair Elections Program At-Large debate Raymond said she would support increasing funding 'only if it was to support services to people in a transportation desert... for fast bus service,' tying it to economic access. Conditional; recorded as mixed."
      sources:
        - url: https://www.youtube.com/watch?v=ll_lVXlwuF8
          title: "DC Fair Elections Program At-Large primary debate (April 28, 2026)"
          publisher: "DC Office of Campaign Finance"
          accessed: 2026-06-03

    - question_id: econ_commuter_tax
      stance: 1
      quote: "I like the idea ... people are paying nothing to come to DC ... we absolutely need to consider it."
      explanation: "At the April 28, 2026 Fair Elections Program At-Large debate Raymond said she 'like[s] the idea' of a commuter tax, noting other areas charge to enter (e.g., ~$13 for New York City) while 'people are paying nothing to come to DC,' and 'we absolutely need to consider it.'"
      sources:
        - url: https://www.youtube.com/watch?v=ll_lVXlwuF8
          title: "DC Fair Elections Program At-Large primary debate (April 28, 2026)"
          publisher: "DC Office of Campaign Finance"
          accessed: 2026-06-03

    - question_id: housing_production_vs_affordability
      stance: 0
      quote: "I don't think it has to be an either or."
      explanation: "At the April 28, 2026 Fair Elections Program At-Large debate Raymond rejected the tradeoff — DC needs affordable and deeply affordable housing and to build more, with a streamlined process and partners 'to create a climate where people will actually come and build.' Recorded as mixed."
      sources:
        - url: https://www.youtube.com/watch?v=ll_lVXlwuF8
          title: "DC Fair Elections Program At-Large primary debate (April 28, 2026)"
          publisher: "DC Office of Campaign Finance"
          accessed: 2026-06-03

    - question_id: environment_electricity_affordability
      stance: 2
      quote: "Support tough oversight of the Public Service Commission to ensure that the District's monopoly utilities are not leaving residents and businesses with crushing costs of power and heat."
      explanation: "Raymond's Energy Affordability platform calls for tough oversight of the Public Service Commission so monopoly utilities don't leave residents with 'crushing costs,' plus the Healthy Homes Act and efficiency programs to cut low-income energy bills. Strongly supports action to lower electricity costs. Her DC for Democracy questionnaire reinforces this: she pledged to 'fight to protect the Sustainable Energy Trust Fund' that funds the Healthy Homes Act's low-income electrification assistance, proposing statutory safeguards against diverting it."
      sources:
        - url: https://lisaraymondfordc.com/
          title: "Energy Affordability — Lisa Raymond for DC Council"
          publisher: "Lisa Raymond Campaign"
          accessed: 2026-06-04
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Lisa Raymond"
          publisher: "DC for Democracy"
          accessed: 2026-06-16

    - question_id: mpd_ice_cooperation
      stance: 2
      quote: "ICE is not a legitimate law enforcement agency and as Councilmember, I would work to end all cooperation between MPD and ICE."
      explanation: "In her DC for Democracy questionnaire Raymond wrote that 'ICE is not a legitimate law enforcement agency' and pledged to 'work to end all cooperation between MPD and ICE.' She would use the Council's oversight authority to require full disclosure of any MOUs or informal practices and hold public hearings, and would pursue new legislation barring ICE from operating near schools, hospitals, and courthouses and prohibiting use of DC-owned property for enforcement — citing LA and Chicago as models. Notes the first video she released as a candidate called on the Mayor to disclose any District–ICE agreements."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Lisa Raymond"
          publisher: "DC for Democracy"
          accessed: 2026-06-16

    - question_id: homelessness_housing_first
      stance: 2
      quote: "I also strongly support a Housing First approach as the foundation of D.C.'s homelessness response."
      explanation: "In her DC for Democracy questionnaire Raymond 'strongly support[s] a Housing First approach as the foundation of D.C.'s homelessness response,' citing its proven record reducing chronic homelessness. She would restore permanent supportive housing vouchers (none were funded in FY2026), partner with nonprofits and advocacy groups, and bolster outreach to people with mental-health and substance-use needs — insisting 'we cannot criminalize homelessness.' Draws on her work as head of major gifts at a nonprofit serving homeless youth."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Lisa Raymond"
          publisher: "DC for Democracy"
          accessed: 2026-06-16

    - question_id: housing_topa_restore
      stance: 0
      quote: "A balanced approach should include carefully targeted exemptions to reduce barriers for developers where data show TOPA adds significant cost or delay, paired with stronger support for tenant education, financing assistance, and preservation tools."
      explanation: "Asked in her DC for Democracy questionnaire whether she supports the 2025 rollback of TOPA (which ended TOPA for 2–4 unit buildings), Raymond did not commit to restoring those rights. She 'unequivocally support[s] tenants' rights' and calls TOPA an important anti-displacement tool, but endorses a 'balanced approach' with 'carefully targeted exemptions to reduce barriers for developers where data show TOPA adds significant cost or delay,' paired with tenant education and financing help. Mixed: supportive of TOPA in principle but open to narrow exemptions rather than restoring or strengthening it."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Lisa Raymond"
          publisher: "DC for Democracy"
          accessed: 2026-06-16

    - question_id: housing_rent_stabilization
      stance: 1
      quote: "transforming temporary caps on rent increases into permanent protections."
      explanation: "In her DC for Democracy questionnaire Raymond said she 'will closely examine the efficacy of rent stabilization and consider how our laws could be expanded to further protect our Black and brown communities, including transforming temporary caps on rent increases into permanent protections.' Supports expanding tenant protections, framed as study-and-expand rather than a specific coverage threshold."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Lisa Raymond"
          publisher: "DC for Democracy"
          accessed: 2026-06-16

    - question_id: childcare_birth_to_three
      stance: 1
      quote: "I would commit to fully funding the Pay Equity Fund, and the Birth-to-Three Act."
      explanation: "Childcare is Raymond's stated top priority. In her DC for Democracy questionnaire she committed to 'fully funding the Pay Equity Fund, and the Birth-to-Three Act,' issuing grants to open and expand centers, and reducing voucher red tape, framing the crisis as a supply and workforce problem and pledging OSSE oversight to ensure investments translate into more seats. A strong commitment to the Birth-to-Three framework, though she does not specifically pledge a free, no-waitlist guarantee."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Lisa Raymond"
          publisher: "DC for Democracy"
          accessed: 2026-06-16

    - question_id: childcare_universal
      stance: 1
      quote: "I want to help make childcare affordable and accessible for every District family."
      explanation: "Raymond names making 'childcare affordable and accessible for every District family' her first priority. In her DC for Democracy questionnaire she would fully fund the Child Care Pay Equity Fund and Birth-to-Three Act, issue grants to open and expand centers, and reduce subsidy red tape — a supply-and-workforce approach to broad affordability, though she does not explicitly call for income-blind universal subsidies."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Lisa Raymond"
          publisher: "DC for Democracy"
          accessed: 2026-06-16

    - question_id: fiscal_progressive_taxation
      stance: 0
      quote: "I support an equitable tax system that ensures everyone is paying their fair share ... while remaining mindful of economic competitiveness and growth."
      explanation: "Asked in her DC for Democracy questionnaire whether she supports raising taxes on high-income households and profitable corporations, Raymond gave a measured answer: she backs 'an equitable tax system' where 'everyone is paying their fair share' but stressed remaining 'mindful of economic competitiveness and growth' and keeping DC 'competitive with our neighboring jurisdictions.' Her concrete proposals are expanding credits — the restored Child Tax Credit and a broader DC EITC — rather than new taxes on wealth or corporations. Mixed."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Lisa Raymond"
          publisher: "DC for Democracy"
          accessed: 2026-06-16

    - question_id: labor_worker_protections
      stance: 0
      quote: "I did not agree with the Mayor repealing the measure entirely, and I feel that the compromise that the Council arrived at was reasonable."
      explanation: "In her DC for Democracy questionnaire Raymond said she favors 'all workers being paid a livable wage' and aggressive enforcement against wage theft (drawing on her time at the Office of the Attorney General). But on the tipped minimum wage she accepted the Council's 2025 compromise capping it at 75% of the full minimum — 'I did not agree with the Mayor repealing the measure entirely, and I feel that the compromise ... was reasonable,' while saying the Council must keep monitoring it. Supportive of worker protections in principle but accepting of a rollback of the voter-approved I-82 full tipped wage; mixed."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Lisa Raymond"
          publisher: "DC for Democracy"
          accessed: 2026-06-16

    - question_id: education_mayoral_control
      stance: 1
      quote: "I continue to believe OSSE falling completely under the jurisdiction of the mayor presents various accountability and transparency challenges."
      explanation: "A former DC State Board of Education member and President who served when mayoral control passed, Raymond told her DC for Democracy questionnaire she 'continue[s] to believe OSSE falling completely under the jurisdiction of the mayor presents various accountability and transparency challenges' and would 'consider exploring whether ... OSSE becoming an independent agency would increase accountability.' She wants governance more responsive to teachers, families, and students, but commits to structural changes 'only if it's clear that they would improve educational experiences and outcomes.' Leans support, cautiously."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Lisa Raymond"
