      explanation: "In his DC for Democracy questionnaire Davis says 'MPD's role is to enforce DC law and keep residents safe — not to engage in civil immigration enforcement,' and supports 'stronger oversight, clearer policies, and transparency' so any cooperation is 'limited, lawful, and focused strictly on serious public safety concerns,' not civil immigration status. Supports limiting MPD/ICE cooperation, with narrow exceptions for serious criminal matters."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Dwight Davis"
          publisher: "DC for Democracy"
          accessed: 2026-06-15

    - question_id: environment_renewable_energy
      stance: 1
      explanation: "In his DC for Democracy questionnaire Davis supports the Healthy Homes Act and moving away from fossil-fuel furnaces and water heaters, and would protect the Sustainable Energy Trust Fund from raids — but heavily conditions the transition on affordability, favoring a 'phased, data-driven implementation' with rebates and financing and supporting a fossil-fuel-installation ban 'only alongside strong affordability protections.' Supports the clean-energy transition, qualified by equity/cost concerns."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Dwight Davis"
          publisher: "DC for Democracy"
          accessed: 2026-06-15

    - question_id: fiscal_progressive_taxation
      stance: 1
      explanation: "In his DC for Democracy questionnaire Davis is 'open to targeted tax increases on highly profitable corporations and extreme concentrations of wealth, but only when paired with clear guardrails, transparency, and measurable outcomes,' and argues the District 'must demonstrate strong fiscal stewardship' — auditing programs and closing inefficiencies — before raising taxes. Qualified support for progressive revenue."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Dwight Davis"
          publisher: "DC for Democracy"
          accessed: 2026-06-15

    - question_id: labor_worker_protections
      stance: 1
      explanation: "In his DC for Democracy questionnaire Davis says 'I do not support the Council's rollback of that voter-approved wage increase' (Initiative 82), arguing tipped workers deserve wage structures reflecting the cost of living, and would pair wage increases with small-business support like technical assistance and targeted tax incentives. Supports worker protections, balanced with small-business support."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Dwight Davis"
          publisher: "DC for Democracy"
          accessed: 2026-06-15

    - question_id: childcare_universal
      stance: 1
      explanation: "In his DC for Democracy questionnaire Davis 'strongly support[s] the Childcare Pay Equity Fund' and would 'expand access to subsidized child care by increasing eligibility, simplifying enrollment,' treating child care as 'essential infrastructure.' Supports expanding subsidized childcare and educator pay, not framed as a universal-regardless-of-income program."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Dwight Davis"
          publisher: "DC for Democracy"
          accessed: 2026-06-15

    - question_id: education_mayoral_control
      stance: -1
      explanation: "In his DC for Democracy questionnaire Davis — a former classroom teacher and principal — says 'I do not agree with the premise that Mayoral Control, in and of itself, has eroded democratic voice,' crediting the unified structure with providing stability; he would strengthen democratic participation 'within our current governance framework' rather than ending mayoral control. Leans against the question's call to end mayoral control."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Dwight Davis"
          publisher: "DC for Democracy"
          accessed: 2026-06-15

- id: dyana-forester
  name: "Dyana Forester"
  election_slug: at_large_bonds
  in_fair_elections: true
  campaign_url: https://www.dyanafordc.com/
  endorsements: []
  short_bio: >
    Labor leader and former DC Housing Authority commissioner (age 46). Former
    president of AFL-CIO Metropolitan Washington Council; senior director of labor
    relations under MD Gov. Wes Moore. Grew up working-class in Southeast DC.
  long_bio: |
    Dyana Forester (age 46) grew up in a working-class family in Southeast DC and
    became a mom at 18. She built a career in labor organizing, starting at Teaching
    for Change (community schools and parent engagement), then DC Jobs with Justice
    (fighting for Walmart worker wages), and then as political and community affairs
    director for UFCW Local 400 — where she helped pass DC's minimum wage increase
    and paid family leave law. She was elected president of the AFL-CIO's Metropolitan
    Washington Council before becoming senior director of labor relations to Maryland
    Governor Wes Moore.

    A former DC Housing Authority commissioner, housing is a major priority for
    Forester, particularly workforce housing for teachers, bus drivers, firefighters,
    and police. She questions whether building faster is the right first answer: "Is
    this the right solution for the problem we want to fix? And the fix is, how do we
    create more affordable housing for families?" She frames her candidacy as bringing
    lived working-class experience to a council that often debates policy without it.
  advisories: []
  sources:
    - url: https://51st.news/at-large-candidates-dc-council-anita-bonds/
      title: "Meet the candidates for an At-Large seat on the DC Council — The 51st"
      publisher: "The 51st"
      accessed: 2026-05-27
  positions:
