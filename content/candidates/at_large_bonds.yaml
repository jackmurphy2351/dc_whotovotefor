# At-Large Council (Regular) — 2026 DC Democratic Primary
# Nine Democratic candidates compete; top two vote-getters advance to November general.
# Sources: https://ballotpedia.org/City_elections_in_Washington,_D.C._(2026)
#          https://51st.news/at-large-candidates-dc-council-anita-bonds/

- id: kevin-chavous
  name: "Kevin B. Chavous"
  election_slug: at_large_bonds
  in_fair_elections: false  # TODO: verify
  campaign_url: null  # TODO: add campaign URL
  endorsements:
    - "Anita Bonds (retiring At-Large Councilmember)"
  short_bio: >
    Attorney and DC Council staffer (age 41); son of former Ward 7 Councilmember
    Kevin P. Chavous. Howard BA + JD. Director of council's labor committee
    under Anita Bonds. Deep TOPA background from tenant organizing work.
  long_bio: |
    Kevin B. Chavous (age 41) grew up in a household steeped in DC politics: his
    father, Kevin P. Chavous, represented Ward 7 on DC Council from the early 1990s
    through 2005. A formative experience visiting a fire-damaged public housing complex
    with his father instilled a lifelong interest in fair housing. As an undergraduate
    at Howard University, he worked at Housing Counseling Services helping tenants
    organize under TOPA. During Howard Law School, he spent summers at AARP's Legal
    Housing for the Elderly. After law school he ran his own practice until 2022,
    when he became director of the DC Council's Committee on Executive Administration
    and Labor, chaired by Councilmember Anita Bonds. Bonds has endorsed him for her
    seat. He lives in Ward 7 but sends his kids to school in Ward 3 because of
    resource inequities — a gap he says he wants to close. Key platform priorities:
    out-of-school time programming, school counselors and nurses in every school,
    and raising inclusionary zoning requirements from 8–10% to 15% of residential
    floor area.
  advisories: []
  sources:
    - url: https://51st.news/at-large-candidates-dc-council-anita-bonds/
      title: "Meet the candidates for an At-Large seat on the DC Council — The 51st"
      publisher: "The 51st"
      accessed: 2026-05-27
  positions:
    - question_id: housing_topa_restore
      stance: 2
      explanation: "Built his early career organizing tenant associations under TOPA at Howard University. Supports maintaining and restoring tenant purchase rights."
      sources:
        - url: https://51st.news/at-large-candidates-dc-council-anita-bonds/
          title: "Meet the candidates for an At-Large seat on the DC Council — The 51st"
          publisher: "The 51st"
          accessed: 2026-05-27

    - question_id: education_mental_health_schools
      stance: 2
      explanation: "Wants every school to have a counselor and a nurse regardless of enrollment or funding level, especially in schools in 'areas hardest hit by trauma.'"
      sources:
        - url: https://51st.news/at-large-candidates-dc-council-anita-bonds/
          title: "Meet the candidates for an At-Large seat on the DC Council — The 51st"
          publisher: "The 51st"
          accessed: 2026-05-27

- id: dwight-davis
  name: "Dwight Davis"
  election_slug: at_large_bonds
  in_fair_elections: false  # TODO: verify
  campaign_url: null  # TODO: add campaign URL
  endorsements: []
  short_bio: >
    Lifelong Washingtonian and DCPS educator (age 51). 20 years as a 5th-grade
    teacher at DCPS; former school principal. BA from Albright College; graduate
    degrees in divinity and education from Princeton. Father of four.
  long_bio: |
    Dwight Davis (age 51) was born and raised in DC by his grandparents, whom
    he describes as "old-school Washingtonians." He attended DC public schools
    from Whittier Elementary through Calvin Coolidge High School, then played
    basketball at Albright College in Pennsylvania — a passion that took him to
    Colombia for semi-professional play and later to England. He earned graduate
    degrees in divinity and education from Princeton Theological Seminary (2004)
    before returning to DC as a DCPS fifth-grade teacher for twenty years.

    "Education is my jam," says Davis. "It cuts through all of the other issues.
    If we have an educated populace, our crime rates drop." As a father of four,
    affordability is also a top priority — particularly workforce housing for
    teachers, firefighters, nurses, and police. He believes his background running
    a classroom of 30 constituents with different needs gives him exactly the
    leadership skills the council needs.
  advisories: []
  sources:
    - url: https://ballotpedia.org/Dwight_Davis_(Washington,_D.C.)
      title: "Dwight Davis — Ballotpedia"
      publisher: ballotpedia.org
      accessed: 2026-05-27
    - url: https://51st.news/at-large-candidates-dc-council-anita-bonds/
      title: "Meet the candidates for an At-Large seat on the DC Council — The 51st"
      publisher: "The 51st"
      accessed: 2026-05-27
  positions:
    - question_id: education_community_schools
      stance: 2
      explanation: "Education is his central platform issue. Wants every DC school — regardless of enrollment or funding — to have adequate resources, counselors, and nurses."
      sources:
