- id: kevin-chavous
  name: "Kevin B. Chavous"
  election_slug: at_large_bonds
  in_fair_elections: false  # TODO: verify
  campaign_url: https://www.chavousfordc.com/
  endorsements:
    # Named endorsers
    - "Eric Holder (Former US Attorney General)"
    - "Anita Bonds (retiring DC At-Large Councilmember)"
    - "Charlene Drew Jarvis (Former Ward 4 Councilmember)"
    # Organizations
    - "AFSCME District Council 20"
    - "ElectED DC (Empowering DC Wards 7 & 8)"
    - "Greater Capital Area Association of REALTORS"
    - "Moms Demand Gun Sense (2026 candidate distinction)"
  short_bio: >
    Attorney (Howard BA + JD); Ward 7 resident and father; son of former Ward 7
    Councilmember Kevin P. Chavous. Four years as Committee Director under Anita
    Bonds (Executive Administration and Labor committee). Tenant organizer under
    TOPA (undergrad); AARP housing law intern (law school); studied at South
    Africa's largest law firm. DNC National Committeeman; former DC Young Democrats
    president. Endorsed by former AG Eric Holder and Anita Bonds.
  long_bio: |
    Kevin B. Chavous (age 41) grew up in a household steeped in DC politics: his
    father, Kevin P. Chavous, represented Ward 7 on DC Council from the early 1990s
    through 2005. A formative experience visiting a fire-damaged public housing complex
    with his father instilled a lifelong interest in fair housing. He is a proud
    graduate of Howard University (BA in political science with honors, then JD);
    as an undergraduate he worked at Housing Counseling Services helping low-income
    tenants understand their rights and organize under TOPA. During law school he
    worked at AARP assisting seniors facing foreclosure tied to property tax issues
    and reverse mortgages, and studied abroad in South Africa — interning at the
    country's largest law firm, which broadened his perspective on justice and
    governance. After bar admission in 2012, he ran a practice focused on housing,
    landlord-tenant matters, real estate, and personal injury.

    Most recently he spent four years as Committee and Policy Director for
    At-Large Councilmember Anita Bonds's Committee on Executive Administration
    and Labor, leading legislative strategy and agency oversight across all eight
    wards. In civic life he has served as DC's National Committeeman to the DNC,
    president of the DC Young Democrats, and board member of the United Planning
    Organization. He is a member of St. Timothy's Episcopal Church and is married
    to Ashley; they are raising their children Kendall and Cameron in Ward 7,
    though he sends his kids to school in Ward 3 because of resource inequities —
    a gap he says he wants to close. His platform centers on safer streets,
    affordable housing (raising inclusionary zoning to 15% of residential floor
    area), early education, workforce development, senior supports, and protecting
    DC Home Rule and immigrant civil rights.
  advisories: []
