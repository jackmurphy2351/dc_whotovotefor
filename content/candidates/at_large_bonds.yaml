  short_bio: >
    Current DC Shadow Representative (2021–present, age 36); PharmD from
    Northeastern. Born in Boston to Nigerian immigrants; grew up to volunteer in DC
    classrooms before winning a Ward 8 ANC seat by one vote in 2018. Led protests
    against an ICE headquarters on the St. Elizabeth's campus. Signature issues:
    UDC tuition-free, sanctuary city enforcement, and a broadly progressive platform
    spanning housing, healthcare, climate, and workers' rights.
  long_bio: |
    Oye Owolewa (age 36) was born in Boston to Nigerian immigrant parents from
    Kwara and Osun states. He was bullied as a child, started fights, and was
    suspended from school before his parents pushed him toward education. He earned
    a doctorate in pharmacy from Northeastern University in 2014 as the only Black
    man in his doctoral program. After moving to DC he volunteered in classrooms,
    teaching science experiments; he worked as a pharmacy manager at Safeway and
    pharmacist at Rite Aid before winning his first ANC race in Ward 8 in 2018 —
    by a single vote. Since January 2021 he has served as DC's U.S. Shadow
    Representative, one of the city's unpaid statehood advocates with standing in
    the House. In that role he has worked to intercept drugs off the streets, helped
    returning citizens obtain union jobs, and secured Covid vaccine access for
    thousands of Washingtonians — vaccinating some patients himself.

    He led protests against construction of a new ICE headquarters on the St.
    Elizabeth's campus in Ward 8. He describes DC's lack of statehood as making
    residents "uniquely exposed" to federal abuses and says the fight for home rule
    is about "survival, dignity, and real democracy." His signature legislative
    proposal is making UDC tuition-free for all DC residents.

    His platform is among the most detailed in the race, covering housing
    (restoring TOPA, expanding rent stabilization, social housing), healthcare
    (restoring Medicaid/DC Healthcare Alliance, Medicare for All vision, harm
    reduction for overdoses), community safety (community-first approach, removing
    police from schools), climate (full clean energy, Healthy Homes Act, bottle
    bill), workers' rights (Workers' Bill of Rights, DC Department of Labor), and
    senior services. He is endorsed by the Washington Teachers' Union, Sierra Club,
    Working Families Party, several SEIU and AFGE locals, Amalgamated Transit Union,
    and dozens of other labor and civic organizations.
  advisories: []
