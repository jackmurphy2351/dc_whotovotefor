    - "DC Yimbys (pro-housing group)"
    - "DC Association of Realtors"
  short_bio: >
    Education policy veteran and former DC AG chief of staff (age 56). Served on DC
    State Board of Education (2006); chief of staff to AG Karl Racine (2018–2020).
    Lives on Capitol Hill. Originally from Connecticut.
  long_bio: |
    Lisa Raymond (age 56) came to DC from Connecticut in the late 1990s and was drawn
    into education policy by helping paint the walls of what would become Cesar Chavez
    Public Charter School in Southwest. She joined the school as chief of operations
    and later chief operating officer, where she saw firsthand how many high schoolers
    arrived years behind grade level. In 2006 she won a seat on the DC State Board of
    Education (representing Wards 5 and 6), only to see its powers transferred to the
    mayor shortly after.

    She then served as a senior advisor on education for DC Council's Committee of the
    Whole (from 2011), and as chief of staff to DC Attorney General Karl Racine from
    2018 to 2020. A Capitol Hill resident and mother of two, her top priorities are
    childcare, housing, and education. On housing: "We have to take a good look at
    what we are doing as a city, what we're doing that gets in the way — but it's not
    an invitation to developers to come in here and do whatever they want." She is
    endorsed by Greater Greater Washington, DC Yimbys, and the DC Association of
    Realtors.
  advisories: []
  sources:
