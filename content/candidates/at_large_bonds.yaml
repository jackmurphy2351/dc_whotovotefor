    Current DC Shadow Representative (2021–present, age 36); PharmD from
    Northeastern. Led protests against ICE HQ construction at St. Elizabeth's.
    Wants UDC tuition-free. Endorsed by WFP and WABA.
  long_bio: |
    Oye Owolewa (age 36) was born in Boston and earned a doctorate in pharmacy from
    Northeastern University in 2014. He worked as a pharmacy manager at Safeway and
    pharmacist at Rite Aid before winning his first ANC race in 2018 — by a single
    vote. Since January 2021 he has served as DC's U.S. Shadow Representative, one
    of the city's unpaid statehood advocates with standing in the House.

    He recently led protests against the construction of an ICE headquarters on the
    St. Elizabeth's campus in Ward 8, alongside the DHS headquarters. He is outspoken
    about what he sees as insufficient pushback from DC's leadership against Republican
    interference: "Last year was very difficult for D.C. People were wondering why our
    council wasn't being more forceful." His signature proposal is making the University
    of the District of Columbia tuition-free — both to help struggling residents and to
    serve as a retraining hub for laid-off federal workers.
