  name: "Candace Tiana Nelson"
  election_slug: at_large_bonds
  in_fair_elections: true
  campaign_url: "https://www.candacefordc.com/"
  endorsements:
    - "Jews United for Justice"
    - "Bike, Walk & Bus PAC"
    - "AFGE Local 2725 – AFL-CIO"
  short_bio: >
    Two-decade DC government veteran (age 50) and current President of the DC
    Black Democratic Caucus; former chief of staff to Ward 4 Councilmember Janeese
    Lewis George and AG transition director. Union family background ("Legacy of
    Labor"). Lives in Brightwood. Platform: education, housing, home rule, workers'
    rights, and transit.
  long_bio: |
    Candace Tiana Nelson (age 50) was born and raised in Winchester, Virginia, often
    the only Black student in her class or grade. She credits her parents — her father
    on 12-hour shifts at Rubbermaid, her mother working 12-hour hospital shifts while
    earning a Master's in Nursing and testifying before Congress with her union — for
    her sense of dignity, perseverance, and commitment to organized labor. She calls
    herself "a Legacy of Labor" and is a former member of AFGE Local 1000. She lives
    in the Brightwood neighborhood.

    Her two decades across DC government span the executive, legislative, and judicial
    branches. Roles include: Special Projects Officer at the Department of Healthcare
    Finance, managing a $110 million contract that created District Direct, which
    transformed resident access to Medicaid, SNAP, and TANF during COVID-19; policy
    analyst authoring a key recommendation that led to the creation of DC's Office of
    African American Affairs; and work at the Office of Women's Policy and Initiatives,
    where she established DC's partnership with Work Smart, a wage-negotiation program
    for women, especially returning citizens. She served on two Mayoral Transition
    Teams, and as an ANC Commissioner in Ward 4, before becoming transition director
    and then chief of staff for Attorney General Brian Schwalb following his 2022
    election. Most recently she was chief of staff to Ward 4 Councilmember Janeese
    Lewis George. She currently serves as President of the DC Black Democratic Caucus.

    Nelson's platform priorities are home rule (she opposes any preemptive compliance
    with Trump administration overreach), education (she wants a reinstated standalone
    DC Council Education Committee), housing affordability (expanding rent stabilization,
    strengthening TOPA, fully funding the Housing Production Trust Fund), workers'
    rights (creating a DC Department of Labor and Workers' Rights, a Workers' Bill of
    Rights), and transit equity (BRT for Wards 7 and 8, protected bike lanes). She is
    endorsed by Jews United for Justice, Bike Walk & Bus PAC, and AFGE Local 2725.
