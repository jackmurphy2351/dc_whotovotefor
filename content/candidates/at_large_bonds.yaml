- id: greg-jackson-jr
  name: "Greg Jackson Jr."
  election_slug: at_large_bonds
  in_fair_elections: true
  campaign_url: "https://www.jacksonfordc.com/"
  endorsements:
    - "Rep. Maxwell Alejandro Frost (D-FL)"
    - "Fmr. Gov. Kathleen Sebelius (D-KS)"
    - "Opportunity DC"
    - "The Collective PAC"
  short_bio: >
    Former Biden White House deputy director of gun violence prevention (age 41);
    UVA grad (first Black freshman class president). Survived a 2013 Shaw shooting.
    Former Bowser Cabinet director. Pursuing Executive MPH at Yale. Lives in
    Congress Heights.
  long_bio: |
    Greg Jackson Jr. (age 41) was shot in a Shaw neighborhood shooting in 2013 and
    nearly died. "My tragedy shined a light on interpersonal violence in inner
    cities," he says. That experience redirected a career that had begun in
    campaign organizing — he co-founded DC for Obama in 2007, led over 380 DNC
    field staff in North Carolina for Obama's 2012 re-election, and served as
    national field director at the DCCC, leading what he calls the largest midterm
    voter registration effort in U.S. history.

    After the shooting, he entered DC government as the first director of Mayor
    Muriel Bowser's Cabinet Office of Community Relations and Services, where he
    oversaw resolution of more than 2,000 resident concerns. He later joined the
    Department of Parks and Recreation as communications and community relations
    director, coining DPR's "Where Fun Happens" motto and launching the FitDC
    campaign. In 2019, after losing a family friend to gun violence, he became
    national advocacy director and then executive director of Community Justice
    Action Fund, the nation's only Black survivor-led gun violence prevention
    organization.

    At Community Justice, he helped secure $42 billion in federal gun violence
    prevention funding and co-led passage of the Bipartisan Safer Communities Act
    — the first federal gun violence law in 30 years. He was then appointed Special
    Assistant to President Biden and Deputy Director of the White House Office of
    Gun Violence Prevention, where he developed 54 executive actions and oversaw
    implementation of the new law. He credits these efforts with a 49% reduction
    in homicides nationwide over three years. During this time his Congress Heights
    home was struck 13 times in a nearby shooting.

    He is a proud UVA graduate (Class of 2007), where he was the first Black
    freshman class president, a member of Alpha Phi Alpha, and student council vice
    president. He currently serves as president of the Rocket Foundation alongside
    rapper Quavo and is pursuing an Executive Master of Public Health at Yale.

    His platform priorities are gun violence prevention, youth safety, job creation,
    housing affordability, and education. He is endorsed by Rep. Maxwell Frost,
    former Gov. Kathleen Sebelius, Opportunity DC, and The Collective PAC.
