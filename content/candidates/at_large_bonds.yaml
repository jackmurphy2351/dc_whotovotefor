- id: leniquadominique-jenkins
  name: "Leniqua'dominique Jenkins"
  election_slug: at_large_bonds
  in_fair_elections: false
  campaign_url: "https://www.votejenkinsfordc.com/"
  endorsements: []
  short_bio: >
    East-of-the-River advocate, former Deanwood ANC commissioner, and Amazon
    best-selling children's book author (age 40); has worked in the Wilson
    Building for two councilmembers, drafting legislation and advising on policy.
    Ran businesses from DC to East Africa. Currently grad student government
    president. Platform: literacy, environmental justice, safe communities,
    housing, and caregiver support.
  long_bio: |
    Leniqua'dominique Jenkins (age 40) arrived in Washington in 2010 as an unpaid
    intern for Rep. Alan Grayson, working a second retail job in the evenings to
    make rent. She earned a certificate in entrepreneurship at Operation Hope and
    used it to launch Capitol Living, a home care agency she ran for ten years —
    training her father and brother (who were re-entering society after incarceration)
    as care assistants. She subsequently built businesses that extended as far as
    East Africa, and has lived and worked in Africa, India, and Spain, a global
    background she says gives her a model for creative, people-centered policy.

    She served one term as an ANC commissioner in Deanwood, focused on environmental
    justice — leading educational walking tours, conducting clean-air studies, and
    organizing Anacostia River cleanups. In 2021 she ran for the At-Large seat against
    Bonds; she subsequently worked inside the Wilson Building for both a former and a
    current councilmember, helping draft legislation and advise on policy. She is an
    Amazon top-selling children's book author, a public policy columnist, and has
    written legislative material on Capitol Hill. She currently serves as president of
    her university's Graduate Student Government. On a personal level, she provides
    daily care for her mother and helps raise her young niece, which she says grounds
    her caregiver platform in lived experience.

    She lives east of the Anacostia River (Ward 7) and says those communities have been
    "left out of citywide decision-making for too long." Her platform priorities are
    literacy (noting that approximately 119,000 DC adults and nearly half of Wards 7
    and 8 adults face low-literacy challenges), environmental justice centered on a
    Bottle Bill, community safety through prevention rather than punishment, housing
    affordability and homeownership pathways, and a caregiver support agenda.
  advisories: []
  sources:
    - url: https://www.votejenkinsfordc.com/
      title: "Leniqua'dominique Jenkins for DC Council — Campaign Website"
      publisher: "votejenkinsfordc.com"
      accessed: 2026-05-29
