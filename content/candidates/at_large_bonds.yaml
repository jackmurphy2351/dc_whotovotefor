      explanation: "Supports increasing housing supply across all eight wards through streamlined permitting and strategic use of public land. Endorsed by DC YIMBYs, signaling a pro-supply, pro-density orientation, though her platform emphasizes process reform over an explicit end to single-family zoning. At the April 28, 2026 Fair Elections Program At-Large debate she rejected the framing as 'either/or,' saying DC needs deeply affordable housing and to 'build more housing,' with partners and a streamlined process, to 'create a climate where people will actually come and build.'"
