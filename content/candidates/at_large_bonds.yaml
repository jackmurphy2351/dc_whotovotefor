      explanation: "Former DC Housing Authority commissioner; wants to increase investment in affordable housing and workforce housing. Skeptical of fast-build-first approaches; focuses on what families can actually afford. At the April 28, 2026 Fair Elections Program At-Large debate she said she will 'always prioritize affordability,' recounting that on the DCHA board she and another commissioner voted against a project when developers asked the board to lower its deep-affordability requirement, because that public land 'belongs to the public housing residents of the District of Columbia.'"
