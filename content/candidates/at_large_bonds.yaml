- id: dyana-forester
  name: "Dyana Forester"
  election_slug: at_large_bonds
  in_fair_elections: true
  campaign_url: https://www.dyanafordc.com/
  endorsements: []
  short_bio: >
    Labor leader and former DC Housing Authority commissioner (age 46). Former
    president of AFL-CIO Metropolitan Washington Council; senior director of labor
    relations under MD Gov. Wes Moore. Grew up working-class in Southeast DC.
  long_bio: |
    Dyana Forester (age 46) grew up in a working-class family in Southeast DC and
    became a mom at 18. She built a career in labor organizing, starting at Teaching
    for Change (community schools and parent engagement), then DC Jobs with Justice
    (fighting for Walmart worker wages), and then as political and community affairs
    director for UFCW Local 400 — where she helped pass DC's minimum wage increase
    and paid family leave law. She was elected president of the AFL-CIO's Metropolitan
    Washington Council before becoming senior director of labor relations to Maryland
    Governor Wes Moore.

    A former DC Housing Authority commissioner, housing is a major priority for
    Forester, particularly workforce housing for teachers, bus drivers, firefighters,
    and police. She questions whether building faster is the right first answer: "Is
    this the right solution for the problem we want to fix? And the fix is, how do we
    create more affordable housing for families?" She frames her candidacy as bringing
    lived working-class experience to a council that often debates policy without it.
  advisories: []
  sources:
