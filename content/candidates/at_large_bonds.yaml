      title: "Meet the candidates for an At-Large seat on the DC Council — The 51st"
      publisher: "The 51st"
      accessed: 2026-05-27
  positions:
    - question_id: housing_production_trust_fund
      stance: 2
      explanation: "Former DC Housing Authority commissioner; wants to increase investment in affordable housing and workforce housing. Skeptical of fast-build-first approaches; focuses on what families can actually afford."
