  short_bio: >
    Education policy veteran (age 56); began career supporting formerly incarcerated
    women at a Dupont Circle halfway house. Helped co-found Cesar Chavez Charter;
    DC State Board of Education President (Wards 5 & 6, 2006); ran DC Council
    education policy under Council Chair Kwame Brown; chief of staff to AG Karl
    Racine (2018–2020). Planned Parenthood Metro Washington board trustee. Lives
    near Lincoln Park.
  long_bio: |
    Lisa Raymond (age 56) began her DC career at a halfway house off Dupont Circle
    supporting formerly incarcerated women seeking dignity and a path forward. That
    experience, she says, grounded her belief that "public service is human, urgent,
    and personal." She then helped start Cesar Chavez Public Charter School, serving
    as chief of operations and later chief operating officer and witnessing firsthand
    how many high schoolers arrived years behind grade level.

    In 2006 she won a seat on the DC State Board of Education (representing Wards 5
    and 6), where she served as Board President and helped expand quality PreK and
    strengthen graduation standards — only to see the board's powers transferred to
    the mayor shortly after. She went on to run education policy for the DC Council
    under then-Chair Kwame Brown, managing DCPS budgets and helping shape key
    reforms: she drafted legislation ensuring every student could take the SAT and
    apply to college or technical programs, expanded career and technical education
    funding, and strengthened enforcement against residency fraud.

    From 2018 to 2020 she served as Chief of Staff to Attorney General Karl Racine —
    the District's first elected AG — supporting an independent agency fighting wage
    theft and keeping young people out of the criminal justice system. She has also
    served as a trustee of Planned Parenthood of Metro Washington and as volunteer
    chair of the board of a DC charter school.

    She lives near Lincoln Park with her husband Josh and rescue dog Jojo; she has
    two children in college and is an active member of the Hill Havurah community.
    She currently works as a major gifts officer for a Ward 7 and 8 nonprofit serving
    homeless youth.

    Her platform priorities are education (Pre-K expansion, educator pay, CTE and
    apprenticeships, school modernization), housing supply (streamlined permitting,
    Housing Production Trust Fund, tenant protection), and home rule. She explicitly
    supports targeted, temporary curfews as one public safety tool alongside youth
    programming. She is endorsed by Councilmember Charles Allen, former Councilmember
    Mary Cheh, IAFF Local 36, DC YIMBYs, Greater Greater Washington, and Opportunity DC.
  advisories: []
  sources:
