- id: leniquadominique-jenkins
  name: "Leniqua'dominique Jenkins"
  election_slug: at_large_bonds
  in_fair_elections: false  # TODO: verify
  campaign_url: null  # TODO: add campaign URL
  endorsements: []
  short_bio: >
    Deanwood ANC alum and small business owner (age 40); arrived in DC as an
    unpaid Hill intern. Ran Capitol Living (home care agency) 10 years. Ran against
    Bonds in 2021, then worked in Bonds' office. Running on equity, education,
    and environmental justice.
  long_bio: |
    Leniqua'dominique Jenkins (age 40) arrived in Washington in 2010 as an unpaid
    intern for Rep. Alan Grayson, working a second retail job in the evenings to
    make rent. She earned a certificate in entrepreneurship at Operation Hope and
    used it to launch Capitol Living, a home care agency she ran for ten years —
    training her father and brother (who were re-entering society after incarceration)
    as care assistants.

    She served one term as an ANC commissioner in Deanwood, focused on environmental
    justice. In 2021 she ran for the At-Large seat against Bonds but didn't make the
    ballot; she subsequently worked as a staffer in Bonds' office for a year, then
    became program director of East River Family Strengthening Collaborative's senior
    services hub. She lives east of the Anacostia River and says those communities are
    "a macro example of what's happening at a micro level throughout the city."

    Her "three E's" platform: equity, education, and environmental justice. Top
    priorities include third-grade reading proficiency and modernizing senior services.
  advisories: []
  sources:
