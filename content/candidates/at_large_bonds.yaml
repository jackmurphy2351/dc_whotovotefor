    - "Sekou Biddle (Former DC SBOE Member)"
    - "Greater Greater Washington"
    - "DC YIMBYs"
    - "DC Association of Realtors"
  short_bio: >
    Education policy veteran and former DC AG chief of staff (age 56). COO at Cesar
    Chavez Charter; DC State Board of Education 2006 (Wards 5 & 6); senior education
    advisor under Council Chair Kwame Brown; chief of staff to AG Karl Racine
    (2018–2020); currently major gifts officer at Covenant House. Capitol Hill
    resident. Endorsed by Councilmember Charles Allen and former Councilmember Mary Cheh.
  long_bio: |
    Lisa Raymond (age 56) came to DC from Connecticut in the late 1990s and was drawn
    into education policy by helping paint the walls of what would become Cesar Chavez
    Public Charter School in Southwest. She joined the school as chief of operations
    and later chief operating officer, where she saw firsthand how many high schoolers
    arrived years behind grade level. In 2006 she won a seat on the DC State Board of
    Education (representing Wards 5 and 6), only to see its powers transferred to the
    mayor shortly after. She then served as senior education advisor to then-Council
    Chair Kwame Brown and as chief of staff to DC Attorney General Karl Racine from
    2018 to 2020. She currently serves as major gifts officer at Covenant House, the
    organization serving homeless youth.

    A Capitol Hill resident and mother of two DCPS alumni, her top priorities are
    early childhood education (Pre-K3/Pre-K4 expansion with better-paid early
    childhood educators), career and technical education, full classroom staffing
    and school modernization (including safe water and functional HVAC systems), and
    parent advocacy bridge-building. "I don't see another champion for education at
    the moment," she says. On housing: "We have to take a good look at what we are
    doing as a city, what we're doing that gets in the way — but it's not an
    invitation to developers to come in here and do whatever they want." She is
    endorsed by Councilmember Charles Allen, former Councilmember Mary Cheh, former
    SBOE President Laura Slover, former SBOE member Sekou Biddle, Greater Greater
    Washington, DC YIMBYs, and the DC Association of Realtors.
