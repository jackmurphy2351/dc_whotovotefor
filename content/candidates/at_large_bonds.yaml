- id: dwight-davis
  name: "Dwight Davis"
  election_slug: at_large_bonds
  in_fair_elections: false
  campaign_url: https://dwight4dccouncil.com
  endorsements: []
  short_bio: >
    Born and raised in DC; DCPS teacher and elementary/middle school principal;
    nonprofit leader. BA from Albright College; graduate degrees in divinity and
    education from Princeton Theological Seminary. Married 25 years to wife Kenya;
    father of four sons. Explicitly supports DC statehood as a civil right.
  long_bio: |
    Dwight Davis (age 51) was born and raised in DC by his grandparents, whom
    he describes as "old-school Washingtonians." He attended DC public schools
    from Whittier Elementary through Calvin Coolidge High School, then played
    basketball at Albright College in Pennsylvania — a passion that took him to
    Colombia for semi-professional play and later to England. He earned graduate
    degrees in divinity and education from Princeton Theological Seminary (2004)
    before returning to DC as a DCPS educator and later elementary and middle
    school principal (including at Ron Brown College Preparatory High School).
    After 20+ years in education he moved into nonprofit and philanthropic work.
    He and his wife
    Kenya (married 25 years) are raising their four sons in DC, navigating the
    same public and charter schools as the families he hopes to represent.

    "Education is my jam," says Davis. "It cuts through all of the other issues.
    If we have an educated populace, our crime rates drop." He draws a direct
    analogy between running a school and running the council — balancing the
    urgent needs of individual classrooms (wards) with citywide equity. As a
    father of four, affordability is a top priority, particularly workforce
    housing for teachers, firefighters, nurses, and police. He also has an
    explicit statehood platform, calling DC self-government "a civil right" and
    calling Congress's interference in local affairs "unacceptable." He supports
    building national coalitions to advance statehood, defending budget autonomy,
    and fighting for full voting representation in Congress.
