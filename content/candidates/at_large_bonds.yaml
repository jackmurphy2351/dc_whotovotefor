- id: fred-hill
  name: "Fred Hill"
  election_slug: at_large_bonds
  in_fair_elections: false  # TODO: verify
  campaign_url: null  # TODO: add campaign URL
  endorsements: []
  short_bio: >
    Former 10-year chair of DC Board of Zoning Adjustment (age 57); ran federal
    contracting firm for ~28 years. Business-friendly moderate who supports
    fast-tracking city-financed affordable housing. Supports Kenyan McDuffie for mayor.
  long_bio: |
    Fred Hill (age 57) grew up in rural Poolesville, Maryland, the son of a Native
    American father and a mother who immigrated from Sikkim, India (formerly an
    independent kingdom, annexed by India in 1975). He ran his own federal contracting
    firm for nearly three decades, then served as chair of the DC Board of Zoning
    Adjustment (BZA) for ten years — a body that rules on requests from residents and
    developers seeking zoning exceptions. That experience gave him, he says, "an eye
    for the whole city."

    If elected, Hill would propose that any affordable housing project receiving city
    financing be fast-tracked to prevent bureaucratic delays from killing projects;
    he also calls for more 3+ bedroom units built for families, and collaboration
    with Congress to relax the federal Height of Building Act to enable denser
    development. He advocates AI and entrepreneurial education curricula for DC
    youth and wants to grow biotech and high-tech sectors to diversify the economy.
    A business-friendly moderate, he argues the council needs a private-sector voice:
    "There are 13 members and almost all of them came from inside the system. I'm
    coming from the private sector." He supports Kenyan McDuffie for mayor, favors
    strategic — rather than activist — resistance to federal overreach, and supports
    police-community advisory commissions to improve collaboration.
  advisories: []
  sources:
