  short_bio: >
    Former Biden White House deputy director of gun violence prevention (age 41);
    UVA grad. Survived a Shaw shooting in 2013 (6 surgeries). Former director of
    Bowser's Office of Community Relations. Lives in Congress Heights.
  long_bio: |
    Greg Jackson Jr. (age 41) was shot in the crossfire of a Shaw neighborhood
    shooting in 2013. He nearly died and required six surgeries over six months to
    recover. "My tragedy shined a light on interpersonal violence in inner cities,"
    he says. That experience redirected a career that had begun at a consulting firm
    and the DCCC, steering him toward DC's violence reduction infrastructure.

    He went on to serve as director of Mayor Muriel Bowser's Office of Community
    Relations and Services, then director of DC's Office of Neighborhood Safety and
    Engagement, and ultimately as deputy director of the White House Office of Gun
    Violence Prevention under President Biden. He graduated from the University of
    Virginia in 2007 and now lives in Congress Heights, where he says shootings
    remain a regular occurrence.

    His platform centers on evidence-based public safety strategies (pointing to
    Baltimore and Miami as models), investment in pathways to home ownership, and
    protecting DC home rule. He is endorsed by Rep. Maxwell Frost, former Gov.
    Kathleen Sebelius, Opportunity DC, and The Collective PAC.
  advisories: []
