- id: terry-lynch
  name: "Terry Lynch"
  election_slug: ward1
  in_fair_elections: true
  campaign_url: https://terrylynchfordc.com/
  endorsements:
    - category: "Elected/Appointed Officials"
      items:
        - "Bill Lightfoot, former DC Councilmember and chair of Bowser/Fenty mayoral campaigns"
        - "Fr. Ray Kemp, former DC School Board member and longtime pastor of St. Augustine's"
        - "Sandra Seegars, Ward 8 ANC Commissioner"
        - "Frank Agbro, Mt. Pleasant community leader and former ANC Commissioner"
    - category: "Individuals & public figures"
      items:
        - "Carol Fennelly, homeless and prison reform activist"
        - "Pat Patrick, former Adams Morgan Business Association President"
  short_bio: >
    40-year Mt. Pleasant resident (age 66), Georgetown alumnus, and living kidney
    donor (2020). Began career at CCNV shelters with Mitch Snyder; founded Calvary
    Women's Services and co-founded Washington Area Community Investment Fund.
    Quality-of-life focused campaign: small businesses, parking enforcement,
    community policing reform, parks, and senior services.
  long_bio: |
    Terry Lynch (age 66) has lived in DC since 1977 and in Mt. Pleasant for 40
    years. A Georgetown University alumnus, he began his career running homeless
    shelters alongside Mitch Snyder and Carol Fennelly at CCNV, then went on to
    found Calvary Women's Services — a shelter specifically for homeless women.
    He co-founded the Washington Area Community Investment Fund, which provides
    financing for affordable housing, small business development, and community
    services. In the 1990s he was an early advocate for zoning reform that brought
    housing, retail, and arts to downtown DC — work he undertook alongside future
    endorser Bill Lightfoot. He served on Mayor Williams' Library Task Force, as
    a PTA officer introducing sports and activities to DC schools, and as DC State
    Sports Commissioner, enhancing youth athletics citywide. In 2020 he donated
    a kidney at the Mayo Clinic.

    Lynch runs what he describes as a "person by person" campaign — not one of
    endorsements by special interest groups but by residents and the small,
    minority, and women-owned businesses of Ward 1 he says he's spent decades
    serving. Endorsers include Miss Pixie's, Fleet Feet, The Raven, Bukom Cafe,
    Dos Gringos, and Tamashaa. His civic activism has earned him the title "most
    annoying man in DC" from Washingtonian; he reportedly submits 20,000–25,000
    311 requests per year through daily walks across all eight wards.

    His campaign was originally triggered by outgoing Councilmember Brianne
    Nadeau's opposition to the RFK stadium deal, which Lynch called "the absolute
    last straw" given the construction and permanent jobs it would create. His
    platform focuses on quality-of-life: cleaner streets, keeping small businesses
    open, parking enforcement (he wants Zone 1 restrictions extended to 24/7 and
    immediate towing authority for violators), better city services, expanded parks
    and rec spaces, senior services, and more youth programming. He has publicly
    called on the Attorney General to conduct a top-to-bottom overhaul of MPD,
    citing concerns about use-of-force with youth and DC police cooperating with
    federal agents to detain residents.
  advisories: []
