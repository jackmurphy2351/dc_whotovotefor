  name: "Rashida Brown"
  election_slug: ward1
  in_fair_elections: true
  campaign_url: null  # TODO: add campaign URL
  endorsements:
    - "Brianne Nadeau (retiring Ward 1 Councilmember)"
  short_bio: >
    Former social worker, Howard grad, and ANC rep of 10 years. Endorsed by
    retiring Councilmember Brianne Nadeau.
  long_bio: |
    Rashida Brown (age 47) has lived in DC since 2000 and served as an ANC
    (Advisory Neighborhood Commissioner) representative for ten years. A former
    social worker and Howard University graduate, she is endorsed by outgoing
    Ward 1 Councilmember Brianne Nadeau. She has called out Mayor Bowser for
    silence during Trump's federal takeover of DC. Her housing platform centers
    on restoring TOPA and strengthening the Home Purchase Assistance and Emergency
    Rental Assistance Programs.
