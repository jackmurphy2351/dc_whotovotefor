- id: miguel-trindade-deramo
  name: "Miguel Trindade Deramo"
  election_slug: ward1
  in_fair_elections: true
  campaign_url: https://miguelward1.com/
  endorsements: []
  short_bio: >
    Current ANC 1B Chair, former DHS analyst, and key organizer for ranked choice
    voting in DC. Touts a "hyper-local" block-by-block approach.
  long_bio: |
    Miguel Trindade Deramo (age 39) has lived in Ward 1 since 2023. He is the current
    Chair of ANC 1B and was the lead organizer for DC's successful ranked choice voting
    initiative (Initiative 83, passed with 73% of the vote). A former Department of
    Homeland Security analyst, he has been doing public service full-time for four
    years. His housing platform follows Montgomery County's social housing model and
    would use DOPA to preserve affordable housing. On transit, he supports bus lanes
    on U Street and expanding existing lanes on Georgia Ave and 14th St, and he
    secured Capital Bikeshare stations at 15th/Chapin and 14th/Belmont. He is active
    on DC autonomy issues: opposed ICE agents wearing deceptive police uniforms, ran
    weekly Know Your Rights outreach, and lobbied Capitol Hill to restore $1 billion
    cut from DC's budget. He founded the ANC Home Rule Caucus. He is known for his
    "hyper-local" approach: going block-by-block on uncollected trash, shuttered
    businesses, and organized regular Malcolm X Park cleanups.
  advisories: []
  sources:
