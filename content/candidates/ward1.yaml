# Ward 1 Councilmember candidates — 2026 DC Democratic Primary
# Five Democratic candidates are in the primary. Jett Jasper (R) and Jude Crannitch (Green) are NOT in the primary.
# Source: https://ballotpedia.org/City_elections_in_Washington,_D.C._(2026)
# Source: https://ggwash.org/view/103003/we-polled-ward-1-on-dc-council-primary-race

