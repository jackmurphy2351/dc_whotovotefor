      explanation: "Participating in the DC Fair Elections Program."
      sources:
        - url: https://fairelections.ocf.dc.gov/
          title: "DC Fair Elections Program Candidate Search"
          publisher: dc.gov
          accessed: 2026-05-27

- id: aparna-raj
  name: "Aparna Raj"
  election_slug: ward1
  in_fair_elections: true
  campaign_url: https://aparnafordc.com/
  endorsements:
    - "Working Families Party"
  short_bio: >
    Tenant organizer and nonprofit policy analyst; highest fundraising of any
    Ward 1 candidate. Endorsed by Working Families Party and two dozen unions.
  long_bio: |
    Aparna Raj (age 32) is a tenant organizer who began as a DSA volunteer and
    now works for Local Progress, a progressive policy nonprofit. She has raised
    more money than any other Ward 1 candidate, hitting the Fair Elections Program
    funding ceiling. Her housing platform is the most detailed in the race: she
    would expand rent stabilization to all buildings built after 1975 (with a goal
    of universal coverage by the 2030 reauthorization), restore TOPA for all DC
    residents, and allocate $125 million annually to the Housing Production Trust
    Fund. She would pilot social housing modeled on Montgomery County and Seattle.
    On childcare, she would guarantee free publicly funded care for ages 3 months
    to 3 years — paid for by taxes on large corporations. She supports ending MPD
    cooperation with ICE, strengthening the Sanctuary Values Act, and funding free
    public immigration legal services. On transit, she would build dedicated bus
    lanes (citing 15% commuting time savings), increase bus frequency to 12-minute
    minimum intervals, and extend existing lane hours. On public safety she
    emphasizes violence interruption ("Cure the Streets"), non-police crisis
    response, and youth programming over traditional policing. She is endorsed by
    the Working Families Party and approximately two dozen unions and progressive
    groups.
  advisories: []
  sources:
    - url: https://aparnafordc.com/platform
      title: "Platform — Aparna Raj for DC Council"
      publisher: "Aparna Raj Campaign"
      accessed: 2026-05-27
    - url: https://aparnafordc.com/
      title: "Aparna Raj for DC Council — Campaign Website"
      publisher: "Aparna Raj Campaign"
      accessed: 2026-05-27
    - url: https://51st.news/dc-council-at-large-special-election-candidates-interview/
      title: "Meet the candidates — The 51st"
      publisher: "The 51st"
      accessed: 2026-05-27
  positions:
