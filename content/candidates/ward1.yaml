      quote: "They know I will fight for them, I won’t give up, and will help them stay open and thrive."
      explanation: "Runs as the candidate of Ward 1's small, minority, and women-owned businesses, dozens of which have endorsed him. Pledges to 'help them stay open and thrive' and to stop the loss of small businesses, citing 'over-regulation, loss of parking, rising costs' as the key challenges — emphasizing reduced regulatory burden more than tax cuts specifically."
