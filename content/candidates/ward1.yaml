      stance: 2
      explanation: "Would expand rent stabilization to properties built after 1975 and push for universal coverage of all multifamily buildings at the 2030 reauthorization."
      sources:
        - url: https://aparnafordc.com/platform
          title: "Platform — Aparna Raj for DC Council"
          publisher: "Aparna Raj Campaign"
          accessed: 2026-05-27

    - question_id: housing_topa_restore
      stance: 2
      explanation: "Explicitly calls for restoring TOPA to all District residents and strengthening the First Right Purchase Program for limited equity cooperatives."
      sources:
        - url: https://aparnafordc.com/platform
