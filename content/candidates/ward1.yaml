      explanation: "Will champion zoning reform to allow more housing, citing Minneapolis and Austin: ease parking and setback requirements, raise restrictive height caps, build over existing low-rise retail on commercial corridors, and amend the Comprehensive Plan to facilitate 'missing middle' / 'gentle density' housing. Expects Zoning Commission nominees to prioritize changes that spur housing construction. In a DC Beat interview he called himself 'the most pro housing candidate in my race,' arguing DC's own zoning — not the federal Height Act — constrains growth ('our zoning is often lower than the Height Act would allow') and pressing to 'open the gates for taller buildings' on transit-rich corridors like 14th and U Streets rather than 'building low-slung buildings' there. At the Bike, Walk & Bus PAC forum he called transit-oriented development essential, noting that for already-dense Ward 1 building more housing 'kind of means everywhere,' while insisting other wards 'pull their fair share' and raise density near transit."
      sources:
