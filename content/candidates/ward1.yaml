  name: "Jackie Reyes Yanes"
  election_slug: ward1
  in_fair_elections: true
  campaign_url: null  # TODO: add campaign URL
  endorsements: []
  short_bio: >
    Former Bowser staffer and Latinx community advocate. Would be the first Latina
    Ward 1 representative.
  long_bio: |
    Jackie Reyes Yanes (age 48) has lived in DC since 1990 and spent the past decade
    as a staffer for Mayor Bowser, where she focused on services for Latinx immigrants
    (including securing a 2020 fund for immigrants' legal services). She is the more
    moderate candidate in the Ward 1 race, cautioning against overpromising. She is
    outspoken against MPD collaboration with ICE and federal agents, and would be the
    first Latina representative for Ward 1.
