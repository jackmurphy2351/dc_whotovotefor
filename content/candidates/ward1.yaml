    - question_id: homelessness_housing_first
      stance: 2
      quote: "Miguel will support a more effective, data-driven 'housing first' approach with no preconditions to accessing housing."
      explanation: "Trindade Deramo frames homelessness as 'a housing issue,' explicitly backing a Housing First approach with no preconditions, more permanent supportive housing, and a shift away from congregate shelters — and condemning 'the thoughtless clearing of encampments.' Strongly supports. His DC for Democracy questionnaire adds praise for DC's data-driven continuum — robust outreach, low-barrier shelters, non-congregate transitional housing with supportive services — citing the Terrell family shelter in his own SMD as a model, and a focus on the 'lease-up' bottleneck, with the Greater Washington Community Foundation strategies incorporated into a forthcoming Homeward DC 3.0."
      sources:
