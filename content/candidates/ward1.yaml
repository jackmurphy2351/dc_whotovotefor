# Ward 1 Councilmember candidates — 2026 DC Democratic Primary
# Five Democratic candidates are in the primary. Jett Jasper (R) and Jude Crannitch (Green) are NOT in the primary.
# Source: https://ballotpedia.org/City_elections_in_Washington,_D.C._(2026)
# Source: https://ggwash.org/view/103003/we-polled-ward-1-on-dc-council-primary-race

- id: rashida-brown
  name: "Rashida Brown"
  election_slug: ward1
  in_fair_elections: true
  campaign_url: https://rashidaforward1.com/
  endorsements:
    - "Brianne Nadeau (retiring Ward 1 Councilmember)"
  short_bio: >
    Former social worker, Howard grad, and ANC rep of 10 years. Endorsed by
    retiring Councilmember Brianne Nadeau.
  long_bio: |
    Rashida Brown (age 47) has lived in DC since 2000 and served as an ANC
    (Advisory Neighborhood Commissioner) representative for ten years. A former
    social worker and Howard University graduate, she is endorsed by outgoing
    Ward 1 Councilmember Brianne Nadeau. She has called out Mayor Bowser for
    silence during Trump's federal takeover of DC. Her housing platform centers
    on restoring TOPA, advancing Housing First policies with wraparound services
    for unhoused residents, and restoring Emergency Rental Assistance Program
    funding. As an ANC commissioner she helped drive the Park Morton development
    (450+ units, 60% affordable) and the Bruce Monroe development. On transit she
    would fund free buses, expand bus frequency, and implement safer streets for
    cyclists and pedestrians. On public safety she prioritizes community-based
    prevention over expanded criminalization and wants to end MPD collaboration
    with ICE while strengthening the Sanctuary Values Act. She received a 10/10
    rating from GLAA DC.
  advisories: []
  sources:
    - url: https://rashidaforward1.com/on-the-issues
      title: "On the Issues — Rashida Brown for DC"
      publisher: "Rashida Brown Campaign"
      accessed: 2026-05-27
