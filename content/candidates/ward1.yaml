      explanation: "Has publicly called on the Attorney General to conduct a top-to-bottom overhaul of MPD, citing concerns about DC police cooperating with federal agents to detain residents. Opposes MPD/federal cooperation on accountability grounds, though his platform focuses on community policing reform rather than broader political resistance to the Trump administration. In his DC for Democracy questionnaire he said he has 'often spoken public[ly] against federal actions under the current president — from DOGE cuts, to [the] federal shutdown, to how the surge was implemented' and that standing up to those federal impacts on families 'must be a first priority' as a Councilmember."
