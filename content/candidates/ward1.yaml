  short_bio: >
    Social worker, Howard grad, and ANC rep of 10 years who delivered 456 housing
    units (60% affordable) through Park Morton and Bruce Monroe. Policy director
    at DC's OSSE who built My Child Care DC and Thrive by Five; 25 years in early
    childhood policy. Co-founded Georgia Avenue Thrive. GLAA DC 10/10 rating.
    Endorsed by retiring Councilmember Brianne Nadeau.
  long_bio: |
    Rashida Brown (age 47) grew up in a working-class New York City family: her
    father was a subway conductor on the A train through Harlem, a proud Transport
    Workers Union Local 100 member, and later ran a family roofing business. When
    he was diagnosed with cancer, her mother worked three jobs to cover the mortgage,
    his healthcare costs, and Rashida's after-school programs. Those experiences
    shaped her conviction that the struggles she faced were far from unique. She
    attended Howard University on a scholarship made possible by her parents' hard
    work, graduating with a degree in social work. She has lived in DC since 2000
    and in Park View for 15 years.

    She has spent 25 years in child and family policy. As policy director at DC's
    Office of the Superintendent of Secondary Education (OSSE) she advanced the
    Pre-K Enhancement program, helped develop and launch My Child Care DC, and
    launched Thrive by Five. She helped bring the Pay Equity Fund model to Colorado
    and secured a $2 million partnership with that state's Department for Early
    Childhood Development. As a registered federal lobbyist she helped pass the
    reauthorization of the Child Care and Development Block Grant Act. She has
    advised municipalities across the country on implementing similar programs.

    During her 10 years as an ANC Commissioner for ANC 1E, she co-founded Georgia
    Avenue Thrive — a community-led initiative using arts, economic development, and
    community activation (not policing) to make the Lower Georgia Ave corridor safer
    — and led the fight for Park Morton and Bruce Monroe, delivering 456 housing
    units, 60 percent of them affordable. She is a Home Purchase Assistance Program
    (HPAP) recipient herself and knows firsthand how these programs matter. She
    championed bus priority projects on Georgia Avenue and the Columbia Heights
    Crosstown, secured protected bike lanes on Kenyon, Warder, and Park Place, and
    graduated from DC's Community Engagement Academy, walking the beat with MPD to
    understand community policing firsthand.

    GLAA DC gave her a 10/10 rating — one of only four candidates across all DC
    primary races to receive a perfect score. She is endorsed by retiring
    Councilmember Brianne Nadeau, Working Families Party, Greater Greater Washington,
    Sierra Club, DC YIMBYs, 32BJ SEIU, and LIUNA, among others.

    Her platform: expand rent stabilization to pre-1985 buildings (closing the
    voluntary-agreement loophole), restore TOPA for all buildings, protect the HPTF
    with mandatory set-asides for deeply affordable units, implement Birth-to-Three's
    10% childcare cost cap with dedicated revenue, dramatically expand violence
    interruption funding (citing 30–60% gun violence reductions at scale), oppose
    youth curfews, and oppose pretrial detention expansion.
