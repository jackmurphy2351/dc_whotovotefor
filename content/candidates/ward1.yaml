    - question_id: econ_small_business_tax_relief
      stance: 1
      quote: "He will work to align incentives to preserve and grow the “missing middle,” the kinds of businesses that weave neighborhoods together: locally owned restaurants, corner stores, and services."
      explanation: "Takes a broad view of affordability and wants to 'align incentives to preserve and grow the missing middle' — locally owned restaurants, corner stores, and services most at risk of being priced out — and to protect DC's Earned Income Tax Credit and Child Tax Credit. Emphasizes preserving small/local businesses and reviving programs like streateries and the commercial trash compactor grant more than across-the-board business tax cuts."
      sources:
        - url: https://miguelward1.com/priorities
          title: "Priorities — Miguel for Ward 1"
          publisher: "Miguel Trindade Deramo Campaign"
          accessed: 2026-05-30

    - question_id: sanitation_rats
      stance: 2
      quote: "District’s open-air rat buffets, formally known as litter bins — the black metal ones you see on many street corners — must be replaced by a rodent-proof model for effective waste management."
      explanation: "Has a four-plank rat platform: (1) replace open-air trash cans with rodent-proof closed bins; (2) expand composting from pilot to permanent program including apartments; (3) stronger enforcement against illegal trash dumping in alleys by restaurants and landlords; (4) innovate with rodent birth control trials. Got Ward 1's first composting bin installed at 14th & U. Supports the RAT Amendment Act and RATSS Act. Explicitly avoids rodenticides due to harm to wildlife."
      sources:
        - url: https://miguelward1.com/priorities
          title: "Priorities — Miguel for Ward 1"
          publisher: "Miguel Trindade Deramo Campaign"
          accessed: 2026-05-30

    - question_id: home_rule_dc_resist
      stance: 2
      quote: "Miguel led the call for ICE and other federal agents to stop concealing their identities and wearing deceptive uniforms that say “POLICE.” ICE agents are not our police."
      explanation: "Founded the ANC Home Rule Caucus (75+ commissioners), led 36 commissions to pass concurrent resolutions condemning the federal takeover, personally lobbied Capitol Hill with Free DC to restore $1 billion cut from DC's budget, ran weekly Know Your Rights outreach in English and Spanish, and rallied ANCs to demand ICE stop wearing deceptive 'POLICE' uniforms — a record of aggressive, public-facing resistance to federal interference. In a DC Beat interview he backed the FAAR Act as pushing 'an envelope that's important to push,' urged the Mayor and Council to 'lean in a little more' in defending DC's autonomy, and faulted the city's 'softly softly' response to the federal immigration crackdown that hit Ward One hardest — saying he 'didn't see the mayor come out to Ward One and stand on the street corner with people.'"
