    - question_id: labor_worker_protections
      stance: 1
      quote: "Ensuring fair and livable wages is essential to supporting DC workers amid an affordability crisis. In doing so, we must be thoughtful about increasing wages in a way that does not unintentionally disrupt our local economy…"
      explanation: "Trindade Deramo supports better worker protections and a higher minimum wage (and has used his ANC role for worker-safety oversight), but favors a gradual, tiered, Seattle-style implementation negotiated with labor and business to avoid job losses. Supports stronger protections with a cautious approach to wage mandates. As lead organizer for Initiative 83, his DC for Democracy questionnaire stresses that he 'do[es] not believe in overturning ballot measures' like Initiative 82, faulting the Council for a poor, reactive rollout rather than 'getting the implementation right' and exploring 'complementary protections for service workers' — 'progressivism depends on successful implementation.'"
