- id: miguel-trindade-deramo
  name: "Miguel Trindade Deramo"
  election_slug: ward1
  in_fair_elections: true
  campaign_url: https://miguelward1.com/
  endorsements: []
  short_bio: >
    Current ANC 1B Chair (age 39), child of an immigrant family, and former
    immigration professional / DHS analyst who has lived in Ward 1 since 2023.
    Lead organizer for Initiative 83 (RCV, 73% of the vote) and co-founder of
    Grow Democracy DC. Founded the ANC Home Rule Caucus (75+ commissioners).
    Car-free household. Comprehensive policy platform from housing to transit to
    school accountability.
  long_bio: |
    Miguel Trindade Deramo (age 39) has lived in Ward 1 since 2023. He is the
    current Chair of ANC 1B, representing the U Street corridor, and describes
    himself as a child of an immigrant family and a former immigration professional.
    His father spent his career as a CWA member; his uncles were IBEW electricians;
    his mother was a schoolteacher in a non-unionized private school who bought
    supplies out of her own pocket. He saw firsthand how union membership shaped
    his father's career relative to his mother's. He previously worked as a federal
    analyst (Department of Homeland Security). He and his partner Luis are a
    car-free household in Ward 1; Luis lost his job when USAID was shuttered.

    He was the lead organizer and steering committee member for Initiative 83,
    DC's ranked-choice voting initiative, which passed with 73% of the vote —
    including a supermajority in every ward and a majority in every precinct.
    He then co-founded and served as first executive director of Grow Democracy DC,
    a nonprofit preparing voters to participate in DC's first RCV elections. He also
    led the successful citywide campaign to defeat the Initiative Amendment Act, a
    bill that would have gutted voters' ability to propose ballot measures.

    As ANC Chair, he founded the Home Rule Caucus (75+ commissioners from across
    DC) to coordinate autonomy actions, and led the effort to get 36 commissions to
    pass concurrent resolutions condemning the federal takeover. He personally
    lobbied on Capitol Hill with Free DC to restore $1 billion cut from DC's budget,
    ran weekly Know Your Rights outreach in English and Spanish, and rallied other
    ANCs to demand ICE stop wearing deceptive "POLICE" uniforms. He also organized
    Shakespeare in the Park at Malcolm X Park, hosted the Celebration of International
    Service for displaced USAID workers, got a composting bin installed at 14th & U,
    and conducted rigorous oversight of DC's response to a fatal V Street building
    collapse — pushing DOB and OSHA accountability well beyond what ANCs typically do.

    His housing platform calls for more supply through zoning reform and streamlined
    permitting, restoring TOPA for 2–4 unit buildings, using DOPA more aggressively,
    a new Housing Preservation Fund alongside the HPTF, exploring social housing
    modeled on Montgomery County, and a "housing first" approach to homelessness with
    no preconditions. On transit he would champion a seamless 14th St protected bike
    lane, all Ward 1 bus priority corridors (U St, Florida, Georgia, 14th, Crosstown),
    25 new or expanded Capital Bikeshare stations, and ultimately fare-free buses
    funded by a land value tax. His education platform emphasizes school-based
    behavioral health (specifically concerned about the DBH transition), chronic
    absenteeism (37% in Ward 1), and annual walkthrough inspections of every Ward 1
    school. He has a detailed rat-control platform including rodent-proof bins,
    composting expansion, and rodent birth control trials. He explicitly opposes
    permanent or repeatedly extended youth curfews, preferring programming,
    rec centers, and violence interruption instead.
