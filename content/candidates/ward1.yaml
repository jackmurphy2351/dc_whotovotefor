    - question_id: transit_fare_free_buses
      stance: 2
      quote: "Our transit vision should be ambitious and include efforts to make bus service in DC fare‑free."
      explanation: "Supports moving to fare-free buses in the District, which he proposes funding through a land value tax — part of a transit platform that also includes bus priority corridors, a seamless 14th St protected bike lane, and expanded Capital Bikeshare. At the Bike, Walk & Bus PAC forum he reaffirmed strong support but cautioned it must be done 'the right way' — locking in a reliable, multi-year dedicated funding stream first so the city doesn't fund free buses for a few years and then break the promise, and without sacrificing the frequency and reliability that surveys show riders value most. He opposed the earlier trade-off of scrapping the K Street Transitway to pay for free buses."
