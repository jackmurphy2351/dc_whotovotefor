      year: 2026
      text: >-
        On June 5, 2026, the Office of Campaign Finance revoked the Fair Elections
        Program certification of Reyes-Yanes and her campaign committee (Docket No.
        OCF FI 2026-006). OCF auditors identified 13 cash contributors listed in the
        campaign's April 2026 disclosure report who denied making any contributions
        to the campaign, and the order found the campaign 'failed to overcome the
        allegation of submitting falsified contribution information.' The order halts
        all Fair Elections disbursements and directs the campaign to return remaining
        funds to the Fair Elections Fund.
