      title: "Meet the candidates running in the D.C. Council At-Large special election — The 51st"
      publisher: "The 51st"
      accessed: 2026-05-27
  positions:
    - question_id: housing_topa_restore
      stance: 2
      explanation: "Would prioritize restoring TOPA as a key housing platform plank."
      sources:
        - url: https://51st.news/dc-council-at-large-special-election-candidates-interview/
          title: "Meet the candidates — The 51st"
          publisher: "The 51st"
          accessed: 2026-05-27

    - question_id: transit_bike_bus_lanes
      stance: 2
      explanation: "Would fund free buses and expand bus network with increased frequency; as ANC commissioner secured crosswalks, bike lanes, and traffic calming measures."
      sources:
        - url: https://rashidaforward1.com/on-the-issues
