- id: miguel-trindade-deramo
  name: "Miguel Trindade Deramo"
  election_slug: ward1
  in_fair_elections: true
  campaign_url: null  # TODO: add campaign URL
  endorsements: []
  short_bio: >
    Current ANC 1B Chair, former DHS analyst, and key organizer for ranked choice
    voting in DC. Touts a "hyper-local" block-by-block approach.
  long_bio: |
    Miguel Trindade Deramo (age 39) has lived in Ward 1 since 2023. He is the current
    Chair of ANC 1B and was a major organizer for DC's successful ranked choice voting
    initiative. A former Department of Homeland Security analyst, he has been doing
    public service full-time for four years. His housing platform follows Montgomery
    County's social housing model and would use DOPA to preserve affordable housing.
    On transit, he supports bus lanes on U Street and expanding existing lanes on
    Georgia Ave and 14th St. He is known for his "hyper-local" approach: going
    block-by-block to address issues like uncollected trash, shuttered businesses,
    and lack of late-night options.
  advisories: []
  sources:
    - url: https://51st.news/dc-council-at-large-special-election-candidates-interview/
      title: "Meet the candidates — The 51st"
      publisher: "The 51st"
      accessed: 2026-05-27
  positions:
