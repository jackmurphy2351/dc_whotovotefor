- id: terry-lynch
  name: "Terry Lynch"
  election_slug: ward1
  in_fair_elections: true
  campaign_url: https://terrylynchfordc.com/
  endorsements: []
  short_bio: >
    Longtime civic activist and Georgetown alumnus who has lived in DC since 1977.
    Known for submitting up to 25,000 311 requests a year.
  long_bio: |
    Terry Lynch (age 66) has lived in DC since 1977. A longtime civic activist and
    Georgetown University alumnus, he is focused on fixing "urban blight." He calls
    himself a "311 Super User," reportedly submitting 20,000–25,000 311 requests per
    year through daily walks across all eight wards. His housing platform focuses on
    aggressively targeting vacant and blighted properties with a "use it or lose it"
    policy to reclaim properties not restored within 3 years, rather than building
    new housing stock. His campaign website emphasizes neighborhood quality-of-life
    improvements — cleaner streets, better city services, support for small
    businesses, expanded parks, and senior services — over detailed legislative
    proposals. He has founded shelters and served on PTAs and city task forces during
    his decades in Ward 1.
  advisories: []
  sources:
    - url: https://terrylynchfordc.com/the-issues
      title: "The Issues — Terry Lynch for DC"
      publisher: "Terry Lynch Campaign"
      accessed: 2026-05-27
    - url: https://51st.news/dc-council-at-large-special-election-candidates-interview/
      title: "Meet the candidates — The 51st"
      publisher: "The 51st"
      accessed: 2026-05-27
  positions:
    - question_id: housing_social_model
      stance: -1
      explanation: "Prefers targeting vacant/blighted properties over building new social housing stock. Wants a 'use it or lose it' policy to reclaim properties not restored within 3 years."
      sources:
        - url: https://51st.news/dc-council-at-large-special-election-candidates-interview/
          title: "Meet the candidates — The 51st"
          publisher: "The 51st"
          accessed: 2026-05-27

