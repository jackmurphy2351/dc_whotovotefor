- id: jackie-reyes-yanes
  name: "Jackie Reyes Yanes"
  election_slug: ward1
  in_fair_elections: true
  campaign_url: https://jackieforward1.com/
  endorsements: []
  short_bio: >
    Former Bowser staffer and Latinx community advocate. Would be the first Latina
    Ward 1 representative.
  long_bio: |
    Jackie Reyes Yanes (age 48) has lived in DC since 1990 and spent the past decade
    as a staffer for Mayor Bowser, where she focused on services for Latinx immigrants
    (including securing a 2020 fund for immigrants' legal services). She is the more
    moderate candidate in the Ward 1 race, cautioning against overpromising, and
    would be the first Latina representative for Ward 1. Her five-point platform
    calls for small business revival ($5,000–$50,000 grants and a one-stop business
    hub); a community ambassador program staffed by 20 paid seniors and youth with a
    72-hour constituent response guarantee; expanded affordable housing (HPAP at
    $30 million with a $150,000 income limit, 20% affordable units required in new
    developments above 10 units at 60% AMI, and strengthened rent control); universal
    affordable childcare for birth to 36 months with educator wages raised to a
    $22/hour minimum; and community safety improvements through a full street
    lighting audit and guaranteed youth employment.
  advisories: []
  sources:
    - url: https://jackieforward1.com/#platform
      title: "Policy Platform — Jackie Reyes Yanes for Ward 1"
      publisher: "Jackie Reyes Yanes Campaign"
      accessed: 2026-05-27
    - url: https://51st.news/dc-council-at-large-special-election-candidates-interview/
      title: "Meet the candidates — The 51st"
      publisher: "The 51st"
      accessed: 2026-05-27
  positions:
    - question_id: housing_rent_stabilization
      stance: 1
      explanation: "Would strengthen rent control; requires 20% affordable units in new developments above 10 units at 60% AMI or below. More moderate than expanding to all post-1975 buildings."
      sources:
        - url: https://jackieforward1.com/#platform
          title: "Policy Platform — Jackie Reyes Yanes for Ward 1"
          publisher: "Jackie Reyes Yanes Campaign"
          accessed: 2026-05-27

    - question_id: mpd_ice_cooperation
