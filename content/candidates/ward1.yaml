    - question_id: fiscal_progressive_taxation
      stance: 2
      quote: "Yes, I support changes to ensure that wealth is taxed properly and progressively in the District."
      explanation: "In his DC for Democracy questionnaire Trindade Deramo wrote 'Yes, I support changes to ensure that wealth is taxed properly and progressively in the District,' backing the tiered 'mansion' property tax (noting DC has the region's lowest property taxes), lowering the estate-tax exemption and decoupling from the federal stepped-up basis, a split-rate property tax to capture revenue and spur productive land use, and reauthorizing the Tax Revision Commission to advance ideas like a Business Activity Tax — while opposing regressive moves like the coming sales-tax increase."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Miguel Trindade Deramo"
          publisher: "DC for Democracy"
          accessed: 2026-06-16

    - question_id: education_mayoral_control
      stance: 0
      explanation: "In his DC for Democracy questionnaire Trindade Deramo said he is 'always in favor of increasing popular voice in governance' and that the current system 'frustrates parents and communities through a felt lack of accountability' — but cautioned that 'the research literature is dubious that control by elected school boards necessarily produces better outcomes.' He would support greater OSSE independence or expanded State Board authority only if it demonstrably improves the District's 'ability to serve students and to hold schools accountable.' Conditional and outcome-driven rather than a clear call to end mayoral control."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 DC Council Questionnaire — Miguel Trindade Deramo"
          publisher: "DC for Democracy"
          accessed: 2026-06-16

    - question_id: crime_more_police
      stance: 0
      explanation: "In his DC for Democracy questionnaire Trindade Deramo emphasized addressing 'all of the factors that drive crime' — restoring violence-interruption funding and reviving the NEAR Act's community-policing framework and Police Reform Commission proposals — rather than expanding the force. He wants MPD adequately resourced to do its job and to repair community trust after the federal intervention, but notes that 'large (preventive) MPD presence... projects an image of general insecurity,' favoring community policing and reform over a headcount increase. Recorded as mixed."
