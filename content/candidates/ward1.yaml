  endorsements:
    - category: "Elected/Appointed Officials"
      items:
        - "Anita Bonds, DC At-Large Councilmember"
        - "Yasmin Romero, former ANC 1 Commissioner"
    - category: "Advocacy & community organizations"
      items:
        - "Greater Capital Area Association of REALTORS (GCAAR)"
    - category: "Individuals & public figures"
      items:
        - "Sharon Snead, Hubbard Place Tenant Association President"
        - "Casilda Luna, Latino community leader"
  short_bio: >
    Born in El Salvador; came to DC in 1990 as a teenage mother who experienced
    homelessness. Rose to become Executive Director of the Mayor's Office on Latino
    Affairs (2015) and Director of the Mayor's Office of Community Affairs (2021,
    first Latina). Secured $10M for immigrant legal defense. If elected, would be
    the first Latina elected to DC Council. Platform: small business grants, childcare,
    HPAP expansion, and community safety.
  long_bio: |
    Jackie Reyes Yanes (age 48) was born in El Salvador and came to Washington, DC
    in 1990 at age 13. As a teenage mother who experienced homelessness, she gained
    firsthand understanding of the barriers facing low-income and newcomer families.
    Her father later bought their home in the 1990s working as a dishwasher, an
    experience she invokes often: "That door must stay open for the next generation."

    Her career began at the Latin American Youth Center, where she built expertise in
    data, outreach, and program coordination for youth and families. She later served
    in Mayor Fenty's Office of Community Relations and Services and then as Director
    of Latino Affairs and Community Outreach for the late Ward 1 Councilmember Jim
    Graham. In 2015, Mayor Bowser appointed her Executive Director of the Mayor's
    Office on Latino Affairs (MOLA), where she expanded the agency's budget, launched
    the Immigration Justice Legal Services Grant Program (securing $10 million for
    immigrant legal defense), and played a central role in expanding STAY DC to help
    thousands of families remain housed during crises. During COVID-19 she led
    multilingual vaccine education and mobile vaccination clinics in hard-to-reach
    neighborhoods. In October 2021 she was appointed Director of the Mayor's Office
    of Community Affairs — the first Latina to hold the position — overseeing multiple
    community affairs offices and serving as a bridge between residents and the Mayor.

    Notable milestones: featured in the 2017 book "Sí Puede: 26 Successful Salvadorans
    in the Diaspora"; led the 2018 delegation that resulted in the Sister City Agreement
    between Washington, DC and San Salvador; and in 2024 helped lead the team that set
    a Guinness World Record for the world's largest pupusa. Named to El Tiempo Latino's
    "100 Powermeter." Endorsed by At-Large Councilmember Anita Bonds and GCAAR.

    If elected, she would be the first Latina ever elected to the DC Council. She
    frames her campaign explicitly around that historic significance alongside a
    five-point platform: small business grants ($5K–$50K, multilingual, fast decisions);
    a Neighborhood Solution Center with 20 paid Community Ambassadors (10 seniors,
    10 youth) and a 72-hour response guarantee; HPAP expansion to $30 million with a
    $150K income limit; affordable childcare from birth to 36 months with educator
    pay raised to $22/hour minimum; and community safety through full street-lighting
    audits, activated public spaces, and guaranteed youth employment. She explicitly
    supports a youth curfew as a temporary protective measure while investing in
    programming as the long-term solution.
  advisories:
