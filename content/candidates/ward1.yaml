  short_bio: >
    Tenant organizer, union member, and queer daughter of immigrants who has
    called Columbia Heights home for a decade. DSA volunteer; served on ANC 1A
    Housing Justice and Zoning Committee. Works for a progressive policy nonprofit.
    Highest fundraiser in the Ward 1 race. Comprehensive platform: free childcare,
    rent cap expansion, $125M/year for affordable housing, public utility ownership,
    and ending MPD-ICE cooperation.
  long_bio: |
    Aparna Raj (age 32) is a tenant organizer, union member, and queer woman of
    color who has lived in Columbia Heights for a decade with her husband Stuart
    and their dog Frank. She describes her motivation in personal terms: her mother
    came to the US as an immigrant and worked minimum-wage retail without the ability
    to take sick time; her father lost his job in 2009 and the family scrambled to
    make ends meet; and as her parents age, the prospect of a medical emergency
    bankrupting them looms. Those experiences led her to volunteer with Metro DC DSA,
    through which she organized for tenants' rights (including alongside the tenants
    of Marbury Plaza), worked to defend and expand tenant protections against the
    real estate lobby, and organized against Trump. She previously worked at a
    nonprofit addressing food insecurity in DC and now works for Local Progress, a
    progressive policy nonprofit. She served on ANC 1A's Housing Justice and Zoning
    Committee and fought for housing that meets people's needs rather than developer
    profits. As a union member she served on her unit's bargaining committee and
    picketed alongside restaurant workers, bus drivers, and mechanics.

    She has raised more money than any other Ward 1 candidate, hitting the Fair
    Elections Program funding ceiling. Her housing platform is the most detailed in
    the race: she would expand rent stabilization to all buildings built after 1975
    (with a goal of universal coverage at the 2030 reauthorization), restore TOPA
    for all DC residents, allocate $125 million annually to the Housing Production
    Trust Fund, and pilot social housing modeled on Montgomery County and Seattle.
    On childcare, she would guarantee free publicly funded care from age 3 months to
    3 years — no means testing, paid for by taxes on large corporations — by fully
    funding the existing Birth to Three infrastructure. Her energy platform calls for
    PSC reform (reducing Pepco's guaranteed return to ~6%), fully funding Solar for
    All and home electrification programs, and ultimately transitioning to public
    ownership of DC's utilities. She has a detailed rat-control platform including
    smart rodent-proof bins, a DC Rat Czar to coordinate DPW and DC Health, and a
    composting expansion. On workers' rights she would extend the right to strike to
    public sector workers, introduce fair scheduling legislation, and introduce a DC
    Right to Organize Act. On transit she would build dedicated bus lanes (citing
    15% commuting time savings), increase bus frequency to 12-minute minimums, and
    close bicycle network connectivity gaps. On public safety she emphasizes violence
    interruption ("Cure the Streets"), non-police crisis response, and youth
    programming. She supports ending MPD cooperation with ICE, strengthening the
    Sanctuary Values Act, and funding free public immigration legal services.

    Ward 1 is majority-Spanish-speaking in many blocks; Raj is actively learning
    Spanish and has committed to fully translated constituent communications.
