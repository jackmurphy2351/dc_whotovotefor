- id: michael-murphy
  name: "Michael Murphy"
  election_slug: ward6
  in_fair_elections: false
  campaign_url: https://www.murphyforward6.com/
  endorsements:
    - "Denise Rucker Krepp, former Ward 6 ANC commissioner and victims' rights advocate"
  short_bio: >
    Litigator at Bailey & Glasser LLP and 30-year Capitol Hill resident running on
    transparency and public safety. Was the first to publicly allege that MPD
    manipulated violent-crime statistics, and has built his campaign around honest
    crime data, rebuilding MPD, youth accountability and opportunity, faster housing
    approvals, and fully funding the open primaries voters approved in Initiative 83.
    Wants more police officers and to revisit the Youth Rehabilitation Act.
  long_bio: |
    Michael "Mike" Murphy is a litigator at Bailey & Glasser LLP with a track record
    in class-action lawsuits against major corporations and pro bono work, including
    representing Two Rivers Public Charter School. A second-career attorney who
    graduated cum laude from The Catholic University of America law school, he
    previously supported national bargaining committees for the International
    Brotherhood of Teamsters and worked as a paralegal in the DC Office of the
    Corporation Counsel. He served as interim Executive Director of the Drum Major
    Institute, a nonprofit founded on Dr. Martin Luther King, Jr.'s principles. A
    Capitol Hill resident married for nearly 30 years with two children, he enjoys
    bouldering, biking, and hosting living-room concerts.

    Murphy entered the race centering public safety and government transparency. He
    led a months-long investigation alleging discrepancies between DC and FBI crime
    reporting and was the first to publicly claim, in June 2025, that MPD was
    manipulating violent-crime statistics — pressing the Council to conduct oversight
    it had avoided. He argues the city has given residents a dishonest picture of its
    safety challenges and that trust cannot be rebuilt without transparency.

    His platform calls for honest crime data aligned with FBI reporting, rebuilding
    an MPD at a 50-year staffing low while holding leadership accountable, and youth
    accountability paired with opportunity — including overhauling the Youth
    Rehabilitation Act, fixing truancy systems, and creating a DC Service & Career
    Corps modeled on Maryland programs. He proposes a "120-day shot clock" for
    office-to-residential conversions and faster permitting to unlock housing supply,
    a two-track compensation model on Initiative 82, and fully funding the open
    primaries and ranked-choice voting that voters approved in Initiative 83, along
    with term limits. He has been endorsed by former Ward 6 ANC commissioner and
    victims' rights advocate Denise Rucker Krepp.
