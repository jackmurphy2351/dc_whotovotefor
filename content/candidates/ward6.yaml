  short_bio: >
    Three-decade Ward 6 resident, former ANC commissioner (ANC6A), and interim CEO
    of Philanthropy DMV. A community economic development strategist who has helped
    nearly 1,000 DC small businesses access capital and led the DC Commission on the
    Arts and Humanities. Running on public safety, affordability, strong small
    businesses and schools, and a more responsive city government. Would rebuild MPD
    to full staffing while expanding youth workforce and violence-prevention programs.
  long_bio: |
    Gloria Nauden has lived in Ward 6 for more than 30 years, raising her family,
    building her career, and serving as an Advisory Neighborhood Commissioner
    (ANC6A-02) representing the Capitol Hill side of H Street. The daughter of a
    decorated African American U.S. Army veteran and a Korean mother who together
    built nearly a dozen small businesses, she grew up working in the family's
    restaurants and car wash.

    Nauden began her career at Black Entertainment Television during its startup
    years and later led the DC Commission on the Arts and Humanities, where she
    expanded funding access to the arts by 77% and created Art All Night. As Vice
    President at City First Bank — a leading national Community Development Financial
    Institution — she helped drive asset growth and expand capital access for local
    businesses, and led the bank's transformation into the first certified B
    Corporation bank in the United States. She currently serves as interim CEO of
    Philanthropy DMV and runs the DC Community Development Consortium Institute. Over
    her career she has helped nearly 1,000 DC small businesses secure capital, grants,
    and back-office support.

    Her campaign — built around the principle "Listen. Collaborate. Deliver." —
    focuses on safer communities, affordability, strong small businesses and schools,
    and a city government that follows through. On public safety she calls for a fully
    staffed Metropolitan Police Department paired with prevention, opportunity, and
    clear consequences. In response to recent "teen takeover" incidents she launched
    Spring Break Community Service Week, connecting students with workforce exposure,
    civic engagement, and service. She has criticized incumbent Charles Allen for what
    she describes as limited engagement with Ward 6 organizers outside Capitol Hill.
