  short_bio: >
    Three-term incumbent Ward 6 Councilmember and former chair of the Council's
    Committee on the Judiciary and Public Safety. Authored the STEER Act to hold
    dangerous out-of-state drivers accountable, created the Books From Birth early
    literacy program and the District's Fair Elections public-financing program,
    led DC's rescue of WMATA from a fiscal cliff, and co-architected the 2021
    Hearts and Homes budget amendment funded by a tax increase on high earners. A
    progressive who survived a 2024 recall effort, he is endorsed by the Sierra
    Club, Jews United for Justice, Greater Greater Washington, and major unions.
  long_bio: |
    Charles Allen has represented Ward 6 on the DC Council since 2015 and is seeking
    a fourth term. Over three terms he has built a record as one of the Council's
    most active legislators. His first bill created Books From Birth, which has sent
    more than 3.6 million books to over 103,000 DC children in partnership with Dolly
    Parton's Imagination Library. As chair of the Committee on the Judiciary and
    Public Safety, he guided creation of the District's Fair Elections program in
    2019, which matches small-dollar contributions from DC residents 5-to-1 so
    candidates can run without corporate or PAC money.

    Allen authored the STEER Act, a first-in-the-nation law giving the Attorney
    General authority to sue dangerous drivers regardless of what state their car is
    registered in and allowing DMV to install speed governors on the cars of repeat
    offenders. He helped steer DC, Maryland, and Virginia to a new WMATA funding
    formula that averted dramatic Metro service cuts, and he was one of three
    architects of the 2021 Hearts and Homes Amendment, which expanded childcare
    funding, doubled the Earned Income Tax Credit, and funded more than 1,000 housing
    vouchers — paid for with a modest tax increase on residents earning more than
    $250,000. He also wrote the law empowering MPD and the Alcoholic Beverage and
    Cannabis Administration to shut down unlicensed cannabis shops, and the Safe at
    Home program that funds home modifications so seniors can age in place.

    Allen describes his approach to public safety as "both / and" — pairing strong
    laws and accountability with investments in violence prevention and second
    chances. He was a consistent critic of public financing for a new Commanders
    stadium at RFK, though he ultimately voted for the deal after securing changes.
    Concerns from critics that he was "soft on crime" during his time chairing the
    judiciary committee prompted an unsuccessful 2024 effort to recall him from
    office. He has been endorsed by a broad coalition of progressive groups, unions,
    and the DC Association of Realtors.
