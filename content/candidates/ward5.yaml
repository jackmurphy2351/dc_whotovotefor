# Ward 5 Councilmember candidates — 2026 DC Democratic Primary
# Three Democrats are on the primary ballot.
# Incumbent: Zachary Parker (elected 2022)
# Source: https://ballotpedia.org/City_elections_in_Washington,_D.C._(2026)

- id: zachary-parker
  name: "Zachary Parker"
  election_slug: ward5
  in_fair_elections: false
  campaign_url: https://www.zacharyparker2026.com/
  endorsements: []
  short_bio: >
    Incumbent Ward 5 Councilmember and the first Black openly gay Council member in
    DC history. Former 7th-grade math teacher and DC State Board of Education President
    (2021). Delivered the District Child Tax Credit ($1,000 per child under 18),
    helped produce a 35% drop in violent crime, chairs the Committee on Youth Affairs,
    and secured additional labor protections in the Commanders stadium deal.
  long_bio: |
    Zachary Parker is an educator, public servant, and transformative leader dedicated
    to building communities where all residents can thrive. He earned a Bachelor of
    Science from Northwestern University and a Master of Arts from Columbia University,
    Teachers College, and began his career as a 7th-grade math teacher before spending
    nearly a decade supporting DC school leaders to improve student learning.

    In 2018, Ward 5 residents elected Zach to the DC State Board of Education, where he
    was unanimously chosen as President in 2021. In 2022, Ward 5 neighbors elected him
    to the DC Council, where he serves as the only openly gay member and the first Black
    openly gay member in Council history.

    Parker is considered a progressive member of the Council, though not dogmatically so.
    In his first term he developed and funded the District Child Tax Credit, making DC the
    first city in the nation to provide a local child tax credit of $1,000 per child under
    18 — projected to cut childhood poverty by about 25%. He secured additional labor
    protections and benefits in the Commanders stadium deal at RFK. He contributed to a
    35% drop in violent crime in Ward 5 from 2023 to 2024 (the steepest decline in the
    city) and an approximate 15% drop in 2025. As Chair of the Committee on Youth Affairs,
    he passed and funded the Child Behavioral Health Services Dashboard, passed the School
    Improvement Amendment Act, and introduced the 16-bill C.A.R.E. for Youth Plan
    addressing everything from higher pay for summer jobs to reducing truancy. He secured
    $1 million for the DC LGBTQ+ Center, established two new parks in Lamond-Riggs and
    Carver-Langston, advanced the Fort Lincoln Recreation Center, and secured nearly
    $500,000 in grants to support small businesses along Rhode Island Avenue. He is a
    proud member of Alpha Phi Alpha Fraternity, Incorporated.
  advisories: []
