- id: bridget-french
  name: "Bridget French"
  election_slug: ward5
  in_fair_elections: false
  campaign_url: https://www.frenchforfive.com/
  endorsements: []
  short_bio: >
    Twenty-year DC resident and clean energy policy professional who helped launch DC's
    first energy programs through the DC Sustainable Energy Utility. Announced March
    2026. Focuses on lowering residents' monthly bills (especially utility costs),
    making it easier to open and run small businesses, and improving government services
    for families. "We don't need more programs — we need the ones we already fund to
    actually work together."
  long_bio: |
    Bridget French (age 42) has called DC home for nearly 20 years. She grew up in a
    working-class family in Fort Lauderdale, where her parents ran a small business.
    After college she served as a Peace Corps Volunteer in Honduras, working with
    communities to protect natural resources and support sustainable economic
    opportunities.

    Early in her career, she worked on some of DC's first energy programs through the
    DC Sustainable Energy Utility, helping launch initiatives that reduced costs for
    residents and businesses across the city. Today she works with decision-makers
    across the country to advance practical, cost-effective energy solutions, with a
    focus on lowering costs and improving people's lives through good energy policy.
    She and her husband live in Ward 5 with their two rescue dogs.

    Her platform centers on three themes: lowering everyday costs (with a particular
    emphasis on utility bills), making DC's programs for young people and families
    actually work together through improved coordination and accountability across
    agencies ("We don't need more programs — we need the ones we already fund to actually
    work together"), and helping Ward 5 small businesses stay open, grow, and hire
    locally.
