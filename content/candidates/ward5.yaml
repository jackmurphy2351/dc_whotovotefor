- id: bernita-carmichael
  name: "Bernita Carmichael"
  election_slug: ward5
  in_fair_elections: true
  campaign_url: https://carmichael2026.com/
  endorsements: []
  short_bio: >
    Washington, DC native, Enterprise Risk Management professional, and senior DC
    Democratic Party member. Proposing her "Future of Ward 5 Legislation" package:
    higher CBA standards for developers, commercial corridor revitalization, and
    workforce development. Wants to build 36,000 housing units per year citywide
    (20,000 affordable). Participates in DC Fair Elections small-donor matching.
  long_bio: |
    Bernita Carmichael is a proud Washington, DC native. Born at Walter Reed Army
    Medical Center in Ward 4 and raised in Brightwood and Riggs Park, she is a graduate
    of Phelps High School and the University of the District of Columbia. As the daughter
    of a Gulf War Army Medic, she learned the value of community service early.

    With over 15 years of experience in DC government, she secured the first accreditation
    for the DC Department of Corrections under the DC Jail Improvement Act of 2004 and
    enhanced emergency response capabilities for DC Child Care Centers at OSSE. She holds
    credentials as a pro-board fire inspector and a general industry occupational safety
    and health trainer.

    A civic leader, Carmichael currently serves as a DC Democratic Party Committeewoman
    and member of the Ward 5 Leadership Council. She organized the National Federation of
    Democratic Women's virtual conference during COVID-19, served as an At-Large Delegate
    for President Biden in 2020, and mobilized five charter buses from Ward 5 in support
    of Vice President Kamala Harris in 2024. She is also an active member of the Junior
    League of Washington.

    Her campaign participates in the DC Fair Elections program, where contributions from
    DC donors are matched 5-to-1. Her centerpiece proposal is the "Future of Ward 5
    Legislation," a package of bills that would increase standards for Community Benefits
    Agreements negotiated between developers and residents when large projects are built,
    spur revitalization of Ward 5's commercial corridors, and provide more workforce
    development and job opportunities for native Washingtonians. On housing, she has set
    an ambitious goal of building 36,000 units per year citywide, with 20,000 of them for
    low- and moderate-income residents. (For context, Mayor Bowser built roughly 36,000
    units over five years.) Her other priorities include increasing affordable homeownership,
    senior advocacy, and strengthening Ward 5's local and global business ecosystem.
  advisories: []
