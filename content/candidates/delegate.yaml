- id: kinney-zalesne
  name: "Kinney Zalesne"
  election_slug: delegate
  in_fair_elections: false  # TODO: verify
  campaign_url: https://www.kinneyfordc.com/about
  endorsements: []
  short_bio: >
    President of Peer Forward (formerly College Summit); former legal counsel to
    Janet Reno. Has lived in DC for 30 years.
  long_bio: |
    Kinney Zalesne (age 59) is President of Peer Forward (formerly College Summit),
    a nonprofit that helps DC students access higher education. In the 1990s she
    served as legal counsel to Attorney General Janet Reno and worked with Vice
    President Al Gore. She has also worked for Microsoft and has done fundraising
    for the DNC. A 30-year DC resident, she emphasizes coalition building. If
    elected, she would convene a "statehood summit" to develop a concrete plan for
    DC statehood.
  advisories: []
