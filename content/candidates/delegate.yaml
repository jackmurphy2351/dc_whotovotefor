  positions:
    - question_id: statehood_top_priority
      stance: 1
      quote: "America is the only democracy on earth that denies the residents of its capital city the right to vote. It's a national disgrace, and part of the legacy of racism."
      explanation: "Calls DC's lack of voting representation 'a national disgrace and part of the legacy of racism,' but argues that fixing it requires a strategic 'grand bargain' on Capitol Hill — not outrage. Distinguishes herself from other candidates by emphasizing coalition-building across sectors and the aisle as the path to full representation. Proposes a Capital Caucus to build regional economic leverage with DC, MD, VA, and neighboring jurisdictions. In her DC for Democracy questionnaire she casts the Delegate as 'DC's defender and advocate inside the federal government,' stressing that even 'without a floor vote' the office has 'real influence — access to committees, appropriators, and decision-makers' that 'must be used strategically and relentlessly.'"
      sources:
        - url: https://www.kinneyfordc.com/issues-1
          title: "Issues — Kinney Zalesne for DC Delegate"
          publisher: "Kinney Zalesne Campaign"
          accessed: 2026-05-28
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 Delegate Candidate Questionnaire — Kinney Zalesne"
          publisher: "DC for Democracy"
          accessed: 2026-06-15

    - question_id: statehood_strategy_bipartisan
      stance: 2
      quote: "fixing this will take more than indignance and outrage."
      explanation: "Explicitly the 'grand bargain' candidate: 'fixing this will take more than indignance and outrage. It will require a strategic approach to a grand bargain on Capitol Hill… Throughout my career I've built coalitions across sectors and across the aisle.' Frames bipartisan coalition-building as her signature path to statehood. Her DC for Democracy questionnaire details the approach — pursuing 'things Republicans want that can be part of a larger compromise package that secures DC statehood,' engaging members who care about 'voting rights, democratic representation, racial justice,' and leveraging her party network as a former DNC Deputy National Finance Chair and Co-Chair of Women for Kamala Harris."
      sources:
        - url: https://www.kinneyfordc.com/issues-1
          title: "Issues — Kinney Zalesne for DC Delegate"
          publisher: "Kinney Zalesne Campaign"
          accessed: 2026-05-30
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 Delegate Candidate Questionnaire — Kinney Zalesne"
          publisher: "DC for Democracy"
          accessed: 2026-06-15

    - question_id: mpd_ice_cooperation
      stance: 1
      explanation: "In her DC for Democracy questionnaire she recounts convening 'a forum with immigrant workers, labor leaders, and advocates' over ICE–MPD coordination to hear how 'federal enforcement partnerships were affecting safety, stability, and trust,' and pledges to oppose 'enforcement practices that bypass local authority,' making clear that 'using crime or immigration as a pretext for federal interference in DC's governance is unacceptable.' Frames the response regionally — through her proposed DC–Maryland–Virginia 'Capital Caucus' — rather than as an explicit MPD sanctuary mandate."
      sources:
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 Delegate Candidate Questionnaire — Kinney Zalesne"
          publisher: "DC for Democracy"
          accessed: 2026-06-15

    # Positions below mined from the May 14, 2026 Hill Rag / East of the River forum.
    - question_id: federal_workers_advocate
      stance: 2
      explanation: "Casts protecting the federal workforce as a founding reason for her campaign — 'Trump is crushing this city on purpose' — and points to her DOJ record beating back Republican efforts to kill crime-prevention and after-school programs. Frames rebuilding DC's economy to be 'less dependent on the federal government' as the complement to defending federal workers now under attack."
      sources:
        - url: https://www.youtube.com/watch?v=5eogeLK6tY8
          title: "Hill Rag / East of the River DC Delegate candidate forum (May 14, 2026)"
          publisher: "WJLA / Hill Rag"
          accessed: 2026-06-04

    - question_id: delegate_budget_autonomy
      stance: 2
      explanation: "Calls Congress's roughly $1 billion budget freeze 'a huge failure' that happened because 'nobody was paying attention — not our delegate, not our DC Council,' and argues the seat 'cannot just be reactive.' Pledges proactive, strategic vigilance to ensure DC controls 'its own revenue and its own destiny,' citing the beaten-back Medicaid-match cut as the model. Her DC for Democracy questionnaire calls protecting Home Rule and DC autonomy her '#1 priority,' arguing the Delegate's job is to 'raise the cost' of federal interference by making it 'visible, contested, and politically inconvenient' and by 'creating consequences behind the scenes — pressing leadership, engaging appropriators, and mobilizing allies when interference is brewing, not after it happens.'"
      sources:
        - url: https://www.youtube.com/watch?v=5eogeLK6tY8
          title: "Hill Rag / East of the River DC Delegate candidate forum (May 14, 2026)"
          publisher: "WJLA / Hill Rag"
          accessed: 2026-06-04
        - url: https://www.dcfordemocracy.org/endorsements
          title: "DC for Democracy 2026 Delegate Candidate Questionnaire — Kinney Zalesne"
          publisher: "DC for Democracy"
          accessed: 2026-06-15

    - question_id: delegate_federal_land_transfer
      stance: 1
      explanation: "Supports federal land transfers as 'a very important part of DC's economic growth' and wants DC to 'take advantage' of upcoming opportunities from vacated federal buildings — but qualifies that transfers are 'not the sum and substance' of an economic-growth plan, which she ties more to building a homegrown tech scene and recruiting major employers."
      sources:
        - url: https://www.youtube.com/watch?v=5eogeLK6tY8
          title: "Hill Rag / East of the River DC Delegate candidate forum (May 14, 2026)"
          publisher: "WJLA / Hill Rag"
          accessed: 2026-06-04

    - question_id: econ_commuter_tax
      stance: 2
      explanation: "The forum's strongest commuter-tax proponent: reframes the 'third rail' as a reciprocal 'shared asset fund' — non-residents who work in DC (and DC residents who work in MD/VA) pay in, with the revenue earmarked for shared regional needs like Metro, roads, healthcare, and the environment. Pairs it with her proposed regional 'Capital Caucus.'"
      sources:
        - url: https://www.youtube.com/watch?v=5eogeLK6tY8
          title: "Hill Rag / East of the River DC Delegate candidate forum (May 14, 2026)"
          publisher: "WJLA / Hill Rag"
          accessed: 2026-06-04

