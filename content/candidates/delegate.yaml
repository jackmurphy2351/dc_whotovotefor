  short_bio: >
    30-year DC resident; came to DC in 1995 as a White House Fellow (VP Gore).
    Former ADA (Philadelphia), DOJ Counsel to AG Janet Reno, Microsoft executive
    (GM Corporate Strategy; GM Responsible Growth), president of College Summit
    / Peer Forward, DNC Deputy National Finance Chair, National Co-Chair of
    Women for Harris. Bestselling co-author of "Microtrends." Endorsed by
    former AG Eric Holder, former Sec. Navy Carlos Del Toro, and three Members
    of Congress. Proposes a strategic "grand bargain" on statehood and a
    regional Capital Caucus.
  long_bio: |
    Kinney Zalesne (age 59) came to DC in 1995 for what was supposed to be a
    short stint in the Clinton White House. She fell in love with the city and
    has raised four children here with her husband Scott, serving in leadership
    roles in DC's schools, pools, parks, and nonprofits for 30 years.

    Her career spans government, business, and the nonprofit sector. She served
    as Assistant District Attorney in Philadelphia before becoming a White House
    Fellow with Vice President Gore. She then served as Counsel to Attorney
    General Janet Reno at the Department of Justice — a tenure she credits with
    the largest drop in crime in recorded US history through prevention,
    community engagement, and rehabilitation alongside tough enforcement. She
    later joined Microsoft as GM of Corporate Strategy and GM of Responsible
    Growth, and co-authored the bestselling book "Microtrends." She also served
    as Deputy National Finance Chair of the DNC and National Co-Chair of Women
    for Harris.

    Of all those roles, she calls her work at College Summit (now Peer Forward)
    her favorite. She left DOJ to help Co-Founder J.B. Schramm scale the
    program — originally started in an Adams Morgan basement to help low-income
    students reach college — growing its budget 20-fold and expanding it from a
    local effort to a national operation. Under her leadership the organization
    also helped change federal law to require high schools be measured on college
    enrollment and persistence, not just graduation. She also served as Board
    Chair of a Ward 4 school that doubled in enrollment during her tenure.

    On statehood, she calls DC's lack of voting representation "a national
    disgrace and part of the legacy of racism," but argues that fixing it
    requires a strategic "grand bargain" on Capitol Hill rather than outrage —
    coalition-building across sectors and the aisle being her signature skill.
    She proposes creating a Capital Caucus in Congress to build economic power
    regionally with MD, VA, and neighboring jurisdictions. On public safety she
    draws on her Reno experience: robust funding for evidence-based practices,
    gun reform, prevention, and rehabilitation. On technology, she draws on her
    Microsoft and Harvard democracy-and-technology work to advocate for AI
    policy that supports innovation while ensuring technology works for people.
