- id: kinney-zalesne
  name: "Kinney Zalesne"
  election_slug: delegate
  in_fair_elections: false  # TODO: verify
  campaign_url: https://www.kinneyfordc.com/about
  endorsements: []
  short_bio: >
    President of Peer Forward (formerly College Summit); former legal counsel to
    Janet Reno. Proposes a "grand bargain" approach to statehood and a Capital
    Caucus with neighboring jurisdictions.
  long_bio: |
    Kinney Zalesne (age 59) is President of Peer Forward (formerly College Summit),
    a nonprofit that helps DC students access higher education. In the 1990s she
    served as legal counsel to Attorney General Janet Reno and worked with Vice
    President Al Gore. She has also worked for Microsoft and has done fundraising
    for the DNC. A 30-year DC resident, she calls DC's lack of voting representation
    "a national disgrace and part of the legacy of racism." Rather than relying on
    outrage, she proposes pursuing a strategic "grand bargain" on Capitol Hill using
    her coalition-building background. She also proposes creating a Capital Caucus
    in Congress to leverage DC, Maryland, Virginia, and neighboring jurisdictions as
    an economic and policy unit — coordinating on healthcare, transportation,
    housing, and infrastructure.
  advisories: []
  sources:
