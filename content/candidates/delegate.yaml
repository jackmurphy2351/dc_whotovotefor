- id: greg-jaczko
  name: "Greg Jaczko"
  election_slug: delegate
  in_fair_elections: false  # TODO: verify
  campaign_url: null  # TODO: add campaign URL
  endorsements: []
  short_bio: >
    Physicist and renewable energy consultant. Proposes exempting DC from federal
    taxes as an alternative to statehood.
  long_bio: |
    Greg Jaczko (age 55) is a physicist who runs a renewable energy consultancy.
    He pledges to fight for federal workers. Rather than prioritizing statehood,
    his signature proposal is to exempt DC residents from federal income taxes —
    similar to the treatment of U.S. territories like Puerto Rico — on the grounds
    that "no taxation without representation" demands relief until DC has full
    voting rights.
  advisories: []
  sources:
    - url: https://51st.news/dc-delegate-race-white-pinto-zalesne-holbrook-jaczko/
      title: "Meet the candidates running to be D.C.'s delegate to Congress — The 51st"
      publisher: "The 51st"
      accessed: 2026-05-27
