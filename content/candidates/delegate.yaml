      explanation: "Frames DC's lack of control over its own revenue and budget as central to the injustice of its status: 'Congress constantly seeks to undermine and oversee our local budget,' and he will be 'a relentless voice against congressional — and presidential — interference, demanding that DC residents control their own revenue and their own destiny.'"
