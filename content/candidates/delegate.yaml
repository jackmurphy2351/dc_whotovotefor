  short_bio: >
    Ward 2 Councilmember; chair of Judiciary and Public Safety
    committee. Cornell and Georgetown Law graduate; former DC OAG attorney. Led
    Secure DC and Peace DC bills (50% violent crime drop); authored RECOVERY Act
    (Downtown commercial-to-residential conversions). Detailed housing plan
    ("Breaking Ground DC"). Did not participate in DC Fair Elections Program;
    raised more than any other delegate candidate.
  long_bio: |
    Brooke Pinto (age 33) graduated from Cornell University's School of Hotel
    Administration and Georgetown University Law Center. She worked at the DC
    Office of the Attorney General as Assistant AG for Policy and Legislative
    Affairs and in the Tax and Finance Section before running for DC Council.
    She had never lived in DC before 2020, the year she was elected as the Ward
    2 Councilmember representing. She chairs the Committee on
    Judiciary and Public Safety.

    Her council record spans public safety, Downtown recovery, and education. She
    co-authored Secure DC and Peace DC, which she credits with a 50% reduction in
    violent crime (the bills also increased penalties for gun crimes, expanded
    pre-trial detention, and introduced teen curfews). She authored the RECOVERY
    Act to incentivize commercial-to-residential conversions Downtown following
    COVID, sparking thousands of new units. She passed legislation training
    teachers in literacy instruction and a cellphone ban in DC schools.

    She chose not to participate in the DC Fair Elections Program, enabling her
    to accept large contributions from out-of-district donors; she raised more
    money than any other delegate candidate.

    In the delegate race she emphasizes statehood and DC self-governance, opposing
    the Trump administration's encroachment, and supports adequate resources for
    MPD, firefighters, and EMS while opposing federal or National Guard deployment
    to enforce local law. Her housing plan, "Breaking Ground DC," calls for
    repealing the federal Height Act and replacing it with a local DC Height Act;
    upzoning near Metro stations and bus corridors; legalizing rowhouses and ADUs
    citywide; streamlining permitting; reforming DCHA; first-time homebuyer
    property-tax abatements for long-term DC residents; and at the federal level,
    making rent (up to $15,000/year) tax-deductible, expanding Opportunity Zones,
    frontloading tax deductions on rental construction, and shifting homelessness
    housing to a non-congregate model like the Aston.
