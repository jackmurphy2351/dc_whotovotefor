- id: greg-jaczko
  name: "Greg Jaczko"
  election_slug: delegate
  in_fair_elections: false
  campaign_url: https://gojaczko4dc.com
  endorsements: []
  short_bio: >
    Physicist; AAAS fellow in Ed Markey's office; senior advisor to Senate
    Majority Leader Harry Reid; NRC chair under Obama (led Fukushima response);
    renewable energy developer; Princeton Lecturer. 27-year DC resident, son of
    an immigrant. Proposes "No Taxation UNTIL Representation" and a public power
    authority to cut utility costs.
  long_bio: |
    Greg Jaczko (age 55) is a physicist and 27-year DC resident. He earned a
    PhD in physics and moved to DC where an AAAS science policy fellowship placed
    him in then-Congressman Ed Markey's office, applying science to policy. He
    went on to serve as senior advisor to Senate Majority Leader Harry Reid, where
    he learned the art of coalition building. President Obama appointed him to
    chair the Nuclear Regulatory Commission (NRC) — a $1 billion agency with
    nearly 4,000 employees — where he stood up to powerful industries and led the
    international response to the Fukushima nuclear accident. After the NRC, he
    has developed offshore wind and solar projects and is a Lecturer at Princeton
    University. He is the son of an immigrant: his father was a Romanian-born
    refugee who spent his childhood in displaced persons camps before relocating
    to Venezuela and later emigrating to the United States.

    Jaczko supports full DC statehood ("Statehood Now") while also proposing to
    exempt DC residents and businesses from federal income taxes until statehood
    is achieved — framing it as "No Taxation UNTIL Representation." His Substack
    newsletter, "Naturally," goes further, calling for DC residents to withhold
    federal income taxes as an act of civil disobedience until Congress acts.

    On energy, he has detailed proposals to cut DC utility bills: (1) transition
    to a nonprofit public power authority — which he calculates would eliminate
    roughly $160M/year in Pepco profit ratepayers currently fund; (2) require
    data centers to bear the full infrastructure costs they create (data-center
    demand drove an 833% spike in PJM capacity prices for 2025–2026); (3) fix
    DC's rooftop solar SREC system, which he argues creates a regressive subsidy
    — 95% of ratepayers subsidizing the 5% who have solar — and projects a costly
    SREC undersupply in 2026. He supports progressive electricity rates so
    lower-income households pay less. On justice, he wants to get the federal
    government out of DC's local justice system. On immigration, he strongly
    opposes the Trump administration's detention policies — connecting them
    personally to his father's refugee experience — and calls for a humane
    immigration policy. He has also publicly opposed Trump's unilateral military
    strikes against Iran as unconstitutional, calling on Congress to deny the
    president war-making authority without a formal declaration.
  advisories: []
  sources:
