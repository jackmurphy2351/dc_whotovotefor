- id: greg-jaczko
  name: "Greg Jaczko"
  election_slug: delegate
  in_fair_elections: false  # TODO: verify
  campaign_url: https://gojaczko4dc.com
  endorsements: []
  short_bio: >
    Physicist and former NRC chair who ran a federal agency. Supports full
    statehood; proposes federal tax exemption for DC residents as an interim
    measure until statehood is won.
  long_bio: |
    Greg Jaczko (age 55) is a physicist who runs a renewable energy consultancy
    and previously chaired the Nuclear Regulatory Commission. He supports full DC
    statehood ("Statehood Now") while also proposing to exempt DC residents and
    businesses from federal income taxes until statehood is achieved — framing it
    as "No Taxation UNTIL Representation." He pledges to fight reckless cuts to
    the federal workforce and restore jobs and dignity for mistreated federal
    workers, drawing on his experience running a federal agency. On energy, he
    supports a public power transition to address utility costs, wants to rein in
    data-center expansion that strains local infrastructure, and would invest in
    renewables and energy storage to lower bills. On justice, he wants to get the
    federal government out of DC's local justice system so that residents can
    shape policies focused on prevention and rehabilitation.
  advisories: []
  sources:
    - url: https://gojaczko4dc.com/platform
      title: "Platform — Greg Jaczko for Congress"
      publisher: "Greg Jaczko Campaign"
      accessed: 2026-05-28
    - url: https://51st.news/dc-delegate-race-white-pinto-zalesne-holbrook-jaczko/
      title: "Meet the candidates running to be D.C.'s delegate to Congress — The 51st"
      publisher: "The 51st"
      accessed: 2026-05-27
  positions:
    - question_id: statehood_top_priority
      stance: 2
      explanation: "Supports full statehood as a top priority ('Statehood Now'); frames tax exemption as an interim 'No Taxation UNTIL Representation' measure, not a replacement for statehood."
      sources:
        - url: https://gojaczko4dc.com/platform
          title: "Platform — Greg Jaczko for Congress"
          publisher: "Greg Jaczko Campaign"
          accessed: 2026-05-28

    - question_id: statehood_tax_exemption
      stance: 2
      explanation: "Explicitly proposes exempting DC residents and businesses from federal income taxes until statehood is achieved."
      sources:
        - url: https://gojaczko4dc.com/platform
