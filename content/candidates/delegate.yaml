  short_bio: >
    Current DC At-Large Councilmember; chairs housing committee since 2023.
    5th-generation Washingtonian (Petworth); former legislative counsel to Delegate
    Norton (2008) and first OAG Director of Community Outreach (2015). Endorsed by
    Free DC, WFP, AFL-CIO, CBC PAC, and Sen. Elizabeth Warren.
  long_bio: |
    Robert White (age 44) is a 5th-generation Washingtonian who grew up in the
    Petworth neighborhood. He graduated from Archbishop Carroll High School,
    earned degrees in Philosophy and Political Science from St. Mary's College of
    Maryland, completed additional studies at Oxford University and in The Gambia,
    West Africa, and earned his law degree from American University Washington
    College of Law.

    In 2008, White went to Congress to serve as Legislative Counsel to Delegate
    Eleanor Holmes Norton, where he played a lead role in drafting legislation to
    loosen Congress' grip over DC government and conducted oversight hearings
    focused on the District. In 2015, he was tapped by Attorney General Karl Racine
    to serve as the first Director of Community Outreach for the DC Office of the
    Attorney General, designing a community engagement strategy focused on the
    city's most vulnerable residents.

    He is the only Black candidate in the delegate race. First elected to DC Council
    in 2016 — defeating an incumbent with the highest vote total in DC Council
    history — he was re-elected in 2020 and 2024 and has chaired the Council's
    Committee on Housing since 2023. He is also an adjunct professor at Georgetown
    University Law Center, teaching voting rights and felony disenfranchisement. If
    elected Delegate, he says he'd seek a seat on the House Appropriations Committee
    to maximize DC's funding leverage. He has also proposed removing federal taxes on
    profits from businesses that relocate to DC as an economic development incentive.
    He is endorsed by Free DC, the Working Families Party, the AFL-CIO, the
    Congressional Black PAC, and Senator Elizabeth Warren.
