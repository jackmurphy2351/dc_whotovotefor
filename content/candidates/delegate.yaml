      quote: "Washington is the perfect place for a public power authority."
      explanation: "His signature cost-of-living proposal: 'Washington is the perfect place for a public power authority.' As a physicist and former NRC chair, he argues a nonprofit public power authority would eliminate roughly $160M/year in Pepco profit that ratepayers fund (about $25 of an average $190 bill), citing studies that public power customers pay ~13% less. Would introduce legislation requiring the buyout to complete within 18 months at residual value."
      sources:
        - url: https://gojaczko4dc.com/platform
          title: "Platform — Greg Jaczko for Congress"
          publisher: "Greg Jaczko Campaign"
