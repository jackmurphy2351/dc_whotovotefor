      title: "Platform — Greg Jaczko for Congress"
      publisher: "Greg Jaczko Campaign"
      accessed: 2026-05-28
    - url: https://gojaczko4dc.com
      title: "Greg Jaczko for Congress — Campaign Website"
      publisher: "Greg Jaczko Campaign"
