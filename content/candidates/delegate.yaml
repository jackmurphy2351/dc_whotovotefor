      stance: 2
      quote: "D.C. Statehood is no longer just a goal—it is necessary for the survival of our self-government."
      explanation: "Supports full statehood as top priority ('Statehood Now'); frames tax exemption as an interim 'No Taxation UNTIL Representation' measure, not a replacement for statehood. Frames DC's federal territory status as an ongoing democratic injustice tracing back to the founding."
      sources:
        - url: https://gojaczko4dc.com/platform
          title: "Platform — Greg Jaczko for Congress"
          publisher: "Greg Jaczko Campaign"
          accessed: 2026-05-28

    - question_id: statehood_tax_exemption
      stance: 2
      quote: "Greg will fight to exempt DC residents and business from paying federal income taxes."
      explanation: "Proposes exempting DC residents and businesses from federal income taxes until statehood is achieved, framing it as 'No Taxation UNTIL Representation.' His Substack goes further, calling for civil disobedience — DC businesses and residents withholding federal income tax payments — to force Congress to act."
      sources:
        - url: https://gojaczko4dc.com/platform
          title: "Platform — Greg Jaczko for Congress"
          publisher: "Greg Jaczko Campaign"
          accessed: 2026-05-28

    - question_id: mpd_ice_cooperation
      stance: 2
      quote: "The best way I can honor his legacy is to fight for a humane immigration policy that respects the diversity and hard work that immigrants bring to our society."
      explanation: "Strongly opposes Trump's immigration detention policies, calling them 'brutal' and 'illegal' — a position he connects personally to his father's history as a Romanian refugee. Supports getting the federal government entirely out of DC's local justice system so residents can set policies focused on prevention and rehabilitation."
      sources:
        - url: https://gojaczko4dc.com/platform
          title: "Platform — Greg Jaczko for Congress"
          publisher: "Greg Jaczko Campaign"
          accessed: 2026-05-28

    - question_id: environment_public_power
