  short_bio: >
    Norton's Senior Legislative Counsel for eight years; chief strategist who took
    the DC statehood bill from a 1993 loss to passing the House twice, with a
    unanimous Democratic vote the second time. Georgetown Law, Austin College,
    and Oxford alumnus; AmeriCorps veteran.
  long_bio: |
    Trent Holbrook (age 40) served eight years on the staff of Delegate Eleanor
    Holmes Norton, most recently as Senior Legislative Counsel. As chief strategist
    on DC statehood, he took the statehood bill from losing in 1993 to passing the
    House twice — securing record support and a unanimous Democratic vote the second
    time. Earlier he worked at AmeriCorps, where he helped defend the agency from
    Congressional attempts to defund it, and served as a legal intern in the Obama
    White House Counsel's Office. He is an alumnus of Georgetown University Law
    Center, Austin College, and Oxford University.

    His platform emphasizes DC self-governance: he proposes creating a local
    prosecutor's office answerable only to DC residents, wants DC to appoint its own
    judges, and wants the DC National Guard placed under the mayor's control (as
    governors control state guards), firmly opposing its use to enforce local law.
    He supports pay raises, backpay, and retirement protection for federal workers,
    and opposes relocating federal agencies out of the National Capital Region. He
    opposes school vouchers, supports preserving and expanding the DC Tuition
    Assistance Grant (DCTAG) program, and views healthcare as a right — including
    protecting DC's Medicaid reimbursement rates and abortion access. He is
    participating in the DC Fair Elections Program.
