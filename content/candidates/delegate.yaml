# Non-Voting Delegate to Congress — 2026 DC Democratic Primary

- id: robert-white
  name: "Robert White"
  election_slug: delegate
  in_fair_elections: true
  campaign_url: https://www.joinrobertwhite.com/
  endorsements:
    - "Free DC (freedcproject.org/news/our-2026-endorsements-guide)"
    - "Working Families Party"
    - "Congressional Black Caucus"
    - "Janeese Lewis George (DC Council)"
    - "Charles Allen (DC Council)"
    - "Sen. Elizabeth Warren"
  short_bio: >
    Current DC At-Large Councilmember; chairs housing committee. Native Washingtonian;
    former legislative counsel to Norton (2008–2013). Endorsed by Free DC, WFP,
    the Congressional Black Caucus, and Sen. Elizabeth Warren.
  long_bio: |
    Robert White (age 44) is a native Washingtonian and the only Black candidate
    in the delegate race. He worked as legislative counsel to incumbent Delegate
    Eleanor Holmes Norton from 2008 to 2013. He currently serves as an At-Large
    Councilmember on DC Council, where he chairs the council's housing committee.
    If elected Delegate, he says he'd seek a seat on the House Appropriations
    Committee to bring more funding to DC. He has also proposed removing federal
    taxes on profits made in DC for businesses that relocate to the District as an
    economic incentive. He is endorsed by Free DC, the Working Families Party, the
    Congressional Black Caucus, and Senator Elizabeth Warren.
  advisories: []
  sources:
    - url: https://www.joinrobertwhite.com/
      title: "Robert White for DC Delegate — Campaign Website"
      publisher: "Robert White Campaign"
      accessed: 2026-05-27
    - url: https://static1.squarespace.com/static/677a7b9982114c23daaaeecc/t/699ce90fc2559e5d7c6a5bcc/1771890959907/Robert+White+Free+DC+Candidate+Questionnaire.pdf
      title: "Robert White — Free DC Candidate Questionnaire"
      publisher: "Free DC Project"
      accessed: 2026-05-27
  positions:
