- id: brooke-pinto
  name: "Brooke Pinto"
  election_slug: delegate
  in_fair_elections: false
  campaign_url: https://brookepintoforcongress.com
  endorsements: []
  short_bio: >
    Ward 2 Councilmember (Logan Circle). Did not participate in DC Fair Elections
    Program; raised more than any other delegate candidate, largely from out of town.
  long_bio: |
    Brooke Pinto (age 33) is the Ward 2 Councilmember representing Logan Circle.
    She had never lived in DC before 2020, the year she was elected to the Council.
    She chose not to participate in the DC Fair Elections Program, enabling her to
    accept large contributions from out-of-district donors; she raised more money
    than any other delegate candidate. As a councilmember, she co-authored the
    Secure DC and Peace DC legislation, which she credits with a 50% reduction in
    violent crime. She also increased penalties for gun crimes, expanded pre-trial
    detention, and introduced teen curfews. In the delegate race, she emphasizes
    fighting the Trump administration's encroachment on DC autonomy and supports DC
    statehood. She opposes federal military deployment in DC while supporting
    adequate resources for MPD, firefighters, and EMS. Free DC has advised voters
    not to rank her.
  advisories:
    - organization: "Free DC"
      year: 2026
      text: "Do not rank Brooke Pinto."
      source:
