- id: trent-holbrook
  name: "Trent Holbrook"
  election_slug: delegate
  in_fair_elections: true
  campaign_url: https://www.trentholbrook.com
  endorsements: []
  short_bio: >
    Eight-year staffer to incumbent Delegate Eleanor Holmes Norton; strong
    proponent of DC statehood and DC self-governance over its courts and police.
  long_bio: |
    Trent Holbrook (age 40) has worked as a staffer to incumbent Delegate Eleanor
    Holmes Norton for eight years. He is a strong proponent of DC statehood and
    is participating in the DC Fair Elections Program. His platform emphasizes DC
    self-governance: he proposes creating a local prosecutor's office answerable
    only to DC residents, wants DC to appoint its own judges, and opposes using
    the DC National Guard for local law enforcement. He supports pay raises and
    backpay for federal workers, protection of their retirement benefits, and
    opposing relocation of federal agencies out of the National Capital Region. He
    opposes school vouchers, supports preserving the DC Tuition Assistance Grant
    Program, and views healthcare as a right — including protecting DC's Medicaid
    reimbursement rates and abortion access.
  advisories: []
  sources:
