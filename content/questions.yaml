# Quiz questions for Help Me Vote DC 2026!
# Each question is a statement users agree/disagree with (-2 to +2).
#
# stance scale:  -2 strongly opposes / -1 opposes / 0 neutral / 1 supports / 2 strongly supports
# null = no known stance (excluded from scoring)

# ── HOUSING ──────────────────────────────────────────────────────────────────

- id: housing_topa_restore
  issue: tenants_rights
  prompt: "DC should restore and strengthen TOPA (the Tenant Opportunity to Purchase Act) to give tenants the right to purchase their building before it's sold to an outside buyer."
  applies_to_elections: [mayor, ward1, ward5, ward6, at_large_mcduffie, at_large_bonds]
  explanation: |
    TOPA (DC Code Title 42, Chapter 34) gives DC tenants a right of first refusal
    when their landlord wants to sell. Recent amendments narrowed its scope.
    Strengthening TOPA is a key anti-displacement tool.
  sources:
    - url: https://ota.dc.gov/page/tenant-opportunity-purchase-act-topa
      title: "Tenant Opportunity to Purchase Act (TOPA)"
      publisher: dc.gov
      accessed: 2026-05-27

- id: housing_rent_stabilization
  issue: housing
  prompt: "DC should expand rent stabilization to cover more housing, including buildings constructed after 1975."
  applies_to_elections: [mayor, ward1, ward5, ward6, at_large_mcduffie, at_large_bonds]
  explanation: |
    DC's rent stabilization law currently covers most units in buildings built
    before 1978 with 5 or more units. Expanding it would protect tens of thousands
    of additional renters, but critics argue it may discourage new construction.
  sources:
    - url: https://dhcd.dc.gov/rentcontrol
      title: "Rent Stabilization Program"
      publisher: dc.gov
      accessed: 2026-05-27

- id: housing_dopa
  issue: housing
  prompt: "DC should use the District Opportunity to Purchase Act (DOPA) to buy apartment buildings and preserve them as affordable housing."
  applies_to_elections: [mayor, ward1, at_large_mcduffie, at_large_bonds]
  explanation: |
    DOPA gives the District a right to purchase certain multifamily buildings
    when they go on the market, allowing the city to preserve affordable units
    rather than let them be converted to market-rate housing.
  sources:
    - url: https://dhcd.dc.gov/service/district-opportunity-purchase-act-dopa
      title: "District Opportunity to Purchase Act (DOPA)"
      publisher: dc.gov
      accessed: 2026-05-27

- id: housing_production_trust_fund
  issue: housing
  prompt: "DC should significantly increase the Housing Production Trust Fund — the city's primary tool for financing affordable housing."
  applies_to_elections: [mayor, ward5, ward6, at_large_mcduffie, at_large_bonds]
  explanation: |
    The Housing Production Trust Fund (HPTF) finances construction and preservation
    of affordable housing. Mayor Bowser proposed cutting the fund by 50% in her most
    recent budget. Candidates differ on whether to increase, maintain, or cut it.
  sources:
    - url: https://dhcd.dc.gov/page/housing-production-trust-fund
      title: "Housing Production Trust Fund"
      publisher: dc.gov
      accessed: 2026-05-27

- id: housing_social_model
  issue: housing
  prompt: "DC should adopt a social housing model — publicly owned, mixed-income housing."
  applies_to_elections: [mayor, ward1, at_large_mcduffie, at_large_bonds]
  explanation: |
    Social housing (as implemented in Vienna, Singapore, and Montgomery County, MD)
    uses public land and financing to build permanently affordable, mixed-income
    communities. DC currently relies primarily on subsidies to private developers.
  sources:
    - url: https://dhcd.dc.gov/page/housing-production-trust-fund
      title: "Housing Production Trust Fund — DC DHCD"
      publisher: dc.gov
      accessed: 2026-05-27

# ── TRANSIT ──────────────────────────────────────────────────────────────────

- id: transit_bike_bus_lanes
  issue: transit
  prompt: "DC should build more protected bike lanes and dedicated bus lanes."
  applies_to_elections: [mayor, ward1, ward5, ward6, at_large_mcduffie, at_large_bonds]
  explanation: |
    DC has expanded its protected bike lane network in recent years, but progress
    has been uneven. Bus lanes on corridors like Georgia Ave and 14th St could
    significantly cut commute times for thousands of riders.
  sources:
    - url: https://bikelanes.ddot.dc.gov/
      title: "Bicycle Lanes — DC Department of Transportation"
      publisher: dc.gov
      accessed: 2026-05-27

# ── MPD & ICE ────────────────────────────────────────────────────────────────

- id: mpd_ice_cooperation
  issue: mpd_ice
  prompt: "MPD should not assist ICE or other federal agencies in immigration enforcement operations within DC."
  applies_to_elections: [mayor, ward1, at_large_mcduffie, at_large_bonds, delegate]
  explanation: |
    DC has sanctuary-values policies limiting MPD cooperation with federal immigration
    enforcement. Under the Trump administration, pressure has grown on local police
    to assist ICE. Candidates differ sharply on this issue.
  sources:
    - url: https://mpdc.dc.gov/page/cooperative-agreements
      title: "MPD: Cooperative Agreements"
      publisher: dc.gov
      accessed: 2026-05-27
    - url: https://51st.news/mpd-dc-police-ice-immigration-enforcement/
      title: "Questions remain about MPD’s work with ICE. Activists want lawmakers to step in"
      publisher: "The 51st"
      accessed: 2026-05-30

# ── EDUCATION ────────────────────────────────────────────────────────────────

- id: education_community_schools
  issue: education
  prompt: "DC should expand the 'community schools' model, where schools serve as neighborhood hubs providing mental health, family support, and other services beyond education."
  applies_to_elections: [mayor, at_large_mcduffie, at_large_bonds]
  explanation: |
    Community schools provide wraparound services — mental health clinicians, social
    workers, family support programs — in addition to academic instruction. DC has a
    Community Schools Incentive Initiative through OSSE.
  sources:
    - url: https://osse.dc.gov/service/community-schools-incentive-initiative
      title: "Community Schools Incentive Initiative — OSSE"
      publisher: dc.gov
      accessed: 2026-05-27

- id: education_mental_health_schools
  issue: education
  prompt: "Every DC public school should have a dedicated behavioral health clinician on staff."
  applies_to_elections: [mayor, ward1, ward5, ward6, at_large_mcduffie, at_large_bonds]
  explanation: |
    Advocates argue that having mental health professionals in every school can
    reduce behavioral incidents, improve attendance, and provide early intervention
    before crises develop.
  sources:
    - url: https://dbh.dc.gov/service/school-behavioral-health-program
      title: "School-Based Behavioral Health Program — DBH"
      publisher: dc.gov
      accessed: 2026-05-27

# ── COMMUNITY SAFETY & VIOLENCE PREVENTION ───────────────────────────────────

- id: crime_public_health
  issue: community_safety
  prompt: "DC should treat violence as a public health problem, investing heavily in violence interruption programs and community-based solutions."
  applies_to_elections: [mayor, ward1, ward5, ward6, at_large_mcduffie, at_large_bonds]
  explanation: |
    The Neighborhood Engagement Achieves Results (NEAR) Act, passed by DC Council
    in 2016, established a public-health framework for violence reduction including
    violence interrupters, trauma-informed care, and community health workers.
  sources:
    - url: https://nearact.dc.gov/page/about-near
      title: "NEAR Act Implementation"
      publisher: dc.gov
      accessed: 2026-05-27

# ── POLICING & CRIMINAL JUSTICE ───────────────────────────────────────────────

- id: crime_secure_dc
  issue: policing
  prompt: "The 2024 Secure DC omnibus legislation — which increased penalties and expanded pre-trial detention — was the right approach to addressing DC's crime surge."
  applies_to_elections: [mayor, ward1, at_large_mcduffie, at_large_bonds]
  explanation: |
    The Secure DC Omnibus Amendment Act of 2024 increased criminal penalties,
    expanded tools for pre-trial detention, and added new offenses. It passed with
    support from across the political spectrum on DC Council, though critics called
    it ineffective or counterproductive.
  sources:
    - url: https://lims.dccouncil.gov/Legislation/B25-0345
      title: "Secure DC Omnibus Amendment Act of 2024 — DC Council LIMS"
      publisher: dccouncil.gov
      accessed: 2026-05-27

- id: crime_more_police
  issue: policing
  prompt: "Hiring significantly more MPD officers is a priority for reducing crime in DC."
  applies_to_elections: [mayor, ward1, ward5, ward6, at_large_mcduffie, at_large_bonds]
  explanation: |
    MPD has seen its officer count decline significantly below its authorized
    strength in recent years. Both major mayoral candidates support hiring more
    officers, but differ on how much to prioritize this versus other crime-reduction
    approaches.
  sources:
    - url: https://mpdc.dc.gov/page/about-mpd
      title: "About MPD — Metropolitan Police Department"
      publisher: dc.gov
      accessed: 2026-05-27

# ── YOUTH CURFEWS ────────────────────────────────────────────────────────────

- id: youth_curfew_support
  issue: youth_curfew
  prompt: "DC should enforce a curfew for minors as a tool to reduce youth crime."
  applies_to_elections: [mayor, ward1, ward5, ward6, at_large_mcduffie, at_large_bonds]
  explanation: |
    DC has had youth curfew legislation for years. Supporters argue curfews can
    reduce juvenile crime and protect young people; opponents say they criminalize
    normal youth behavior, disproportionately target Black youth, and aren't
    effective without robust alternative programming.
  sources:
    - url: https://mpdc.dc.gov/page/designated-juvenile-curfew-zones
      title: "Youth Curfew — Metropolitan Police Department"
      publisher: dc.gov
      accessed: 2026-05-27

- id: youth_curfew_programming
  issue: youth_curfew
  prompt: "Any youth curfew must be paired with substantial investment in alternative programming — jobs, recreation centers, mental health services — for young people."
  applies_to_elections: [mayor, ward1, ward5, ward6, at_large_mcduffie, at_large_bonds]
  explanation: |
    Even candidates who support curfews often argue they are only a short-term
    measure and must be accompanied by expanded out-of-school programming, extended
    rec center hours, and youth employment opportunities.
  sources:
    - url: https://dpr.dc.gov/page/teens-programs
      title: "Youth Programs — DC Department of Parks and Recreation"
      publisher: dc.gov
      accessed: 2026-05-27

# ── DC STATEHOOD (Delegate race) ─────────────────────────────────────────────

- id: statehood_top_priority
  issue: dc_statehood
  prompt: "Achieving DC statehood should be the top priority for the District's Congressional Delegate."
  applies_to_elections: [delegate]
  explanation: |
    DC residents pay federal taxes and serve in the military but have no voting
    representation in Congress. Statehood would give DC two senators and a voting
    House representative.
  sources:
    - url: https://dcboe.org/About-Us/Frequently-Asked-Questions/DC-Voting-Rights
      title: "DC Voting Rights — DC Board of Elections"
      publisher: dcboe.org
      accessed: 2026-05-27

- id: statehood_tax_exemption
  issue: dc_statehood
  prompt: "DC residents should be exempted from federal income taxes, like residents of Puerto Rico."
  applies_to_elections: [delegate]
  explanation: |
    One candidate (Greg Jaczko) proposes that, since DC residents have no voting
    representation, they should not be subject to federal income taxes — an approach
    modeled on territories like Puerto Rico. Critics argue this is a distraction
    from the statehood fight.
  sources:
    - url: https://dcboe.org/About-Us/Frequently-Asked-Questions/DC-Voting-Rights
      title: "DC Voting Rights — DC Board of Elections"
      publisher: dcboe.org
      accessed: 2026-05-27

# ── FEDERAL WORKER PROTECTIONS ───────────────────────────────────────────────

- id: federal_workers_advocate
  issue: federal_workers
  prompt: "DC should use all available legal tools — including litigation and public advocacy — to protect federal workers from mass terminations and defend federal agencies from relocation out of the District."
  applies_to_elections: [mayor, delegate]
  explanation: |
    Washington, DC has more than 160,000 federal employees. The Trump administration's
    DOGE-driven workforce reductions have resulted in mass terminations and proposals
    to relocate federal agencies. Candidates differ on how aggressively DC should respond.
  sources:
    - url: https://ocfo.dc.gov/
      title: "Office of the Chief Financial Officer — DC"
      publisher: dc.gov
      accessed: 2026-05-28

# ── ENVIRONMENT & CLEAN ENERGY ───────────────────────────────────────────────

- id: environment_renewable_energy
  issue: environment
  prompt: "DC should aggressively accelerate its transition to 100% renewable energy, installing solar on public buildings and investing in geothermal and other clean sources."
  applies_to_elections: [mayor, ward5, ward6, at_large_mcduffie, at_large_bonds, delegate]
  explanation: |
    DC has a Renewable Portfolio Standard targeting 100% renewable electricity by
    2032. Candidates differ on how proactively the District should invest public
    resources in solar, geothermal, and clean energy infrastructure beyond current
    mandates.
  sources:
    - url: https://doee.dc.gov/cleanenergydc
      title: "Renewable Energy — DC Department of Energy and Environment"
      publisher: dc.gov
      accessed: 2026-05-28

- id: environment_data_centers
  issue: environment
  prompt: "DC should place limits on new data center construction in the District."
  applies_to_elections: [mayor, at_large_mcduffie, delegate]
  explanation: |
    Northern Virginia hosts the world's largest concentration of data centers, and
    DC faces pressure to expand its own. Large data centers require massive amounts
    of electricity and water for cooling, raising concerns about grid reliability
    and environmental impact.
  sources:
    - url: https://doee.dc.gov/
      title: "DC Department of Energy and Environment"
      publisher: dc.gov
      accessed: 2026-05-28

# ── PARKS & RECREATION ───────────────────────────────────────────────────────

- id: parks_rec_funding
  issue: parks_recreation
  prompt: "DC should increase funding for the Department of Parks and Recreation, including extended rec center hours and expanded youth and senior programming."
  applies_to_elections: [mayor, ward1, ward5, ward6, at_large_mcduffie, at_large_bonds]
  explanation: |
    DC's Department of Parks and Recreation (DPR) operates 70+ facilities and
    provides youth jobs, after-school programs, senior services, and community
    programming. Budget pressures have led to reduced hours and staff at some
    facilities in recent years.
  sources:
    - url: https://dpr.dc.gov/
      title: "Department of Parks and Recreation"
      publisher: dc.gov
      accessed: 2026-05-28

# ── SANITATION & RATS ────────────────────────────────────────────────────────

- id: sanitation_rats
  issue: sanitation
  prompt: "DC should implement a comprehensive citywide rodent control program — including replacing standard trash containers with rodent-proof bins — to address the District's chronic rat infestation."
  applies_to_elections: [mayor, ward1, at_large_mcduffie, at_large_bonds]
  explanation: |
    DC consistently ranks among the most rat-infested cities in the US. Solutions
    proposed by candidates include rodent-proof steel trash containers across all
    wards, better DPW coordination, and systematic extermination programs.
  sources:
    - url: https://dchealth.dc.gov/service/rodent-and-vector-control-division
      title: "Rodent Control — DC Department of Health"
      publisher: dc.gov
      accessed: 2026-05-28

# ── HARM REDUCTION & DRUG POLICY ─────────────────────────────────────────────

- id: harm_reduction_safe_injection
  issue: harm_reduction
  prompt: "DC should open safe injection sites (overdose prevention centers) where people can use drugs under medical supervision."
  applies_to_elections: [mayor, ward1, at_large_mcduffie, at_large_bonds]
  explanation: |
    Safe injection sites (also called overdose prevention centers) allow people to
    use pre-obtained drugs under medical supervision, with staff who can intervene
    in an overdose. New York City opened the first legally sanctioned sites in the
    US in 2021. In 2023, Janeese Lewis George requested $15 million in DC's FY2024
    budget to open two such centers. DC has one of the highest overdose death rates
    among US jurisdictions.
  sources:
    - url: https://app.dccouncil.gov/
      title: "DC Council — Budget Hearing Records"
      publisher: dccouncil.gov
      accessed: 2026-05-28

# ── CHILDCARE & EARLY CHILDHOOD ──────────────────────────────────────────────

- id: childcare_universal
  issue: childcare
  prompt: "DC should expand subsidized childcare into a universal program — available to all DC residents regardless of income — building on the Pre-K Enhancement and Expansion Program (PKEEP)."
  applies_to_elections: [mayor, ward1, at_large_mcduffie, at_large_bonds]
  explanation: |
    DC's Pre-K Enhancement and Expansion Program (PKEEP) currently provides
    free, high-quality pre-K for three- and four-year-olds. Several candidates
    support expanding subsidies to cover infant and toddler care, making childcare
    universally affordable for all DC residents.
  sources:
    - url: https://osse.dc.gov/pkeep
      title: "Pre-K Enhancement and Expansion Program (PKEEP) — OSSE"
      publisher: dc.gov
      accessed: 2026-05-28

- id: childcare_birth_to_three
  issue: childcare
  prompt: "DC should guarantee free, high-quality child care from birth through age three — with no waitlists — for District families."
  applies_to_elections: [mayor, ward1, at_large_mcduffie, at_large_bonds]
  explanation: |
    The Birth-to-Three for All DC Act of 2018 set a goal of affordable infant and
    toddler care, but funding has lagged. Some candidates would guarantee free
    care from birth and eliminate the child care subsidy waitlist; others favor an
    income-based affordability cap (e.g., no family paying more than 7-10% of
    income) or targeted measures rather than a universal free guarantee.
  sources:
    - url: https://lims.dccouncil.gov/Legislation/B22-0203
      title: "Birth-to-Three for All DC Act of 2018 — DC Council LIMS"
      publisher: dccouncil.gov
      accessed: 2026-05-30

# ── TRANSIT (additional) ─────────────────────────────────────────────────────

- id: transit_fare_free_buses
  issue: transit
  prompt: "DC buses should be fare-free for all riders."
  applies_to_elections: [mayor, ward1, at_large_mcduffie, at_large_bonds]
  explanation: |
    DC's "Metro for D.C." law funds fare-free Metrobus service within the District,
    though WMATA has resisted full implementation. Candidates differ on whether
    buses should be free for everyone, free only for low-income or SNAP-enrolled
    residents, or remain fare-based with other affordability measures.
  sources:
    - url: https://lims.dccouncil.gov/Legislation/B24-0429
      title: "Metro for D.C. Amendment Act of 2022 — DC Council LIMS"
      publisher: dccouncil.gov
      accessed: 2026-05-30

- id: transit_congestion_pricing
  issue: transit
  prompt: "DC should implement congestion pricing — charging drivers to enter the busiest parts of downtown."
  applies_to_elections: [mayor, ward1, at_large_mcduffie, at_large_bonds]
  explanation: |
    DDOT has studied congestion pricing as a tool to reduce gridlock, cut emissions,
    and raise revenue for transit. Related road-pricing ideas include commuter
    tolls and higher residential parking permit fees. Candidates range from active
    supporters to those who would only study it cautiously.
  sources:
    - url: https://ddot.dc.gov/release/dc-decongestion-pricing-study-letter-and-study
      title: "Congestion Management — DC Department of Transportation"
      publisher: dc.gov
      accessed: 2026-05-30

# ── HOUSING (additional) ─────────────────────────────────────────────────────

- id: housing_upzoning
  issue: housing
  prompt: "DC should legalize apartments and 'missing-middle' housing (duplexes, triplexes, and small multifamily buildings) citywide by removing single-family-only zoning restrictions."
  applies_to_elections: [mayor, ward1, ward5, ward6, at_large_mcduffie, at_large_bonds]
  explanation: |
    DC's next Comprehensive Plan and Future Land Use Map (the dc2050 process) will
    decide how much new housing different neighborhoods must accommodate. Some
    candidates want to end exclusionary single-family zoning and allow density near
    transit corridors; others emphasize tenant protection or neighborhood character
    over upzoning.
  sources:
    - url: https://dc2050.dc.gov/
      title: "DC Comprehensive Plan (dc2050) — DC Office of Planning"
      publisher: dc.gov
      accessed: 2026-05-30

# ── POLICING (additional) ────────────────────────────────────────────────────

- id: crime_police_in_schools
  issue: policing
  prompt: "DC should keep police officers out of public schools and instead invest in counselors, social workers, and mental-health staff."
  applies_to_elections: [ward1, ward5, ward6, at_large_mcduffie, at_large_bonds]
  explanation: |
    DC's 2020 policing reform law moved to phase School Resource Officers out of
    DCPS, a change that has been debated and partly reversed amid crime concerns.
    Candidates differ on whether to invest in non-police supports — counselors and
    behavioral-health staff — or to maintain a police presence in and around schools.
  sources:
    - url: https://dccouncil.gov/police-reform-commission/
      title: "Police Reform Commission — DC Council"
      publisher: dccouncil.gov
      accessed: 2026-05-30

# ── ECONOMIC DEVELOPMENT ─────────────────────────────────────────────────────

- id: fiscal_progressive_taxation
  issue: economic_development
  prompt: "DC should raise taxes on large corporations and the wealthiest residents to close the District's budget gap."
  applies_to_elections: [mayor, ward1, ward5, ward6, at_large_mcduffie, at_large_bonds]
  explanation: |
    DC's FY2026 budget proposed deep cuts to the Housing Production Trust Fund,
    parks, and childcare programs amid a major budget shortfall. Candidates differ
    on whether to protect those programs by raising revenue from large corporations
    and high-income residents, or to hold the line on taxes and balance the budget
    through spending restraint and economic growth instead.
  sources:
    - url: https://ocfo.dc.gov/
      title: "Office of the Chief Financial Officer — DC"
      publisher: dc.gov
      accessed: 2026-05-30

- id: econ_small_business_tax_relief
  issue: economic_development
  prompt: "DC should cut taxes and fees on small and local businesses — and offer relief such as the small retailer property tax credit — to help them open, survive, and grow."
  applies_to_elections: [mayor, ward1, ward5, ward6, at_large_mcduffie, at_large_bonds]
  explanation: |
    Small businesses face high commercial rents, fees, and one of the nation's
    highest first-year failure rates. Some candidates propose cutting business taxes
    and fees and expanding credits like the Small Retailer Property Tax Credit;
    others emphasize raising revenue from large corporations or reducing red tape
    rather than tax cuts.
  sources:
    - url: https://dslbd.dc.gov/
      title: "Department of Small and Local Business Development"
      publisher: dc.gov
      accessed: 2026-05-30

# ── EDUCATION GOVERNANCE ─────────────────────────────────────────────────────

- id: education_mayoral_control
  issue: education
  prompt: "DC should end mayoral control of DC Public Schools and return authority to an elected State Board of Education."
  applies_to_elections: [mayor, ward1, at_large_mcduffie, at_large_bonds]
  explanation: |
    The Public Education Reform Amendment Act of 2007 placed DCPS under direct
    mayoral control, reducing the elected State Board of Education to a largely
    advisory role. Some candidates would return governance authority to the elected
    board; others support keeping accountability with the mayor.
  sources:
    - url: https://sboe.dc.gov/page/about-sboe
      title: "About the DC State Board of Education"
      publisher: dc.gov
      accessed: 2026-05-30

# ── ENVIRONMENT / PUBLIC POWER ───────────────────────────────────────────────

- id: environment_public_power
  issue: environment
  prompt: "DC should create a publicly owned electric utility to replace Pepco."
  applies_to_elections: [ward1, at_large_bonds, delegate]
  explanation: |
    Pepco, an investor-owned monopoly, is guaranteed a fixed rate of return and has
    raised rates repeatedly. Some candidates argue DC should move toward public
    power — a municipal utility like those serving Nebraska or many US cities, which
    tend to charge lower rates — while others favor stronger regulation of Pepco
    through the Public Service Commission rather than public ownership.
  sources:
    - url: https://opc-dc.gov/
      title: "DC Office of the People's Counsel"
      publisher: dc.gov
      accessed: 2026-05-30

# ── DC STATEHOOD (additional) ────────────────────────────────────────────────

- id: statehood_strategy_bipartisan
  issue: dc_statehood
  prompt: "DC's Delegate should pursue statehood primarily by building bipartisan coalitions and legislative deals in Congress, rather than through confrontation and protest."
  applies_to_elections: [delegate]
  explanation: |
    Candidates differ on tactics for advancing statehood. Some favor patient
    coalition-building and a "grand bargain" approach across the aisle; others argue
    that decades of that strategy have failed and call for more confrontational
    tactics — up to and including tax resistance — to force the issue.
  sources:
    - url: https://www.congress.gov/bill/118th-congress/house-bill/51
      title: "Washington, D.C. Admission Act (H.R. 51) — Congress.gov"
      publisher: congress.gov
      accessed: 2026-05-30

# ── HOME RULE & FEDERAL INTERFERENCE ─────────────────────────────────────────

- id: delegate_budget_autonomy
  issue: home_rule
  prompt: "Defending DC's budget and legislative autonomy from congressional interference should be a top priority for the District's Delegate."
  applies_to_elections: [delegate]
  explanation: |
    Under the Home Rule Act, Congress can review and overturn DC laws and interfere
    with the District's locally raised budget — as it did in cutting roughly $1
    billion from DC's budget in 2025. Candidates differ on how aggressively the
    Delegate should prioritize protecting DC's autonomy and budget from federal
    interference.
  sources:
    - url: https://dccouncil.gov/dc-home-rule/
      title: "DC Home Rule — DC Council"
      publisher: dccouncil.gov
      accessed: 2026-05-30

- id: home_rule_dc_resist
  issue: home_rule
  prompt: "DC should respond to Trump administration interference in city governance with an assertive, public stance — filing lawsuits, passing protective legislation, and refusing to comply with unlawful federal directives — rather than quiet diplomacy or pragmatic deal-making."
  applies_to_elections: [mayor, ward1, ward5, ward6, at_large_mcduffie, at_large_bonds]
  explanation: |
    Beyond MPD and immigration enforcement, the Trump administration has cut DC's
    locally raised budget, proposed takeovers of city agencies, and interfered with
    city laws. Candidates range from those who want an aggressive, confrontational
    posture — through litigation, legislation, and public advocacy — to those who
    prefer pragmatic engagement with Congress and the White House to protect DC's
    interests.
