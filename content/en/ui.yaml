# --- About page (about.html) ---
about.page_title: "About This Site"
about.what_is_title: "What is this?"
about.what_is_body: >
  is a free, open-source voter guide for Washington, DC's June 16, 2026 Democratic Primary elections. It helps you compare candidates based on the issues you actually care about, using a 5-point Likert scale.
about.sourcing_title: "How are candidate positions sourced?"
about.sourcing_p1: >
  Every candidate position must be linked directly to a primary source — the candidate's own campaign website, an official questionnaire response, or a verified news article. No position is listed without a citation. We do not editorialize about which positions are "correct."
about.sourcing_p2: >
  Where a candidate's position is unknown — because they haven't addressed an issue publicly — we mark it as "Unknown" rather than guessing or inferring.
about.advisories_title: "Endorsement advisories"
about.advisories_p1: >
  This site displays endorsement advisories (such as "Free DC: do not rank candidate X") as third-party opinions with a direct link to the source. These are not this site's own recommendations — they are factual reports of what named organizations have said.
about.methodology_title: "Methodology"
about.methodology_intro: >
  Every answer uses a 5-point scale: <em>strongly disagree</em>, <em>disagree</em>, <em>neutral</em>, <em>agree</em>, <em>strongly agree</em>. For each question you answer, we compare your position to the candidate's and look at how many steps apart they are on that scale.
about.two_things_title: "Two things you'll see, and why they can differ"
about.two_things_body: >
  Each compared question shows a <strong>label</strong> — the headline <span class="agree-pill agree-yes">Agree</span>, <span class="agree-pill agree-partial">Partial</span>, or <span class="agree-pill agree-no">Disagree</span> — and also feeds the candidate's overall <strong>match&nbsp;percentage</strong>. These measure different things, so they can disagree:
about.label_rule_lead: >
  <strong>The label is a coarse headline: which side are you on?</strong> It uses simple, intuitive rules:
about.label_rule_agree: >
  <strong>Agree</strong> — the same position.
about.label_rule_partial: >
  <strong>Partial</strong> — one step apart: you're on the <em>same side</em> and differ only in intensity (for example, <em>strongly agree</em> vs. <em>agree</em>).
about.label_rule_disagree: >
  <strong>Disagree</strong> — two or more steps apart. Opposite sides, or one of you is neutral while the other is committed, counts as disagreement — not "partial" agreement.
about.percentage_rule: >
  <strong>The percentage is the fine print: how far apart are you, exactly?</strong> It scales smoothly with the gap — 100% for an identical answer down to 0% for the polar opposite — and the final match percentage is the average of those values across every question you answered where the candidate has a known public stance. Keeping it graded is what lets a candidate who is only <em>mildly</em> off your views rank above one who is <em>diametrically</em> opposed.
about.label_pct_diff: >
  Because of this, you may see a <span class="agree-pill agree-no">Disagree</span> label on a question that still contributed a partial amount (say, 50%) to the percentage. That's intended: you can land on opposite sides yet not be maximally far apart.
about.worked_examples_title: "Worked examples"
about.worked_examples_intro: >
  Here is exactly how each case looks, from an identical answer to a complete opposite — the cards below render just like the question-by-question breakdown on your results page:
about.example_line_one: "{n} step apart · contributes {pct} to the match"
about.example_line_many: "{n} steps apart · contributes {pct} to the match"
about.candidate_col: "Candidate"
about.skip_note: >
  Questions you skip — and questions where the candidate has no known public stance — are excluded entirely. They get no label and never count toward the percentage.
about.insufficient_note: >
  A candidate with no known stances on any of your answered questions is shown as "Insufficient data" rather than scored at 0%.
about.coverage_note: >
  Because a percentage can be misleading when it rests on only a handful of questions, every result also shows its <strong>coverage</strong> — for example, "based on 5 of 29 questions." A candidate could score 100% on the five questions we have positions for while their views on the other 24 remain unknown.
about.limited_note: >
  To keep that from being mistaken for a strong overall match, candidates we have documented on too few of your answered questions are grouped separately under <strong>"Limited information available"</strong> and sorted below the well-documented candidates, regardless of their percentage. We never guess or fill in a candidate's missing positions — they are simply ranked with less confidence until more sourced information is available.
about.opensource_title: "Open source"
about.opensource_pre: "This site is released under the"
about.opensource_license: "AGPL-3.0 license"
about.opensource_post: >
  All source code and candidate data are publicly available. Contributions, corrections, and issue reports are welcome.
about.disclaimer_title: "Disclaimer"
about.disclaimer_pre: >
  This site is an independent civic project and is not affiliated with any candidate, campaign, political party, or government agency. If you have any comments, suggestions for improvement, or concerns, please email me at
about.disclaimer_post: "or open an issue on GitHub."

