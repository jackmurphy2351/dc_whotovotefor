# --- About page ---
about.page_title: "Acerca de este sitio"
about.what_is_title: "¿Qué es esto?"
about.what_is_body: >
  es una guía electoral gratuita y de código abierto para las elecciones primarias del Partido Demócrata de Washington, DC del 16 de junio de 2026. Te ayuda a comparar candidatos según los temas que de verdad te importan, usando una escala Likert de 5 puntos.
about.sourcing_title: "¿Cómo se obtienen las posiciones de los candidatos?"
about.sourcing_p1: >
  Cada posición de un candidato debe estar enlazada directamente a una fuente primaria: el sitio web de campaña del propio candidato, una respuesta oficial a un cuestionario o un artículo periodístico verificado. Ninguna posición se publica sin una cita. No editorializamos sobre cuáles posiciones son «correctas».
about.sourcing_p2: >
  Cuando la posición de un candidato es desconocida —porque no ha abordado públicamente un tema— la marcamos como «Desconocida» en lugar de adivinar o inferir.
about.advisories_title: "Avisos sobre respaldos"
about.advisories_p1: >
  Este sitio muestra avisos sobre respaldos (como «Free DC: no clasifiques al candidato X») como opiniones de terceros con un enlace directo a la fuente. No son recomendaciones propias de este sitio: son informes objetivos de lo que han dicho organizaciones con nombre propio.
about.methodology_title: "Metodología"
about.methodology_intro: >
  Cada respuesta usa una escala de 5 puntos: <em>muy en desacuerdo</em>, <em>en desacuerdo</em>, <em>neutral</em>, <em>de acuerdo</em>, <em>muy de acuerdo</em>. Para cada pregunta que respondes, comparamos tu posición con la del candidato y observamos cuántos pasos de diferencia hay entre ambas en esa escala.
about.two_things_title: "Dos cosas que verás, y por qué pueden diferir"
about.two_things_body: >
  Cada pregunta comparada muestra una <strong>etiqueta</strong> —el titular <span class="agree-pill agree-yes">De acuerdo</span>, <span class="agree-pill agree-partial">Parcial</span> o <span class="agree-pill agree-no">En desacuerdo</span>— y también alimenta el <strong>porcentaje&nbsp;de coincidencia</strong> general del candidato. Estas miden cosas distintas, así que pueden no concordar:
about.label_rule_lead: >
  <strong>La etiqueta es un titular general: ¿de qué lado estás?</strong> Usa reglas simples e intuitivas:
about.label_rule_agree: >
  <strong>De acuerdo</strong> — la misma posición.
about.label_rule_partial: >
  <strong>Parcial</strong> — un paso de diferencia: están del <em>mismo lado</em> y solo difieren en intensidad (por ejemplo, <em>muy de acuerdo</em> frente a <em>de acuerdo</em>).
about.label_rule_disagree: >
  <strong>En desacuerdo</strong> — dos o más pasos de diferencia. Estar en lados opuestos, o que uno sea neutral mientras el otro está comprometido, cuenta como desacuerdo, no como acuerdo «parcial».
about.percentage_rule: >
  <strong>El porcentaje es la letra pequeña: ¿exactamente cuán distantes están?</strong> Escala de forma gradual con la diferencia —100% para una respuesta idéntica hasta 0% para la opuesta extrema— y el porcentaje de coincidencia final es el promedio de esos valores en cada pregunta que respondiste y en la que el candidato tiene una postura pública conocida. Mantenerlo gradual es lo que permite que un candidato que solo está <em>levemente</em> alejado de tus opiniones se ubique por encima de uno <em>diametralmente</em> opuesto.
about.label_pct_diff: >
  Por esto, puedes ver una etiqueta de <span class="agree-pill agree-no">En desacuerdo</span> en una pregunta que aun así aportó una cantidad parcial (digamos, 50%) al porcentaje. Es intencional: pueden estar en lados opuestos y, aun así, no estar lo más distantes posible.
about.worked_examples_title: "Ejemplos prácticos"
about.worked_examples_intro: >
  Así se ve exactamente cada caso, desde una respuesta idéntica hasta una completamente opuesta; las tarjetas a continuación se muestran igual que el desglose pregunta por pregunta de tu página de resultados:
about.example_line_one: "{n} paso de diferencia · aporta {pct} a la coincidencia"
about.example_line_many: "{n} pasos de diferencia · aporta {pct} a la coincidencia"
about.candidate_col: "Candidato"
about.skip_note: >
  Las preguntas que omites —y aquellas en las que el candidato no tiene una postura pública conocida— se excluyen por completo. No reciben etiqueta y nunca cuentan para el porcentaje.
about.insufficient_note: >
  Un candidato sin posturas conocidas en ninguna de las preguntas que respondiste se muestra como «Datos insuficientes» en lugar de calificarse con 0%.
about.coverage_note: >
  Como un porcentaje puede ser engañoso cuando se basa en apenas un puñado de preguntas, cada resultado también muestra su <strong>cobertura</strong>; por ejemplo, «basado en 5 de 29 preguntas». Un candidato podría obtener 100% en las cinco preguntas para las que tenemos posiciones, mientras sus opiniones sobre las otras 24 siguen siendo desconocidas.
about.limited_note: >
  Para evitar que esto se confunda con una coincidencia general alta, los candidatos sobre los que tenemos documentación en muy pocas de las preguntas que respondiste se agrupan por separado bajo <strong>«Información limitada disponible»</strong> y se ordenan por debajo de los candidatos bien documentados, sin importar su porcentaje. Nunca adivinamos ni rellenamos las posiciones faltantes de un candidato: simplemente se clasifican con menos confianza hasta que haya más información con fuentes disponible.
about.opensource_title: "Código abierto"
about.opensource_pre: "Este sitio se publica bajo la"
about.opensource_license: "licencia AGPL-3.0"
about.opensource_post: >
  Todo el código fuente y los datos de los candidatos están disponibles públicamente. Se agradecen las contribuciones, correcciones e informes de problemas.
about.disclaimer_title: "Aviso legal"
about.disclaimer_pre: >
  Este sitio es un proyecto cívico independiente y no está afiliado a ningún candidato, campaña, partido político ni agencia gubernamental. Si tienes comentarios, sugerencias de mejora o inquietudes, escríbeme a
about.disclaimer_post: "o abre un issue en GitHub."

