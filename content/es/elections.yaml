# Spanish overlay for elections. Only translatable text; slugs match content/elections.yaml.
- slug: ward1
  title: "Concejal del Ward 1"
  short_description: >
    Cinco demócratas compiten para reemplazar a la concejal saliente Brianne Nadeau
    en las primarias del 16 de junio.
  whats_at_stake: |
    El Ward 1 abarca Columbia Heights, Mt. Pleasant, Adams Morgan, Petworth, Shaw
    y partes de U Street. El distrito tiene una gran comunidad latina, un importante
    inventario de vivienda asequible y presiones continuas de gentrificación. La
    concejal saliente Brianne Nadeau ha respaldado a Rashida Brown. Cinco demócratas
    están en las primarias, y el voto por orden de preferencia (ranked choice voting)
    se aplica por primera vez en junio de 2026.

- slug: mayor
  title: "Elección a la Alcaldía"
  short_description: >
    Elige al próximo alcalde de DC: siete demócratas están en la boleta de las primarias del
    16 de junio.
  whats_at_stake: |
    El alcalde fija el presupuesto anual de DC, nombra a todos los jefes de las principales
    agencias (incluido el jefe del MPD) y es el principal negociador del Distrito con el Congreso
    y la Casa Blanca. En 2026, con las amenazas federales a la autonomía de DC en aumento, esta
    contienda tiene un peso adicional. La alcaldesa en funciones, Muriel Bowser, no busca la
    reelección. Siete demócratas compiten en las primarias, y el voto por orden de preferencia
    (ranked choice voting) se aplica por primera vez en junio de 2026.

- slug: delegate
  title: "Delegado sin Voto ante el Congreso"
  short_description: >
    Elige al próximo defensor de DC en la Cámara de Representantes de los EE. UU. Eleanor Holmes
    Norton se retira tras 35 años en el cargo.
  whats_at_stake: |
    El delegado de DC puede hablar en el pleno de la Cámara, servir en comités, presentar
    legislación y luchar por el presupuesto del Distrito, pero no puede votar en la aprobación
    final de los proyectos de ley. La titular Eleanor Holmes Norton no busca la reelección tras
    18 mandatos. Esta es una de las contiendas por la delegación más competitivas y costosas en
    la historia de DC. Cinco demócratas están en las primarias, y el voto por orden de preferencia
    (ranked choice voting) se aplica por primera vez en junio de 2026.

- slug: at_large_mcduffie
  title: "Concejo At-Large — Elección Especial (puesto de McDuffie)"
  short_description: >
    Una elección general especial no partidista para ocupar el puesto At-Large que quedó vacante
    cuando Kenyan McDuffie se postuló a la alcaldía.
  whats_at_stake: |
    Esta es una ELECCIÓN GENERAL ESPECIAL NO PARTIDISTA, no una primaria demócrata. Las elecciones
    especiales para ocupar una vacante del Concejo son no partidistas por ley y están abiertas a
    TODOS los votantes registrados de DC sin importar su partido; los candidatos se postulan como
    independientes como consecuencia de esa regla, no por elección. Cuatro candidatos (Doni
    Crawford, Khalil Lee, Jacque Patterson y Elissa Silverman) están en la boleta del 16 de junio.
    A diferencia de las otras contiendas de la boleta, el ganador de esta elección especial NO
    avanza a noviembre: asume el cargo una vez certificados los resultados y sirve solo el resto del
    mandato de Kenyan McDuffie, hasta el 2 de enero de 2027. El mismo puesto se disputa luego por un
    mandato completo de cuatro años en la elección general de noviembre de 2026. El voto por orden
    de preferencia (ranked choice voting) se aplica por primera vez en junio de 2026.

- slug: at_large_bonds
  title: "Concejo At-Large — Elección Regular"
  short_description: >
    Puesto At-Large vacante por la jubilación de Anita Bonds. Nueve demócratas están en la boleta
    de las primarias del 16 de junio.
  whats_at_stake: |
    Esta primaria demócrata regular ocupa UN puesto At-Large: el de la concejal saliente Anita
    Bonds. Nueve demócratas compiten y, como aparecen tres o más candidatos en la boleta, el voto
    por orden de preferencia (ranked choice voting) se aplica por primera vez en junio de 2026; el
    único ganador se convierte en el nominado demócrata para la elección general de noviembre. Esta
    es una de dos contiendas At-Large en la boleta del 16 de junio; la otra es la elección ESPECIAL
    NO PARTIDISTA por separado para el puesto que Kenyan McDuffie dejó vacante al postularse a la
    alcaldía. DC tiene cuatro puestos At-Large, de los cuales dos se disputan en 2026. Los miembros
    At-Large representan a todo el Distrito y cumplen mandatos de cuatro años.

- slug: ward5
  title: "Concejal del Ward 5"
  short_description: >
    El titular Zachary Parker enfrenta a dos contendientes en las primarias demócratas del 16 de
    junio.
  whats_at_stake: |
    El Ward 5 abarca una amplia franja del noreste de DC, incluyendo Trinidad, Brentwood, Langdon,
    Edgewood, Michigan Park, Brookland, Lamond-Riggs, Fort Lincoln y el corredor de Ivy City. El
    concejal titular Zachary Parker, el primer miembro del Concejo negro y abiertamente gay en la
    historia de DC, busca la reelección. El distrito ha visto una importante presión de desarrollo
    a lo largo de los corredores de NoMa, Ivy City y Rhode Island Avenue, y una marcada
    disminución de la delincuencia violenta durante la gestión de Parker. Tres demócratas están en
    la boleta de las primarias, y el voto por orden de preferencia (ranked choice voting) se aplica
    por primera vez en junio de 2026.

- slug: ward6
  title: "Concejal del Ward 6"
  short_description: >
    El titular Charles Allen, con tres mandatos, enfrenta a dos contendientes en las primarias
    demócratas del 16 de junio.
  whats_at_stake: |
    El Ward 6 es el único distrito con vecindarios en los cuatro cuadrantes de la ciudad: Capitol
    Hill, Southwest Waterfront y el Wharf, Navy Yard y Capitol Riverfront, NoMa, Penn Quarter,
    Gallery Place-Chinatown y Buzzard Point. El titular Charles Allen, con tres mandatos, un
    progresista que presidió el comité judicial y de seguridad pública del Concejo, busca la
    reelección. La seguridad pública —incluidas las disputas sobre los datos de delincuencia y la
    respuesta de la ciudad a las «tomas de adolescentes» (teen takeovers)— es el tema central que
    lo separa de los contendientes Gloria Nauden y Michael Murphy. Tres demócratas están en la
    boleta de las primarias, y el voto por orden de preferencia (ranked choice voting) se aplica
    por primera vez en junio de 2026.
