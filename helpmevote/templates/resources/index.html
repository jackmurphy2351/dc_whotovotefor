{% extends "base.html" %}
{% block title %}{{ t("title.resources") }} — {{ t("site.name") }}{% endblock %}

{% block content %}
<h1>{{ t("resources.index_title") }}</h1>
<p class="lead">{{ t("resources.index_lead") }}</p>

<ul class="resource-list">
  {% for topic in topics %}
  <li>
    <a href="{{ url_for('resources.topic', topic=topic.slug) }}">{{ topic.title }}</a>
  </li>
  {% endfor %}
</ul>
{% endblock %}
